# One-time owner-authorized release control; isolated branch, never merged.
# The additive live migration succeeded in run 34779443242, prepare job.
# This invokes the existing safe live workflow without changing its safeguards.
name: 42 - Owner-authorized Levonis release (dispatch verified Main)
on:
  push:
    branches: [codex/release-levonis-20260913]
    paths: ['.github/workflows/release-levonis-20260913-once.yml']
permissions:
  contents: read
concurrency: staging-deploy
jobs:
  dispatch:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/release-levonis-20260913' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify migrated schema gate and exact merged source before DEPLOY-CODE
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: 66de31c93ac2ef601b1c3bf9442ee10e19b6ea4c
          EXPECTED_MAIN: 6b373ded26a1606fd4a545f9cf42c7dc5769094d
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/justrandoomis/Levonis';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          async function get(path) {const r=await fetch(base+path,{headers}); if(!r.ok) throw new Error(`GitHub ${r.status} at ${path}`); return r.json();}
          const jobs=await get('/actions/runs/34779443242/jobs');
          const prepare=jobs.jobs.find(j=>j.name==='prepare');
          if(prepare?.conclusion!=='success') throw new Error('Live additive migration was not verified');
          const ci=await get('/actions/runs/34776438988');
          if(ci.head_sha!==process.env.EXPECTED_SOURCE || ci.conclusion!=='success') throw new Error('Exact-source full CI not green');
          const source=await get('/commits/'+process.env.EXPECTED_SOURCE);
          const main=await get('/commits/Main');
          if(main.sha!==process.env.EXPECTED_MAIN || main.commit.tree.sha!==source.commit.tree.sha || !main.parents.some(p=>p.sha===process.env.EXPECTED_SOURCE)) throw new Error('Main differs from the reviewed owner-authorized merge');
          const r=await fetch(base+'/actions/workflows/deploy-staging-code.yml/dispatches',{
            method:'POST',headers,body:JSON.stringify({ref:'Main',inputs:{confirm:'DEPLOY-CODE'}})
          });
          if(!r.ok) throw new Error('Existing live deployment dispatch failed: HTTP '+r.status);
          console.log('Existing deploy-staging-code.yml dispatched with DEPLOY-CODE on Main '+main.sha);
          console.log('Live target: levonis-staging -> levonis-iq.com. No settings or policy content changed by this dispatcher.');
          JS
