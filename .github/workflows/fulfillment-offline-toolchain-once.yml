# Temporary development toolchain transfer; no deployment or production access.
name: 48 - Fulfillment offline test toolchain (read-only)
on:
  push:
    branches: [codex/model-fulfillment-pricing]
    paths: ['.github/workflows/fulfillment-offline-toolchain-once.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        working-directory: studio
      - name: Mirror only public runtime and lockfile-installed workspace dependencies
        run: |
          mkdir -p /tmp/fulfillment-runtime/bin
          cp "$(command -v node)" /tmp/fulfillment-runtime/bin/node
          node --version > /tmp/fulfillment-runtime/version.txt
          tar czf /tmp/fulfillment-runtime.tar.gz -C /tmp fulfillment-runtime
          tar czf /tmp/fulfillment-studio-modules.tar.gz studio/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: fulfillment-offline-runtime
          path: |
            /tmp/fulfillment-runtime.tar.gz
            /tmp/fulfillment-studio-modules.tar.gz
          retention-days: 1
