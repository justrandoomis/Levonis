# Claude runs only when the repository owner explicitly mentions @claude.
# The Anthropic API key stays in GitHub Actions secrets (never in source).
name: Claude Code - Owner Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      ${{
        github.actor == 'justrandoomis' && (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
          (github.event_name == 'issues' && (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude')))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify Anthropic API access (no key or response output)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set in GitHub Actions secrets"
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/anthropic-preflight.json" --write-out '%{http_code}' --request POST 'https://api.anthropic.com/v1/messages' --header "x-api-key: $ANTHROPIC_API_KEY" --header 'anthropic-version: 2023-06-01' --header 'content-type: application/json' --data '{"model":"claude-sonnet-5-5","max_tokens":64,"messages":[{"role":"user","content":"Reply OK."}]}')
          if [ "$status" != '200' ]; then
            error_type=$(jq -r '.error.type // "unknown"' "$RUNNER_TEMP/anthropic-preflight.json" 2>/dev/null || echo unknown)
            echo "::error::Anthropic API returned HTTP $status ($error_type). Check API key, credits/billing, model access and rate limits."
            exit 1
          fi
          echo 'Anthropic API request succeeded (credential, model and billing verified).'
          rm -f "$RUNNER_TEMP/anthropic-preflight.json"
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Bash(npm ci:*),Bash(npm run check:*),Bash(npm run test:unit:*),Bash(npm run build:*)"
      - name: Diagnose Claude Code launch failure (sanitized)
        if: ${{ failure() && steps.claude.outcome == 'failure' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          timeout 45 "$HOME/.local/bin/claude" -p 'Reply OK' --model claude-sonnet-5-5 --max-turns 1 --output-format json > "$RUNNER_TEMP/claude-cli-diagnostic.json" 2> "$RUNNER_TEMP/claude-cli-stderr.txt"
          code=$?
          set -e
          if [ "$code" -eq 0 ] && jq -e '.is_error == false' "$RUNNER_TEMP/claude-cli-diagnostic.json" >/dev/null 2>&1; then
            echo '::notice::Direct Claude Code CLI succeeded. Only the GitHub action SDK failed.'
            exit 0
          fi
          result=$(jq -r '.result // .error.message // ""' "$RUNNER_TEMP/claude-cli-diagnostic.json" 2>/dev/null || true)
          diagnostic="$result $(cat "$RUNNER_TEMP/claude-cli-stderr.txt" 2>/dev/null)"
          case "$diagnostic" in
            *'Credit balance is too low'*) echo '::error::Claude Code reports insufficient credit or eligibility (the Messages API probe succeeded). Check workspace billing and Claude Code access.' ;;
            *'API Error: 401'*|*'authentication_failed'*) echo '::error::Claude Code CLI authentication failed. Try a new Anthropic API key.' ;;
            *'API Error: 404'*|*'model not found'*) echo '::error::Claude Code CLI model not available.' ;;
            *'rate_limit_error'*|*'API Error: 429'*) echo '::error::Claude Code CLI rate limit reached.' ;;
            *) echo "::error::Claude Code CLI failed (exit status $code); raw output withheld to protect repository data." ;;
          esac
