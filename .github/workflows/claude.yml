# Owner-only Claude Code assistant. The official action SDK is currently failing
# after initialization (issue #48); direct Claude Code CLI was tested successfully.
# @claude = read-only advice; @claude apply = edit, validate, and publish through
# the repository's existing full live-deployment gate. Never expose API secrets.
#
# Each job holds only what it needs (review 2026-10-13, docs/DECISIONS.md row 219):
#   claude  - runs Claude Code with a READ-ONLY token. ANTHROPIC_API_KEY reaches
#             the CLI only: every Bash command and hook Claude starts runs in the
#             CLI's bubblewrap sandbox with credentials scrubbed from its
#             environment (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB). In apply mode the
#             change leaves this job only as a patch, built with a git directory
#             created after Claude finished, and checked by
#             scripts/claude-publish-gate.py.
#   verify  - the same complete gate as workflow 7 (check + every root shard +
#             workspaces + Studio), in parallel, on the base commit plus the
#             patch: minutes, not the hour one unsharded job took. Read-only
#             token, no secrets: Claude-written code (npm lifecycle scripts,
#             configs, tests) runs only here.
#   publish - applies the verified patch to the current default branch, re-runs
#             the gate on the exact staged set, commits with hooks off, pushes,
#             and dispatches workflow 7. It runs no code from the change.
#   comment - posts the outcome to the owner's issue or pull request.
name: Claude Code - Owner Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

concurrency:
  group: levonis-claude-owner
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      ${{
        github.actor == 'justrandoomis' && github.triggering_actor == 'justrandoomis' && (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
          (github.event_name == 'issues' && (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude')))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Read-only: nothing Claude runs can push, dispatch a deploy or comment.
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      number: ${{ steps.request.outputs.number }}
      base: ${{ steps.base.outputs.sha }}
      executed: ${{ steps.execute.outcome }}
      changed: ${{ steps.package.outputs.changed }}
      refusal: ${{ steps.package.outputs.refusal }}

    steps:
      - name: Checkout current default branch without exposing credentials to Claude
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record the exact commit Claude starts from
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tested Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.296 --no-audit --no-fund

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs every Bash command and hook in a
      # bubblewrap sandbox (its own PID namespace, no new privileges, so no
      # sudo) with the API key removed from its environment. Without bubblewrap
      # and socat the CLI refuses to start: it never runs unscrubbed.
      - name: Install the subprocess sandbox that keeps the API key from Claude's commands
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns > /dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent true

      - name: Prepare user request and opt-in mode
        id: request
        run: |
          set -euo pipefail
          jq -r '
            if .comment then .comment.body
            elif .review then .review.body
            elif .issue then (.issue.body // "") + "\n" + .issue.title
            else "" end
          ' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/claude-task.txt"
          number=$(jq -r '.issue.number // .pull_request.number // empty' "$GITHUB_EVENT_PATH")
          test -n "$number"
          first_line=$(head -n 1 "$RUNNER_TEMP/claude-task.txt")
          mode=review
          if [[ "$first_line" =~ ^[[:space:]]*@claude[[:space:]]+apply([[:space:]]|$) ]] && [[ "$GITHUB_EVENT_NAME" == issues || "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            mode=apply
          fi
          ultracode=false
          if [ "$mode" = apply ] && [[ "$first_line" =~ ^[[:space:]]*@claude[[:space:]]+apply[[:space:]]+ultracode([[:space:]]|$) ]]; then
            ultracode=true
          fi
          echo "ultracode=$ultracode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Claude mode: $mode (read-only unless explicitly @claude apply)"

      - name: Install test dependencies for intensive Ultracode jobs
        if: steps.request.outputs.ultracode == 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd studio && npm ci --no-audit --no-fund)

      - name: Run Claude Code directly using Anthropic secret
        id: execute
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          MODE: ${{ steps.request.outputs.mode }}
          ULTRACODE: ${{ steps.request.outputs.ultracode }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::Missing GitHub Actions secret ANTHROPIC_API_KEY"; exit 1; }

          {
            echo 'Work in the Levonis repository. Follow CLAUDE.md and the repository conventions.'
            echo 'Never reveal credentials or secrets. Never edit .github/, .claude/, any CLAUDE.md, credential files, package.json scripts or the deploy scripts, or deploy from inside Claude Code.'
            echo 'Never run git commit or git push: the workflow handles verification and publishing.'
            if [ "$MODE" = apply ]; then
              echo 'MODE: APPLY. Implement the owner request in workspace files. Do not commit or publish. The workflow will validate changes and publish only if checks pass.'
            else
              echo 'MODE: REVIEW ONLY. Do not modify, create, or delete any repository file. Analyze and answer the request using code evidence.'
            fi
            echo 'Keep the final answer concise and cite relevant repository file paths.'
            echo
            echo 'Owner request:'
            cat "$RUNNER_TEMP/claude-task.txt"
          } > "$RUNNER_TEMP/claude-prompt.txt"

          # Only explicit "@claude apply ultracode" enables the more expensive
          # Opus 5.5 + Ultracode (dynamic coding workflows) + maximum effort.
          # No agent-turn cap; a client-estimated 190 USD safeguard per run.
          # All other owner commands retain the tested Sonnet/5 USD settings.
          # The Bash allowlists name inspection and the repository's own checks
          # only: sed, find, rg, npx and other prefixes that execute arbitrary
          # commands are not allowed (review 2026-10-13). The checks run code
          # Claude can edit, which is why every subprocess is sandboxed without
          # the key.
          args=(--print --model claude-sonnet-5-5 --max-turns 20 --max-budget-usd 5 --output-format json --permission-mode dontAsk --disallowedTools 'mcp__*')
          if [ "$ULTRACODE" = 'true' ]; then
            args=(--print --model claude-opus-5-5 --effort max --settings '{"ultracode":true}' --max-budget-usd 190 --output-format json --permission-mode dontAsk --disallowedTools 'mcp__*')
            args+=(--tools 'Read,Glob,Grep,Edit,Write,Bash,Agent' --allowedTools 'Read,Glob,Grep,Edit,Write,Agent,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(grep:*),Bash(npm run check:*),Bash(npm run test:unit:*),Bash(node --import tsx --test:*),Bash(npm run build:*)')
          elif [ "$MODE" = apply ]; then
            args+=(--tools 'Read,Glob,Grep,Edit,Write,Bash' --allowedTools 'Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(ls:*)')
          else
            args+=(--tools 'Read,Glob,Grep' --allowedTools 'Read,Glob,Grep')
          fi

          # The response JSON stays in the runner and is NOT dumped into logs.
          claude "${args[@]}" < "$RUNNER_TEMP/claude-prompt.txt" > "$RUNNER_TEMP/claude-result.json"
          # -I and a directory Claude did not work in: never import a module
          # that Claude wrote while the key is in this environment.
          cd "$RUNNER_TEMP"
          python3 -I - "$RUNNER_TEMP/claude-result.json" "$RUNNER_TEMP/claude-answer.txt" <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          if result.get("is_error") is not False:
              raise SystemExit("Claude Code returned an error; no changes will be published.")
          message = str(result.get("result") or "(Claude completed without a text summary.)")[:16000]
          # The answer is posted as a comment in a PUBLIC repository, where
          # GitHub does not mask secrets.
          key = os.environ["ANTHROPIC_API_KEY"]
          forms = {key, base64.b64encode(key.encode()).decode(), base64.urlsafe_b64encode(key.encode()).decode()}
          if any(form and form in message for form in forms):
              message = "(The answer was withheld because it contained a credential.)"
          Path(sys.argv[2]).write_text(message)
          PY

      # Claude may have rewritten anything in the workspace, its .git included
      # (config, hooks, fsmonitor, filters). So the change is read with a git
      # directory created only now, with no system or global config, holding
      # the base commit fetched again from GitHub.
      - name: Package the proposed change with a git directory Claude never touched
        id: package
        if: steps.request.outputs.mode == 'apply' && steps.execute.outcome == 'success'
        env:
          BASE: ${{ steps.base.outputs.sha }}
          READ_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          GIT_DIR=$(mktemp -d "$RUNNER_TEMP/pristine-git.XXXXXXXX")
          export GIT_DIR GIT_WORK_TREE="$GITHUB_WORKSPACE"
          git init -q
          git config core.bare false
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)" \
            fetch -q --depth=1 --no-tags "$REPO_URL" "$BASE"
          git update-ref refs/heads/base "$BASE"
          git symbolic-ref HEAD refs/heads/base
          git read-tree HEAD
          # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB mounts empty stand-ins over these
          # paths in the working directory (CLI 2.1.296) and leaves them behind.
          # Remove only a stand-in: an empty regular file the base commit does
          # not have. Anything with content is Claude's and goes to the gate.
          for stub in .npmrc .yarnrc .yarnrc.yml bunfig.toml .gitmodules yarn.lock pnpm-lock.yaml package.json package-lock.json \
            .env .env.local .env.development .env.development.local .env.test .env.test.local .env.production .env.production.local; do
            if [ -f "$GITHUB_WORKSPACE/$stub" ] && [ ! -L "$GITHUB_WORKSPACE/$stub" ] && [ ! -s "$GITHUB_WORKSPACE/$stub" ] \
              && ! git cat-file -e "HEAD:$stub" 2>/dev/null; then
              rm -f -- "$GITHUB_WORKSPACE/$stub"
            fi
          done
          git add -A
          if git diff --cached --quiet HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gate=$(mktemp "$RUNNER_TEMP/claude-publish-gate.XXXXXXXX")
          git show "HEAD:scripts/claude-publish-gate.py" > "$gate"
          if ! python3 -I "$gate"; then
            echo 'refusal=protected' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/claude-changes"
          git diff --cached --binary --no-renames HEAD > "$RUNNER_TEMP/claude-changes/changes.patch"
          echo "$BASE" > "$RUNNER_TEMP/claude-changes/base.txt"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Refuse a change that carries the API key
        if: steps.package.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -I - <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path
          key = os.environ["ANTHROPIC_API_KEY"].encode()
          data = Path(os.environ["RUNNER_TEMP"], "claude-changes", "changes.patch").read_bytes()
          forms = {key, base64.b64encode(key), base64.urlsafe_b64encode(key)}
          if any(form and form in data for form in forms):
              print("::error::The proposed change contains the API key; it is not published.")
              sys.exit(1)
          PY

      - name: Keep the answer for the comment
        if: always() && steps.execute.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claude-answer
          path: ${{ runner.temp }}/claude-answer.txt
          retention-days: 7
          if-no-files-found: ignore

      # Kept whatever happens next: a change that fails verification or meets
      # newer code on the default branch is not lost with the runner.
      - name: Keep the proposed change
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-changes
          path: ${{ runner.temp }}/claude-changes/
          retention-days: 14
          if-no-files-found: error

  # The release gate of workflow 7 (.github/workflows/verify-all.yml), one job
  # per part, all in parallel, on the exact base plus the patch. Nothing is
  # published unless every part passes.
  verify:
    needs: claude
    if: ${{ needs.claude.outputs.changed == 'true' }}
    name: Verify the proposed change (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        part: ['checks', 'root 1/16', 'root 2/16', 'root 3/16', 'root 4/16', 'root 5/16', 'root 6/16', 'root 7/16', 'root 8/16', 'root 9/16', 'root 10/16', 'root 11/16', 'root 12/16', 'root 13/16', 'root 14/16', 'root 15/16', 'root 16/16', 'workspaces', 'studio']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claude.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: claude-changes
          path: ${{ runner.temp }}/claude-changes
      - name: Apply the proposed change to its base commit
        run: git apply --index --whitespace=nowarn "$RUNNER_TEMP/claude-changes/changes.patch"
      # No dependency cache: unreviewed code must not save cache entries that
      # the live deploy would restore.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install the Studio workspace
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Run this part of the release gate
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          case "$PART" in
            checks) npm run check ;;
            'root '*) node scripts/test-all.mjs --suite root --shard "${PART#root }" ;;
            workspaces) node scripts/test-all.mjs --suite workspaces ;;
            studio) node scripts/test-all.mjs --suite studio ;;
            *) echo "::error::Unknown verification part: $PART"; exit 1 ;;
          esac

  publish:
    needs: [claude, verify]
    if: ${{ needs.claude.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    outputs:
      result: ${{ steps.push.outputs.result }}
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - name: Checkout the current default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: claude-changes
          path: ${{ runner.temp }}/claude-changes
      - name: Apply, check, commit and push the verified change; request the gated live deploy
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ needs.claude.outputs.base }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          # The gate as the default branch has it, copied before the change
          # can touch the work tree.
          gate="$RUNNER_TEMP/claude-publish-gate.py"
          cp scripts/claude-publish-gate.py "$gate"

          # Never overwrite newer owner changes made while Claude was working.
          # The change was verified on BASE: a newer default branch that only
          # changed prose (what workflow 7 does not deploy) still takes it; any
          # other change keeps it as this run's claude-changes artifact.
          if ! git merge-base --is-ancestor "$BASE" HEAD \
            || ! git diff --quiet --no-renames "$BASE" HEAD -- . ':(exclude,glob)docs/**' ':(exclude,glob)**/*.md'; then
            echo 'result=stale' >> "$GITHUB_OUTPUT"
            echo "::error::The default branch gained code changes while Claude worked; the verified change is kept as the claude-changes artifact of this run."
            exit 1
          fi
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/claude-changes/changes.patch"
          python3 -I "$gate"

          git -c core.hooksPath=/dev/null -c commit.gpgsign=false \
            -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q --no-verify -m 'chore: apply owner-requested Claude Code changes [skip ci]'
          # A plain push: if anyone pushed since this checkout it is refused.
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "result=pushed-undeployed" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN pushes do not trigger push workflows. The explicit
          # dispatch runs the repository's existing full verification and
          # controlled live-deployment workflow instead; its freshness check
          # applies to this dispatch like a push.
          gh workflow run deploy-staging-code.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f confirm=DEPLOY-CODE
          echo "result=pushed" >> "$GITHUB_OUTPUT"

  comment:
    needs: [claude, verify, publish]
    if: ${{ always() && github.actor == 'justrandoomis' && github.triggering_actor == 'justrandoomis' && needs.claude.result != 'skipped' && needs.claude.outputs.number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.claude.outputs.executed == 'success'
        with:
          name: claude-answer
          path: ${{ runner.temp }}/answer
      - name: Post outcome to the owner issue or pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.claude.outputs.mode }}
          NUMBER: ${{ needs.claude.outputs.number }}
          EXECUTE_OUTCOME: ${{ needs.claude.outputs.executed }}
          CHANGED: ${{ needs.claude.outputs.changed }}
          REFUSAL: ${{ needs.claude.outputs.refusal }}
          CLAUDE_RESULT: ${{ needs.claude.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.outputs.result }}
          PUBLISH_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo '### Claude Code — Levonis'
            echo
            if [ "$EXECUTE_OUTCOME" != success ]; then
              echo 'Claude Code did not finish successfully. No repository changes were published. Review the GitHub Actions job for diagnostic information.'
            else
              if [ -f "$RUNNER_TEMP/answer/claude-answer.txt" ]; then
                cat "$RUNNER_TEMP/answer/claude-answer.txt"
              fi
              echo
              if [ "$MODE" = apply ]; then
                if [ "$REFUSAL" = protected ]; then
                  echo '**Refused: the change touches protected files (workflows, Claude Code configuration or instructions, credentials, symbolic links, npm scripts or the deploy gate). Nothing was published.**'
                elif [ "$CHANGED" = false ]; then
                  echo '**No file changes were needed or saved.**'
                elif [ "$CHANGED" != true ] || [ "$CLAUDE_RESULT" != success ]; then
                  echo '**The change could not be packaged safely. Nothing was published; check the workflow log.**'
                elif [ "$VERIFY_RESULT" != success ]; then
                  echo '**Verification failed (the same checks as workflow 7). Nothing was published. The proposed change is kept as the `claude-changes` artifact of this run.**'
                elif [ "$PUBLISH_RESULT" = pushed ]; then
                  echo "**Published commit:** \`$PUBLISH_COMMIT\`."
                  echo 'The existing full CI and deployment workflow has been requested. Verify its result before treating the site as updated.'
                elif [ "$PUBLISH_RESULT" = pushed-undeployed ]; then
                  echo "**Published commit:** \`$PUBLISH_COMMIT\`."
                  echo '**The deploy request failed: start workflow 7 on the default branch to deploy it.**'
                elif [ "$PUBLISH_RESULT" = stale ]; then
                  echo '**The default branch gained code changes while Claude worked, so the verified change was not published. It is kept as the `claude-changes` artifact of this run; run the command again to rebuild it on the newest code.**'
                else
                  echo '**Publishing failed. Nothing was published; the verified change is kept as the `claude-changes` artifact of this run. Check the workflow log before doing anything else.**'
                fi
              else
                echo '**Read-only response. No code or website changes.**'
                echo 'To implement and publish a change, start your issue comment with `@claude apply` followed by your request.'
              fi
            fi
          } > "$RUNNER_TEMP/claude-comment.md"
          printf '\n[GitHub Actions run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/claude-comment.md"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/claude-comment.md"
