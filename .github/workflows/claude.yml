# Owner-only Claude Code assistant. The official action SDK is currently failing
# after initialization (issue #48); direct Claude Code CLI was tested successfully.
# @claude = read-only advice; @claude apply = edit, validate, and publish through
# the repository's existing full live-deployment gate. Never expose API secrets.
name: Claude Code - Owner Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

concurrency:
  group: levonis-claude-owner
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      ${{
        github.actor == 'justrandoomis' && (
          (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
          (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
          (github.event_name == 'issues' && (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude')))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout current default branch without exposing push credentials to Claude
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tested Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.296 --no-audit --no-fund

      - name: Prepare user request and opt-in mode
        id: request
        run: |
          set -euo pipefail
          jq -r '
            if .comment then .comment.body
            elif .review then .review.body
            elif .issue then (.issue.body // "") + "\n" + .issue.title
            else "" end
          ' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/claude-task.txt"
          number=$(jq -r '.issue.number // .pull_request.number // empty' "$GITHUB_EVENT_PATH")
          test -n "$number"
          first_line=$(head -n 1 "$RUNNER_TEMP/claude-task.txt")
          mode=review
          if [[ "$first_line" =~ ^[[:space:]]*@claude[[:space:]]+apply([[:space:]]|$) ]] && [[ "$GITHUB_EVENT_NAME" == issues || "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            mode=apply
          fi
          ultracode=false
          if [ "$mode" = apply ] && [[ "$first_line" =~ ^[[:space:]]*@claude[[:space:]]+apply[[:space:]]+ultracode([[:space:]]|$) ]]; then
            ultracode=true
          fi
          echo "ultracode=$ultracode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Claude mode: $mode (read-only unless explicitly @claude apply)"

      - name: Install test dependencies for intensive Ultracode jobs
        if: steps.request.outputs.ultracode == 'true'
        run: |
          npm ci --no-audit --no-fund
          (cd studio && npm ci --no-audit --no-fund)

      - name: Run Claude Code directly using Anthropic secret
        id: execute
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::Missing GitHub Actions secret ANTHROPIC_API_KEY"; exit 1; }

          mode="${{ steps.request.outputs.mode }}"
          {
            echo 'Work in the Levonis repository. Follow CLAUDE.md and the repository conventions.'
            echo 'Never reveal credentials or secrets. Never edit .github/, CLAUDE.md, credential files, or deploy from inside Claude Code.'
            echo 'Never run git commit or git push: the workflow handles verification and publishing.'
            if [ "$mode" = apply ]; then
              echo 'MODE: APPLY. Implement the owner request in workspace files. Do not commit or publish. The workflow will validate changes and publish only if checks pass.'
            else
              echo 'MODE: REVIEW ONLY. Do not modify, create, or delete any repository file. Analyze and answer the request using code evidence.'
            fi
            echo 'Keep the final answer concise and cite relevant repository file paths.'
            echo
            echo 'Owner request:'
            cat "$RUNNER_TEMP/claude-task.txt"
          } > "$RUNNER_TEMP/claude-prompt.txt"

          # Only explicit "@claude apply ultracode" enables the more expensive
          # Opus 5.5 + Ultracode (dynamic coding workflows) + maximum effort.
          # No agent-turn cap; a client-estimated 190 USD safeguard leaves
          # headroom beneath the owner's stated ~200 USD API balance.
          # All other owner commands retain the tested Sonnet/5 USD settings.
          args=(--print --model claude-sonnet-5-5 --max-turns 20 --max-budget-usd 5 --output-format json --permission-mode dontAsk --disallowedTools 'mcp__*')
          if [ "${{ steps.request.outputs.ultracode }}" = 'true' ]; then
            args=(--print --model claude-opus-5-5 --effort max --settings '{"ultracode":true}' --max-budget-usd 190 --output-format json --permission-mode dontAsk --disallowedTools 'mcp__*')
            args+=(--tools 'Read,Glob,Grep,Edit,Write,Bash,Agent' --allowedTools 'Read,Glob,Grep,Edit,Write,Agent,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(rg:*),Bash(ls:*),Bash(sed:*),Bash(grep:*),Bash(find:*),Bash(npm run check:*),Bash(npm run test:unit:*),Bash(npx tsx:*),Bash(node --import tsx --test:*),Bash(npm run build:*)')
          elif [ "$mode" = apply ]; then
            args+=(--tools 'Read,Glob,Grep,Edit,Write,Bash' --allowedTools 'Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(rg:*),Bash(ls:*)')
          else
            args+=(--tools 'Read,Glob,Grep' --allowedTools 'Read,Glob,Grep')
          fi

          # The response JSON stays in the runner and is NOT dumped into logs.
          claude "${args[@]}" < "$RUNNER_TEMP/claude-prompt.txt" > "$RUNNER_TEMP/claude-result.json"
          python3 - "$RUNNER_TEMP/claude-result.json" "$RUNNER_TEMP/claude-answer.txt" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          if result.get("is_error") is not False:
              raise SystemExit("Claude Code returned an error; no changes will be published.")
          message = result.get("result") or "(Claude completed without a text summary.)"
          Path(sys.argv[2]).write_text(str(message)[:16000])
          PY

      - name: Verify, commit and trigger the existing gated live deploy only on explicit apply
        id: publish
        if: steps.request.outputs.mode == 'apply' && steps.execute.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'result=no_changes' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to publish anything that could modify the workflow's own
          # permissions, agent instructions, credentials, or hidden environment.
          python3 - <<'PY'
          import subprocess
          import sys
          data = subprocess.check_output(
              ["git", "status", "--porcelain", "-z", "--untracked-files=all"]
          ).split(b"\0")
          for value in data:
              if not value:
                  continue
              path = value[3:].decode("utf-8", "replace") if len(value) >= 4 else ""
              basename = path.rsplit("/", 1)[-1]
              if (path.startswith(".github/") or path == "CLAUDE.md"
                  or basename.startswith(".env") or basename.startswith(".dev.vars")
                  or basename in (".npmrc", ".netrc")):
                  print("::error::Refusing to publish protected workflow/instruction/credential files.")
                  sys.exit(1)
          PY

          npm ci --no-audit --no-fund
          (cd studio && npm ci --no-audit --no-fund)
          npm run check
          npm run test:unit

          # Never overwrite newer owner changes made while Claude was working.
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::Default branch changed; refusing to push stale edits."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: apply owner-requested Claude Code changes [skip ci]'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

          # GITHUB_TOKEN pushes do not trigger push workflows. The explicit
          # dispatch runs the repository's existing full verification and
          # controlled live-deployment workflow instead.
          gh workflow run deploy-staging-code.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f confirm=DEPLOY-CODE
          echo "result=pushed" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post outcome to the owner issue or pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.request.outputs.mode }}
          NUMBER: ${{ steps.request.outputs.number }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outputs.result }}
          PUBLISH_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$NUMBER" || exit 0
          {
            echo '### Claude Code — Levonis'
            echo
            if [ "$EXECUTE_OUTCOME" != success ]; then
              echo 'Claude Code did not finish successfully. No repository changes were published. Review the GitHub Actions job for diagnostic information.'
            else
              if [ -f "$RUNNER_TEMP/claude-answer.txt" ]; then
                cat "$RUNNER_TEMP/claude-answer.txt"
              fi
              echo
              if [ "$MODE" = apply ]; then
                if [ "$PUBLISH_OUTCOME" != success ]; then
                  echo '**Verification or publishing failed. Changes were not fully published; check the workflow log before doing anything else.**'
                elif [ "$PUBLISH_RESULT" = no_changes ]; then
                  echo '**No file changes were needed or saved.**'
                elif [ "$PUBLISH_RESULT" = pushed ]; then
                  echo "**Published commit:** \`$PUBLISH_COMMIT\`."
                  echo 'The existing full CI and deployment workflow has been requested. Verify its result before treating the site as updated.'
                fi
              else
                echo '**Read-only response. No code or website changes.**'
                echo 'To implement and publish a change, start your issue comment with `@claude apply` followed by your request.'
              fi
            fi
          } > "$RUNNER_TEMP/claude-comment.md"
          printf '\n[GitHub Actions run](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/claude-comment.md"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/claude-comment.md"
