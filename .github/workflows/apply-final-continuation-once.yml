name: 41 - Integrate reviewed final continuation once (no deployment)

on:
  push:
    branches: [codex/persistent-bloub-policy]
    paths: ['.github/continuation-parts/**', '.github/workflows/apply-final-continuation-once.yml']

permissions:
  contents: read

jobs:
  integrate:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/persistent-bloub-policy' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and apply reviewed code only
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 'ec6fff4946751772356a65c05eeef5a661806547'
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          parts = sorted(Path('.github/continuation-parts').glob('*.b64'))
          assert [p.name for p in parts] == [f'{i:03}.b64' for i in range(33)]
          data = b''.join(base64.b64decode(p.read_text(), validate=True) for p in parts)
          assert hashlib.sha256(data).hexdigest() == '08ce61a376cc25aab09c0b0bd353749b4095243a9246029b9561f16bfb815782'
          payload = json.loads(gzip.decompress(data))
          allowed = {
              '.github/workflows/verify-persistent-bloub-policy.yml',
              'src/App.tsx', 'src/pages/Checkout.tsx', 'src/pages/Policies.tsx',
              'tests/policyDrafts.test.ts', 'tests/policyPublication.test.ts',
              'worker/lib/policyOps.ts', 'worker/lib/policyPublication.ts',
              'worker/routes/orders.ts', 'worker/routes/policies.ts',
              'migrations/0070_policy_publication_acceptance.sql',
              'scripts/e2e-bloub-continuation.mjs', 'tests/browser/bloub-fixture.tsx',
              'tests/browser/bloub.html', 'tests/policyAcceptanceTransaction.test.ts',
              'worker/lib/purchaseTerms.ts',
          }
          entries = payload['edits'] + payload['new']
          assert len(entries) == len(allowed) and {e['path'] for e in entries} == allowed
          pending = []
          for entry in entries:
              path = Path(entry['path'])
              assert not path.is_symlink()
              if entry['path'].startswith('.github/workflows/'):
                  # Workflow updates require the authorized connector, not this token.
                  # The reviewed workflow was already saved through that connector.
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['after']
                  continue
              if 'before' in entry:
                  raw = path.read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == entry['before'], f'Concurrent change: {path}'
                  lines = raw.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(entry['edits']):
                      lines[edit['start']:edit['end']] = [edit['text']]
                  result = ''.join(lines).encode('utf-8')
              else:
                  assert not path.exists(), f'New file already exists: {path}'
                  result = entry['text'].encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == entry['after'], f'Output mismatch: {path}'
              pending.append((path, result))
          for path, result in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(result)
              print(f'Verified and applied: {path}')
          PY
          git add src worker tests scripts/e2e-bloub-continuation.mjs migrations/0070_policy_publication_acceptance.sql
          git diff --cached --check
      - name: Save reviewed code only to the same branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finish trilingual policy drafts, immutable dates, atomic order consent and browser regression coverage'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/persistent-bloub-policy
          git show --stat --oneline HEAD
