# ---------------------------------------------------------------------------
# WHICH WORKER SERVES WHOM (read this before running any deploy)
#
#   levonis-iq.com         -> Worker  levonis-staging          [LIVE]
#   studio.levonis-iq.com  -> Worker  levonis-studio-staging   [LIVE]
#   *.levonis-iq.com       -> Worker  levonis-staging          [LIVE]
#   Worker  levonis-studio  -> workers.dev only, NO domain     [alternate]
#   Worker  levonis         -> does not exist on the account
#
# Full table: docs/WORKERS.md
# ---------------------------------------------------------------------------
# Verifies, against the REAL origins, that Studio sign-on works, that logging
# out of the main site takes Studio access with it, that the handoff refuses
# everything it is supposed to refuse, and that Resend actually accepted a
# password-reset email and a verification email.
#
# WHAT IT WRITES. One throwaway account, with a run-scoped plus-tagged address
# derived from EMAIL_TEST_RECIPIENT so the two real emails land in the owner's
# inbox and are identifiable. It buys nothing, touches no wallet, no order and
# no ledger. Everything else it does is a GET or a SELECT.
#
# WHAT IT NEVER PRINTS. No secret value, and no token: a password-reset link
# and a verification link are live credentials, so they are asserted with SQL
# predicates that return booleans and never with anything that echoes them.
# The generated account address and password are masked before first use.
name: 15 - Verify Live Auth (SSO, logout liveness, Resend)

on:
  workflow_dispatch:
    inputs:
      apex:
        description: 'Main site origin'
        required: false
        default: 'https://levonis-iq.com'
      studio:
        description: 'Studio origin'
        required: false
        default: 'https://studio.levonis-iq.com'

concurrency: verify-live-auth

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APEX: ${{ github.event.inputs.apex || 'https://levonis-iq.com' }}
      STUDIO: ${{ github.event.inputs.studio || 'https://studio.levonis-iq.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # ---------------------------------------------------- bindings, first
      # A binding check before the behaviour check, so a failure downstream
      # can be attributed instead of guessed at. Presence only — a secret's
      # value is never read, and wrangler does not expose it anyway.
      - name: Bindings on the LIVE main Worker (levonis-staging)
        id: mainbind
        continue-on-error: true
        run: |
          set -e
          echo "secret=unknown" >> "$GITHUB_OUTPUT"
          echo "dest=unknown" >> "$GITHUB_OUTPUT"
          FAIL=0
          # Origins are compared the way the WORKER compares them. Both
          # readers strip a trailing slash before use — worker/routes/studio.ts
          # allowedDestinations() and studio/worker/auth/session.ts
          # mainSiteOrigin() both do .trim().replace(/\/+$/, '') — so a stored
          # "https://levonis-iq.com/" is correct configuration, and a check
          # that calls it wrong is a check that cries wolf.
          norm() { printf '%s' "$1" | sed 's#/*$##'; }
          APEX_N=$(norm "$APEX"); STUDIO_N=$(norm "$STUDIO")

          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-staging/settings" \
            -o /tmp/main.json
          jq -e '.success == true' /tmp/main.json > /dev/null \
            || { echo "::error::cannot read levonis-staging settings"; jq -r '.errors[]?|"  \(.code) \(.message)"' /tmp/main.json; exit 1; }

          echo "Binding names and types on levonis-staging (no values):"
          jq -r '.result.bindings[]? | "  \(.type)  \(.name)"' /tmp/main.json | sort

          # A Worker secret appears as a binding of type secret_text with no
          # readable value. That presence is the whole assertion.
          if jq -e '[.result.bindings[]? | select(.name=="STUDIO_HANDOFF_SECRET" and .type=="secret_text")] | length > 0' /tmp/main.json > /dev/null; then
            echo "STUDIO_HANDOFF_SECRET: present as a Worker SECRET"
            echo "secret=present (secret_text)" >> "$GITHUB_OUTPUT"
          else
            echo "::error::STUDIO_HANDOFF_SECRET is not a secret_text binding on levonis-staging"
            echo "secret=MISSING" >> "$GITHUB_OUTPUT"; FAIL=1
          fi

          # STUDIO_ALLOWED_DESTINATIONS is a plain var; its value is a list of
          # public origins, not a secret.
          DEST=$(jq -r '[.result.bindings[]? | select(.name=="STUDIO_ALLOWED_DESTINATIONS") | .text] | first // ""' /tmp/main.json)
          echo "STUDIO_ALLOWED_DESTINATIONS = ${DEST:-<unset>}"
          echo "dest=${DEST:-<unset>}" >> "$GITHUB_OUTPUT"
          MATCH=0
          IFS=, read -ra ENTRIES <<< "$DEST"
          for e in "${ENTRIES[@]}"; do
            [ "$(norm "$(printf '%s' "$e" | tr -d ' ')")" = "$STUDIO_N" ] && MATCH=1
          done
          if [ "$MATCH" = "1" ]; then
            echo "the live Studio origin is allow-listed (trailing slashes are stripped by the worker)"
          else
            echo "::error::STUDIO_ALLOWED_DESTINATIONS does not contain $STUDIO_N"; FAIL=1
          fi

          APP_ORIGIN=$(jq -r '[.result.bindings[]? | select(.name=="APP_ORIGIN") | .text] | first // ""' /tmp/main.json)
          echo "APP_ORIGIN = ${APP_ORIGIN:-<unset>}"
          if [ "$(norm "$APP_ORIGIN")" = "$APEX_N" ]; then
            echo "reset and verification links will be built on $APEX_N"
          else
            echo "::error::APP_ORIGIN is not $APEX_N — reset and verification links would not point there"; FAIL=1
          fi

          if jq -e '[.result.bindings[]? | select(.name=="EMAIL_API_KEY" and .type=="secret_text")] | length > 0' /tmp/main.json > /dev/null; then
            echo "EMAIL_API_KEY: present as a Worker SECRET"
          else
            echo "::error::EMAIL_API_KEY is not a secret_text binding on levonis-staging"; FAIL=1
          fi

          EMAIL_FROM=$(jq -r '[.result.bindings[]? | select(.name=="EMAIL_FROM") | .text] | first // ""' /tmp/main.json)
          if [ -n "$EMAIL_FROM" ]; then
            echo "EMAIL_FROM is set (capabilities needs BOTH it and EMAIL_API_KEY)"
          else
            echo "::error::EMAIL_FROM is empty — passwordReset and emailVerification both report false without it"; FAIL=1
          fi

          ALLOW=$(jq -r '[.result.bindings[]? | select(.name=="EMAIL_ALLOWED_RECIPIENTS") | .text] | first // ""' /tmp/main.json)
          if [ -n "$ALLOW" ]; then
            echo "::error::EMAIL_ALLOWED_RECIPIENTS is set on the live Worker — every address outside it is silently dropped, so a 'sent' email may never arrive."; FAIL=1
          else
            echo "EMAIL_ALLOWED_RECIPIENTS is empty — no staging drop filter in the way"
          fi
          exit $FAIL

      - name: Bindings on the LIVE Studio Worker (levonis-studio-staging)
        id: studiobind
        continue-on-error: true
        run: |
          set -e
          echo "secret=unknown" >> "$GITHUB_OUTPUT"
          echo "main_origin=unknown" >> "$GITHUB_OUTPUT"
          FAIL=0
          norm() { printf '%s' "$1" | sed 's#/*$##'; }
          APEX_N=$(norm "$APEX")

          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-studio-staging/settings" \
            -o /tmp/studio.json
          jq -e '.success == true' /tmp/studio.json > /dev/null \
            || { echo "::error::cannot read levonis-studio-staging settings"; exit 1; }

          echo "Binding names and types on levonis-studio-staging (no values):"
          jq -r '.result.bindings[]? | "  \(.type)  \(.name)"' /tmp/studio.json | sort

          if jq -e '[.result.bindings[]? | select(.name=="STUDIO_HANDOFF_SECRET" and .type=="secret_text")] | length > 0' /tmp/studio.json > /dev/null; then
            echo "STUDIO_HANDOFF_SECRET: present as a Worker SECRET"
            echo "secret=present (secret_text)" >> "$GITHUB_OUTPUT"
          else
            echo "::error::STUDIO_HANDOFF_SECRET is not a secret_text binding on levonis-studio-staging"
            echo "secret=MISSING" >> "$GITHUB_OUTPUT"; FAIL=1
          fi

          MAIN=$(jq -r '[.result.bindings[]? | select(.name=="MAIN_SITE_ORIGIN") | .text] | first // ""' /tmp/studio.json)
          echo "MAIN_SITE_ORIGIN = ${MAIN:-<unset>}"
          echo "main_origin=${MAIN:-<unset>}" >> "$GITHUB_OUTPUT"
          if [ "$(norm "$MAIN")" = "$APEX_N" ]; then
            echo "the server-to-server redemption will reach $APEX_N (mainSiteOrigin() strips the trailing slash)"
          else
            echo "::error::MAIN_SITE_ORIGIN is not $APEX_N — the server-to-server redemption has nowhere to go"; FAIL=1
          fi

          # Both Workers must hold the SAME secret. Neither value is readable,
          # so the guarantee comes from provenance: one repository secret feeds
          # both `wrangler secret put` calls. Recorded, not asserted.
          echo ""
          echo "Byte-equality of the two secrets is guaranteed by construction:"
          echo "both are uploaded from the single STUDIO_HANDOFF_SECRET repository secret"
          echo "(deploy-staging-code.yml and deploy-studio-code.yml). Cloudflare never"
          echo "returns a secret's value, so it cannot be compared here — and should not be."
          exit $FAIL

      # -------------------------------------------------- the live scenario
      - name: Generate a run-scoped throwaway identity
        id: identity
        env:
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: |
          set -e
          # A real, reachable inbox is required: the point of these two checks
          # is that a message actually goes somewhere. Preference order is
          # most-purpose-built first. Whichever is present, the account is
          # created on a plus-tagged variant so this run's mail is identifiable
          # and the owner's own address is never itself registered.
          BASE=""
          SOURCE=""
          for candidate in "EMAIL_TEST_RECIPIENT:$EMAIL_TEST_RECIPIENT" "E2E_ADMIN_EMAIL:$E2E_ADMIN_EMAIL" "INITIAL_ADMIN_EMAIL:$INITIAL_ADMIN_EMAIL"; do
            name="${candidate%%:*}"; value="${candidate#*:}"
            if [ -n "$value" ]; then BASE="$value"; SOURCE="$name"; break; fi
          done
          if [ -z "$BASE" ]; then
            echo "::error::No test inbox is configured. Set ONE of EMAIL_TEST_RECIPIENT, E2E_ADMIN_EMAIL or INITIAL_ADMIN_EMAIL as a repository secret. Proving an email was delivered needs somewhere to deliver it, and this workflow will not report a pass it cannot support."
            exit 1
          fi
          echo "test inbox taken from the $SOURCE repository secret (value masked)"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          LOCAL="${BASE%@*}"
          DOMAIN="${BASE#*@}"
          TAG="levo-e2e-${GITHUB_RUN_ID}"
          ADDR="${LOCAL}+${TAG}@${DOMAIN}"
          PASS="Lv-$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')-e2e"
          # Masked before either is used anywhere, so neither can reach the log.
          echo "::add-mask::$ADDR"
          echo "::add-mask::$PASS"
          echo "addr=$ADDR" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "A throwaway address was generated with the plus-tag +$TAG."
          echo "The address itself is masked; the tag is what the outbox is searched by."

      # The two email paths differ, and the difference decides how each can be
      # proved:
      #   verification -> enqueue() + processOutbox(), so the outbox records
      #                   state='sent' only after Resend answered 2xx, and the
      #                   row's payload carries the link.
      #   password reset -> sendEmail() DIRECTLY (worker/routes/auth.ts:1560,
      #                   "reset links must not sit in a queue"). No outbox row
      #                   is ever written, so an outbox-only check would report
      #                   a failure for a reset that was delivered perfectly.
      # What the reset path does leave is a console.error naming the provider's
      # status when it is refused. So the Worker's log is captured across the
      # scenario: a line here is the Resend response, and its absence alongside
      # a minted token and a 200 is what says the send was not rejected.
      - name: Start capturing the live Worker's log
        id: tail
        continue-on-error: true
        run: |
          set -e
          echo "started=no" >> "$GITHUB_OUTPUT"
          nohup npx wrangler tail levonis-staging --env staging --format json \
            > /tmp/tail.jsonl 2>/tmp/tail.err &
          echo $! > /tmp/tail.pid
          sleep 12
          if kill -0 "$(cat /tmp/tail.pid)" 2>/dev/null; then
            echo "tail attached to levonis-staging"
            echo "started=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::wrangler tail did not attach — a Resend rejection will not be visible here"
            sed -n '1,15p' /tmp/tail.err || true
          fi

      - name: Studio SSO, negative cases and logout liveness, live
        id: scenario
        continue-on-error: true
        env:
          TEST_EMAIL: ${{ steps.identity.outputs.addr }}
          TEST_PASSWORD: ${{ steps.identity.outputs.pass }}
          MERCHANT_ORIGIN: https://levo-e2e-check.levonis-iq.com
        run: |
          # WITHOUT pipefail this step CANNOT FAIL: a pipeline's status is the
          # last command's, and that is `tee`, which always succeeds. Run 2
          # reported the scenario as "success" while its own printed summary
          # said "33 checks, 5 failed" — the numbers were right and the gate
          # was reading nothing.
          set -o pipefail
          node scripts/e2e-live-auth.mjs 2>&1 | tee /tmp/scenario.log

      - name: What the provider said, from the Worker's own log
        id: providerlog
        if: always()
        continue-on-error: true
        run: |
          echo "errors=unknown" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/tail.pid ]; then kill "$(cat /tmp/tail.pid)" 2>/dev/null || true; fi
          sleep 3
          if [ "${{ steps.tail.outputs.started }}" != "yes" ]; then
            echo "no capture was running; the provider's response is not observable here"
            echo "errors=not captured" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "captured $(wc -l < /tmp/tail.jsonl) log line(s)"
          # sendEmail logs "sendEmail: provider responded <status>: <body>" on a
          # non-2xx, and outbox.ts records "resend <status>: ..." in last_error.
          # Neither contains a token or a key; the API key is never logged.
          N=$(grep -c 'provider responded\|resend [0-9]' /tmp/tail.jsonl 2>/dev/null || true)
          N=${N:-0}
          echo "provider-error lines: $N"
          if [ "$N" != "0" ]; then
            echo "What Resend answered:"
            grep -o 'provider responded [^"]*\|resend [0-9][^"]*' /tmp/tail.jsonl | head -10
            echo "::error::Resend refused at least one send — the status is above"
          else
            echo "no provider error was logged during the scenario"
          fi
          echo "errors=$N" >> "$GITHUB_OUTPUT"

      # -------------------------------------------- did Resend take them?
      # The API reporting success is not evidence a message was sent: both
      # endpoints answer identically whether or not an account exists, and the
      # outbox is where the truth is. `state='sent'` is written only after
      # Resend answered 2xx (worker/lib/outbox.ts).
      - name: Did Resend accept the two emails
        id: outbox
        continue-on-error: true
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -e
          echo "reset=unknown" >> "$GITHUB_OUTPUT"
          echo "verify=unknown" >> "$GITHUB_OUTPUT"

          # wrangler resolves a D1 database through wrangler.jsonc, whose
          # database_id is a committed *-PLACEHOLDER that the deploy workflows
          # fill in first. Skipping that is what made every query here fail —
          # the same trap workflow 12 hit and fixed, repeated in a new file.
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-db-staging") | .uuid')
          [ -n "$ID" ] || { echo "::error::levonis-db-staging not found on this account"; exit 1; }
          echo "::add-mask::$ID"
          STAGING_DB_ID="$ID" node scripts/set-deploy-ids.mjs --env staging
          grep -c 'PLACEHOLDER' wrangler.jsonc | sed 's/^/remaining placeholders: /' || true

          # Give the outbox processor a moment; sends run via ctx.waitUntil.
          sleep 20

          # wrangler prints its banner on stdout alongside the JSON, so the
          # output is captured to a file and queried ONCE. Chaining two jq
          # calls through a pipe is what produced "Cannot index object with
          # number" on the first run and turned three real answers into empty
          # strings that then read as zero.
          q() {
            npx wrangler d1 execute levonis-db-staging --remote --env staging --json \
              --command "$1" > /tmp/q.json 2>/tmp/q.err \
              || { echo "::error::query failed"; sed -n '1,10p' /tmp/q.err >&2; return 1; }
            jq -r "${2:-.[0].results}" /tmp/q.json
          }
          n() { q "$1" '.[0].results[0].n'; }

          # Never select the payload: it contains a live reset token and a live
          # verification token. Only counts and states leave the database.
          echo "Outbox rows for this run's address (by plus-tag, no payload read):"
          q "SELECT kind, state, substr(last_error,1,120) AS last_error, COUNT(*) AS n
              FROM outbox WHERE recipient LIKE '%+${TAG}@%' GROUP BY kind, state, last_error" \
            '.[0].results[] | "  \(.kind)  state=\(.state)  n=\(.n)  \(.last_error // "")"'

          SENT=$(n "SELECT COUNT(*) AS n FROM outbox WHERE recipient LIKE '%+${TAG}@%' AND state='sent'")
          TOTAL=$(n "SELECT COUNT(*) AS n FROM outbox WHERE recipient LIKE '%+${TAG}@%'")
          echo "rows: $TOTAL, accepted by Resend: $SENT"

          # THE VERIFICATION EMAIL goes through the outbox, so its row proves
          # Resend accepted it (state='sent' is written only after a 2xx) and
          # its payload carries the link. The predicate runs INSIDE SQLite and
          # returns a count — the link never comes back.
          VERIFY=$(n "SELECT COUNT(*) AS n FROM outbox
                       WHERE recipient LIKE '%+${TAG}@%' AND state='sent'
                         AND payload LIKE '%${APEX}/%verify_email=%'")
          OFFSITE=$(n "SELECT COUNT(*) AS n FROM outbox
                        WHERE recipient LIKE '%+${TAG}@%'
                          AND payload LIKE '%https://%'
                          AND payload NOT LIKE '%${APEX}%'")

          # THE PASSWORD RESET DOES NOT. worker/routes/auth.ts:1560 sends it
          # immediately through sendEmail() rather than the queue, deliberately
          # ("reset links must not sit in a queue"), so NO outbox row is ever
          # written for it — an outbox-only check would call a perfectly
          # delivered reset a failure. What it does leave is the token row,
          # inserted immediately BEFORE the send: a row proves the endpoint did
          # the work rather than refusing with 503, and the Worker log captured
          # above proves Resend did not reject the send itself.
          RESET=$(n "SELECT COUNT(*) AS n
                       FROM password_reset_tokens t JOIN users u ON u.id = t.user_id
                      WHERE u.email LIKE '%+${TAG}@%'")

          echo ""
          echo "verification email accepted by Resend, link on ${APEX} : $VERIFY"
          echo "password-reset token minted (send attempted, not 503)   : $RESET"
          echo "any queued link pointing off ${APEX}                    : $OFFSITE"
          echo "reset=$RESET" >> "$GITHUB_OUTPUT"
          echo "verify=$VERIFY" >> "$GITHUB_OUTPUT"
          echo "offsite=$OFFSITE" >> "$GITHUB_OUTPUT"

          FAIL=0
          for v in RESET VERIFY OFFSITE SENT TOTAL; do
            case "${!v}" in
              ''|*[!0-9]*) echo "::error::the query for $v returned '${!v}', not a number — the state is UNKNOWN, not empty"; FAIL=1 ;;
            esac
          done
          [ "$FAIL" = "0" ] || exit 1
          [ "$RESET" -ge 1 ] || { echo "::error::no password-reset token was minted — the endpoint refused rather than sending"; FAIL=1; }
          [ "$VERIFY" -ge 1 ] || { echo "::error::no verification email was accepted by Resend for this run"; FAIL=1; }
          [ "$OFFSITE" = "0" ] || { echo "::error::a queued email for this run carries a link outside ${APEX}"; FAIL=1; }
          exit $FAIL

      - name: Result
        if: always()
        run: |
          {
            echo "## Live auth verification"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| levonis-staging · STUDIO_HANDOFF_SECRET | ${{ steps.mainbind.outputs.secret }} |"
            echo "| levonis-staging · STUDIO_ALLOWED_DESTINATIONS | ${{ steps.mainbind.outputs.dest }} |"
            echo "| levonis-studio-staging · STUDIO_HANDOFF_SECRET | ${{ steps.studiobind.outputs.secret }} |"
            echo "| levonis-studio-staging · MAIN_SITE_ORIGIN | ${{ steps.studiobind.outputs.main_origin }} |"
            echo "| Scenario (SSO, negatives, logout liveness) | ${{ steps.scenario.outcome }} |"
            echo "| Verification email accepted by Resend (outbox state=sent) | ${{ steps.outbox.outputs.verify }} |"
            echo "| Password-reset token minted (immediate send, no outbox row) | ${{ steps.outbox.outputs.reset }} |"
            echo "| Provider-error lines in the Worker log | ${{ steps.providerlog.outputs.errors }} |"
            echo "| Queued links pointing off ${{ env.APEX }} | ${{ steps.outbox.outputs.offsite }} |"
            echo ""
            echo '```'
            sed -n '/^=\{40,\}$/,$p' /tmp/scenario.log 2>/dev/null | head -60 || echo "(scenario produced no summary)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-auth-verification
          path: |
            /tmp/scenario.log
            /tmp/live-auth-results.json
          if-no-files-found: warn

      - name: Fail the run if anything failed
        if: always()
        run: |
          [ "${{ steps.scenario.outcome }}" = "success" ] || { echo "::error::the live scenario failed"; exit 1; }
          [ "${{ steps.outbox.outcome }}" = "success" ] || { echo "::error::the email delivery check failed"; exit 1; }
          [ "${{ steps.mainbind.outcome }}" = "success" ] || { echo "::error::the main Worker binding check failed"; exit 1; }
          [ "${{ steps.studiobind.outcome }}" = "success" ] || { echo "::error::the Studio Worker binding check failed"; exit 1; }
          [ "${{ steps.providerlog.outputs.errors }}" = "0" ] || { echo "::error::Resend rejected a send, or its response could not be observed (${{ steps.providerlog.outputs.errors }})"; exit 1; }
          echo "every check passed"
