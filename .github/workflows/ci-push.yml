# ---------------------------------------------------------------------------
# CHECKS EVERY PUSH TO THE DEFAULT BRANCH, AND EVERY PULL REQUEST.
#
# Cloudflare Workers Builds deploys every push to claude/new-session-2hq4ci
# straight to levonis-iq.com, with no tests (docs/WORKERS.md). Until now the
# unit suite ran only inside "7 - Deploy LIVE main site", which is manual —
# so a push could go live with a red suite and nothing would say so.
#
# This workflow does not deploy and does not gate the Workers Builds deploy
# (only switching that integration off in Cloudflare can). What it does is
# make a red push visible on the commit within minutes, with the same two
# commands workflow 7 runs before it deploys: `npm run check` and
# `npm run test:unit`, which includes the authorization and cost-leak suites
# (tests/costLeaksPhase0.test.ts, tests/adminScope.test.ts, …).
#
# Read-only: no secrets, no Cloudflare token, no writes.
# ---------------------------------------------------------------------------
name: CI - check and unit tests on push

on:
  push:
    branches: [claude/new-session-2hq4ci]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # `npm run check` typechecks studio/ too and fails when that workspace
      # is not installed — the same step workflow 7 runs, for the same reason.
      - name: Install the Studio workspace (npm run check covers it)
        working-directory: studio
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint and unit tests
        run: |
          npm run check
          npm run test:unit
