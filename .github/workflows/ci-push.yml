# ---------------------------------------------------------------------------
# CHECKS EVERY PULL REQUEST AND EVERY PUSH TO ANY OTHER BRANCH.
#
# The default branch is checked by workflow 7 itself, which runs these same
# full gates — `npm run check` and all suites from `npm run test:unit`, including the
# authorization and cost-leak suites (tests/costLeaksPhase0.test.ts,
# tests/costRoleMatrix.test.ts, …) — before it migrates and deploys. This
# workflow does not deploy.
#
# Read-only: no secrets, no Cloudflare token, no writes.
# ---------------------------------------------------------------------------
name: CI - check and unit tests (pull requests and other branches)

on:
  # Pushes to the default branch use the same complete parallel gate in workflow 7,
  # before it migrates and deploys; this covers what that does not.
  pull_request:
  push:
    branches-ignore: [claude/new-session-2hq4ci]

permissions:
  contents: read

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/verify-all.yml

  # Temporary development artifact for this branch only; the release CI remains unchanged.
  source_for_local_review:
    if: github.ref == 'refs/heads/codex/complete-direct-stock-preorder-discount'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked development dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Studio dependencies
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Package dependencies for isolated local validation
        run: tar -czf local-deps.tar.gz node_modules studio/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: levonis-local-dependencies
          path: local-deps.tar.gz
          retention-days: 1
          if-no-files-found: error
