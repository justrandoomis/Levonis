name: Codex source snapshot

on:
  push:
    branches:
      - codex/subscription-entitlements
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package source
        run: tar --exclude=.git --exclude=node_modules --exclude=.wrangler -czf "$RUNNER_TEMP/levonis-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: levonis-source
          path: ${{ runner.temp }}/levonis-source.tar.gz
          if-no-files-found: error
          retention-days: 1
