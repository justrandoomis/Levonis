# ---------------------------------------------------------------------------
# WHICH WORKER SERVES WHOM (read this before running any deploy)
#
#   levonis-iq.com         -> Worker  levonis-staging          [LIVE]
#   studio.levonis-iq.com  -> Worker  levonis-studio-staging   [LIVE]
#   *.levonis-iq.com       -> Worker  levonis-staging          [LIVE]
#   Worker  levonis-studio  -> workers.dev only, NO domain     [alternate]
#   Worker  levonis         -> does not exist on the account
#
# Full table: docs/WORKERS.md
# ---------------------------------------------------------------------------
# The ADMIN bot's registration — @alilevobot, migration 0080.
#
# The sibling of workflow 16, for the SECOND bot. It never touches the
# customer bot: a different token, a different secret, a different URL. The
# two are independent in Telegram's eyes and must stay independent here, so
# nothing in this file reads TELEGRAM_BOT_TOKEN or TELEGRAM_WEBHOOK_SECRET.
#
# WHY THE PATH SAYS `ops` AND NOT `admin`. A path containing "admin" is a
# CAPABILITY declaration in this codebase — services/gateway declares those
# prefixes apex-only and session-gated, and a Telegram webhook carries no
# session. The endpoint is machine ingress authenticated by a secret header,
# exactly like /api/telegram/webhook, so it is named for what it is.
#
# WHAT IT NEVER PRINTS. No secret value. The token rides only inside the URL
# of a curl call, Telegram's answers are reduced to a whitelist of operational
# fields, and the wrong-secret probe sends a literal dummy string.
name: 42 - Telegram ADMIN Bot Webhook (diagnose / repair)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose (read-only) or repair (registers the admin webhook)'
        required: true
        default: diagnose
        type: choice
        options: [diagnose, repair]
      confirm:
        description: 'For repair, type: SET-ADMIN-WEBHOOK'
        required: false
        default: ''

concurrency: telegram-admin-webhook

env:
  APEX: https://levonis-iq.com
  WEBHOOK_URL: https://levonis-iq.com/api/telegram/ops/webhook

jobs:
  webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a repair without the typed confirmation
        if: ${{ github.event.inputs.mode == 'repair' }}
        run: |
          [ "${{ github.event.inputs.confirm }}" = "SET-ADMIN-WEBHOOK" ] \
            || { echo "::error::repair requires confirm=SET-ADMIN-WEBHOOK — a bot has exactly ONE webhook and re-pointing it is not a casual act"; exit 1; }

      # The same three-way diagnosis workflow 16 makes for the customer bot:
      # 403 = the route is deployed AND the Worker holds an admin webhook
      # secret; 503 = the route is deployed but TELEGRAM_ADMIN_WEBHOOK_SECRET
      # is unset, so every delivery dies there whatever the bot has registered;
      # 404 = the code carrying this route is not deployed yet.
      - name: What the LIVE handler answers a wrong-secret probe
        id: probe
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Telegram-Bot-Api-Secret-Token: not-the-real-secret-probe' \
            --data '{}' "$WEBHOOK_URL" || echo 000)
          echo "POST $WEBHOOK_URL (wrong secret) -> $CODE"
          case "$CODE" in
            403) echo "  the admin handler is deployed and TELEGRAM_ADMIN_WEBHOOK_SECRET IS set on the Worker" ;;
            503) echo "::error::the Worker has NO TELEGRAM_ADMIN_WEBHOOK_SECRET — every delivery dies with 503 regardless of the bot's registration" ;;
            404) echo "::error::the admin webhook route is not deployed on this origin — run workflow 7 first" ;;
            *)   echo "::warning::unexpected status $CODE" ;;
          esac
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Admin-bot bindings on the LIVE main Worker (names only, never values)
        run: |
          set -e
          # TWO ENDPOINTS, because one of them is not authoritative about
          # secrets. /settings returns the script's bindings, and a secret's
          # NAME does not always appear there; /secrets is the endpoint whose
          # whole job is the name list. Reading only /settings reported the
          # CUSTOMER bot's long-working token as missing, which would have had
          # an operator re-uploading a secret that was never gone.
          NAMES=/tmp/binding-names.txt
          : > "$NAMES"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-staging/secrets" \
            -o /tmp/secrets.json || true
          if jq -e '.success == true' /tmp/secrets.json > /dev/null 2>&1; then
            jq -r '.result[]? | select(.type=="secret_text") | .name' /tmp/secrets.json >> "$NAMES"
          else
            echo "::warning::/secrets was not readable with this token; falling back to /settings bindings"
          fi
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-staging/settings" \
            -o /tmp/main.json || true
          if jq -e '.success == true' /tmp/main.json > /dev/null 2>&1; then
            jq -r '.result.bindings[]? | select(.type=="secret_text") | .name' /tmp/main.json >> "$NAMES"
          fi
          sort -u "$NAMES" -o "$NAMES"
          [ -s "$NAMES" ] || { echo "::error::neither endpoint returned a single secret name — cannot judge anything"; exit 1; }

          MISSING=0
          for NAME in TELEGRAM_ADMIN_BOT_TOKEN TELEGRAM_ADMIN_WEBHOOK_SECRET TELEGRAM_ADMIN_USER_IDS; do
            if grep -qx "$NAME" "$NAMES"; then
              echo "$NAME: present as a Worker SECRET"
            else
              echo "::error::$NAME is not a Worker secret on levonis-staging — set the repository secret and re-run workflow 7"
              MISSING=1
            fi
          done
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
          # The customer bot must be untouched by all of this — assert it.
          for NAME in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            grep -qx "$NAME" "$NAMES" \
              && echo "$NAME: still present (customer bot untouched)" \
              || echo "::warning::$NAME is missing — the CUSTOMER bot would be affected, which this change must never do"
          done

      - name: Which repository secrets exist (presence only)
        run: |
          [ -n "${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}" ] \
            && echo "TELEGRAM_ADMIN_BOT_TOKEN: set as a repository secret" \
            || echo "::error::TELEGRAM_ADMIN_BOT_TOKEN is NOT a repository secret — this workflow cannot ask Telegram anything without it"
          [ -n "${{ secrets.TELEGRAM_ADMIN_WEBHOOK_SECRET }}" ] \
            && echo "TELEGRAM_ADMIN_WEBHOOK_SECRET: set as a repository secret" \
            || echo "::warning::TELEGRAM_ADMIN_WEBHOOK_SECRET is NOT a repository secret — repair could not set a secret_token"
          [ -n "${{ secrets.TELEGRAM_ADMIN_USER_IDS }}" ] \
            && echo "TELEGRAM_ADMIN_USER_IDS: set as a repository secret" \
            || echo "::warning::TELEGRAM_ADMIN_USER_IDS is NOT set — the bot would authorize NOBODY, which is the safe direction but not a working setup"

      - name: Who this bot is, and where Telegram currently delivers it
        id: info
        env:
          TG: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        run: |
          set -e
          [ -n "$TG" ] || { echo "::error::no admin bot token; skipping"; exit 1; }
          # getMe proves the token belongs to the bot the owner expects — a
          # token for the WRONG bot would otherwise register silently.
          curl -sS --max-time 25 "https://api.telegram.org/bot${TG}/getMe" -o /tmp/me.json
          jq -e '.ok == true' /tmp/me.json > /dev/null || { echo "::error::Telegram refused getMe — the admin bot token is not valid"; exit 1; }
          USERNAME=$(jq -r '.result.username // ""' /tmp/me.json)
          echo "bot username   : @${USERNAME:-<unknown>}"
          # Telegram usernames are case-insensitive and getMe answers with the
          # capitalisation the owner typed at registration (@Alilevobot). An
          # exact-string comparison called the RIGHT bot the wrong one.
          if [ "$(printf '%s' "$USERNAME" | tr '[:upper:]' '[:lower:]')" != "alilevobot" ]; then
            echo "::warning::this token is for @$USERNAME, not @alilevobot — confirm it is the intended admin bot before repairing"
          fi

          curl -sS --max-time 25 "https://api.telegram.org/bot${TG}/getWebhookInfo" -o /tmp/info.json
          jq -e '.ok == true' /tmp/info.json > /dev/null || { echo "::error::Telegram refused getWebhookInfo"; exit 1; }
          URL=$(jq -r '.result.url // ""' /tmp/info.json)
          PENDING=$(jq -r '.result.pending_update_count // 0' /tmp/info.json)
          LAST_ERR=$(jq -r '.result.last_error_message // ""' /tmp/info.json)
          LAST_ERR_AT=$(jq -r '.result.last_error_date // 0' /tmp/info.json)
          ALLOWED=$(jq -c '.result.allowed_updates // []' /tmp/info.json)
          echo "registered url : ${URL:-<none>}"
          echo "pending updates: $PENDING"
          echo "allowed updates: $ALLOWED"
          if [ "$LAST_ERR_AT" != "0" ]; then
            echo "last error     : $(date -u -d @$LAST_ERR_AT '+%Y-%m-%d %H:%M:%SZ' 2>/dev/null || echo t=$LAST_ERR_AT) — $LAST_ERR"
          else
            echo "last error     : none recorded"
          fi
          if [ "$URL" = "$WEBHOOK_URL" ]; then
            echo "the admin bot points at the LIVE handler"
            echo "matches=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the admin bot does NOT point at $WEBHOOK_URL — run this workflow with mode=repair"
            echo "matches=no" >> "$GITHUB_OUTPUT"
          fi

      # Mirrors worker/routes/telegram.ts admin/set-admin-webhook exactly:
      # same URL, same secret_token, the same two update types, and NEVER
      # drop_pending_updates.
      - name: Repair — register the LIVE admin webhook
        if: ${{ github.event.inputs.mode == 'repair' }}
        env:
          TG: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          WHS: ${{ secrets.TELEGRAM_ADMIN_WEBHOOK_SECRET }}
        run: |
          set -e
          [ -n "$TG" ]  || { echo "::error::TELEGRAM_ADMIN_BOT_TOKEN repository secret is required"; exit 1; }
          [ -n "$WHS" ] || { echo "::error::TELEGRAM_ADMIN_WEBHOOK_SECRET repository secret is required (the handler validates every delivery against it)"; exit 1; }
          jq -n --arg url "$WEBHOOK_URL" --arg st "$WHS" \
            '{url:$url, secret_token:$st, allowed_updates:["message","callback_query"], drop_pending_updates:false}' \
            > /tmp/req.json
          CODE=$(curl -sS --max-time 25 -o /tmp/set.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data @/tmp/req.json \
            "https://api.telegram.org/bot${TG}/setWebhook")
          OK=$(jq -r '.ok // false' /tmp/set.json)
          DESC=$(jq -r '.description // ""' /tmp/set.json)
          echo "setWebhook -> HTTP $CODE ok=$OK ($DESC)"
          [ "$OK" = "true" ] || { echo "::error::Telegram refused the registration"; exit 1; }

          # The command menu the admin sees in Telegram's UI. Cosmetic, so its
          # failure is a warning: the commands work either way.
          jq -n '{commands:[
            {command:"start",      description:"بدء استخدام بوت الإدارة"},
            {command:"help",       description:"قائمة الأوامر"},
            {command:"status",     description:"حالة البوت والمجموعة"},
            {command:"topics",     description:"حالة ربط المواضيع"},
            {command:"topic_here", description:"ربط الموضوع الحالي — مثال: /topic_here wallet"}
          ]}' > /tmp/cmds.json
          curl -sS --max-time 25 -o /tmp/cmds.out -X POST -H 'Content-Type: application/json' \
            --data @/tmp/cmds.json "https://api.telegram.org/bot${TG}/setMyCommands" || true
          jq -e '.ok == true' /tmp/cmds.out > /dev/null \
            && echo "command menu registered" \
            || echo "::warning::setMyCommands did not confirm — the commands still work, only the menu is missing"

      - name: Repair — read the registration back
        if: ${{ github.event.inputs.mode == 'repair' }}
        env:
          TG: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        run: |
          set -e
          curl -sS --max-time 25 "https://api.telegram.org/bot${TG}/getWebhookInfo" -o /tmp/info2.json
          URL=$(jq -r '.result.url // ""' /tmp/info2.json)
          echo "registered url now: ${URL:-<none>}"
          [ "$URL" = "$WEBHOOK_URL" ] || { echo "::error::registration did not stick"; exit 1; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Telegram-Bot-Api-Secret-Token: not-the-real-secret-probe' \
            --data '{}' "$WEBHOOK_URL" || echo 000)
          echo "wrong-secret probe after repair -> $CODE (must stay 403)"
          [ "$CODE" = "403" ] || { echo "::error::the admin handler no longer validates the secret as expected"; exit 1; }

      - name: What the owner does next
        run: |
          echo "The admin bot is registered. The remaining steps are in Telegram, and need no ids:"
          echo "  1. Open each topic in the Levonis admin forum group."
          echo "  2. Send  /topic_here <name>   — review | report | merchant_verification | wallet | orders | support | general"
          echo "  3. Send  /topics              — to see what is bound."
          echo "The first /topic_here from an authorized admin also adopts that group; a second group is refused."
