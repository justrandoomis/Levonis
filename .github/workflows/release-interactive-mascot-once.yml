# Owner-authorized continuation, isolated branch; never merge this file.
# LIVE levonis-iq.com -> levonis-staging. Use only the existing safe deployment.
# No direct database writes, new migrations, secrets reads or test data.
name: 46 - Release verified interactive mascot
on:
  push:
    branches: [codex/release-interactive-mascot]
    paths: ['.github/workflows/release-interactive-mascot-once.yml']
permissions:
  contents: read
concurrency:
  group: interactive-mascot-release
  cancel-in-progress: false
env:
  SOURCE: fb2cc84415a8c218b91627c0e4465045a7404ba7
  BASE: fcc0717f6fd3b91b096afefea448c27a5a6533ec
  MERGED: 4c72b27857ed52074c0288d4aabb310c7bafa45a
  CONFIRM: DEPLOY-CODE
jobs:
  dispatch:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/release-interactive-mascot' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Verify completed gates and exact merged source; dispatch existing safe live deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/justrandoomis/Levonis';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          async function get(path){const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(30000)});if(!r.ok)throw new Error(`GitHub ${r.status}`);return r.json();}
          for(const id of [34786704797,34786704743]){
            const run=await get('/actions/runs/'+id);
            if(run.head_sha!==process.env.SOURCE||run.status!=='completed'||run.conclusion!=='success')throw new Error('Exact-source verification not green: '+id);
          }
          const [main,source,pr]=await Promise.all([get('/commits/Main'),get('/git/commits/'+process.env.SOURCE),get('/pulls/5')]);
          if(!pr.merged||pr.head.sha!==process.env.SOURCE||pr.merge_commit_sha!==process.env.MERGED)throw new Error('PR is not the reviewed merge');
          if(main.sha!==process.env.MERGED||main.commit.tree.sha!==source.tree.sha||!main.parents.some(p=>p.sha===process.env.SOURCE)||!main.parents.some(p=>p.sha===process.env.BASE))throw new Error('Main moved or is not the exact reviewed tree');
          const prior=await get('/actions/runs?branch=Main&event=workflow_dispatch&per_page=30');
          const existing=prior.workflow_runs.find(r=>r.head_sha===main.sha&&r.path==='.github/workflows/deploy-staging-code.yml');
          if(existing){
            if(existing.status==='completed'&&existing.conclusion!=='success')throw new Error('Existing deployment failed; inspect run '+existing.id);
            console.log('Existing deployment '+existing.id+' already represents this exact source; no duplicate dispatch.');
          }else{
            const response=await fetch(base+'/actions/workflows/deploy-staging-code.yml/dispatches',{method:'POST',headers,body:JSON.stringify({ref:'Main',inputs:{confirm:process.env.CONFIRM}}),signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw new Error('Deployment dispatch failed: '+response.status);
            console.log('Existing safe live deployment dispatched for '+main.sha+'. Confirm completion and independent public proof before declaring published.');
          }
          JS
