# Owner-authorized Levonis continuation; isolated branch, never merge this file.
# LIVE: levonis-iq.com -> levonis-staging. No Studio/alternate Worker access.
# Migration 0071 was already verified before PR4. This frontend-only follow-up
# needs no database write; use the existing safe workflow after a checked merge.
name: 46 - Release verified interactive mascot
on:
  push:
    branches: [codex/release-interactive-mascot]
    paths: ['.github/workflows/release-interactive-mascot-once.yml']
permissions:
  contents: read
concurrency:
  group: interactive-mascot-release
  cancel-in-progress: false
env:
  SOURCE: fb2cc84415a8c218b91627c0e4465045a7404ba7
  BASE: fcc0717f6fd3b91b096afefea448c27a5a6533ec
  CONFIRM: DEPLOY-CODE
jobs:
  gate:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/release-interactive-mascot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Require exact-source complete CI and runtime preference browser tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/justrandoomis/Levonis';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          async function get(path){const r=await fetch(base+path,{headers});if(!r.ok)throw new Error(`GitHub ${r.status}`);return r.json();}
          for(const id of [34786704797,34786704743]) {
            let complete=false;
            for(let i=0;i<50;i++) {
              const run=await get('/actions/runs/'+id);
              if(run.head_sha!==process.env.SOURCE)throw new Error('Wrong verification source');
              if(run.status==='completed') {if(run.conclusion!=='success')throw new Error('Verification failed: '+id);complete=true;break;}
              await new Promise(r=>setTimeout(r,20000));
            }
            if(!complete)throw new Error('Verification incomplete; no release');
          }
          const [main,pr]=await Promise.all([get('/commits/Main'),get('/pulls/5')]);
          if(main.sha!==process.env.BASE || pr.head.sha!==process.env.SOURCE || pr.base.ref!=='Main')throw new Error('Source/base changed; reconcile first');
          console.log('Exact-source full checks, unit tests, build and both browser engines passed. No new migration required.');
          JS
  dispatch:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write
    steps:
      - name: Require the exact reviewed Main merge before invoking DEPLOY-CODE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.github.com/repos/justrandoomis/Levonis';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          async function get(path){const r=await fetch(base+path,{headers});if(!r.ok)throw new Error(`GitHub ${r.status}`);return r.json();}
          const source=await get('/git/commits/'+process.env.SOURCE);
          let main;
          for(let i=0;i<60;i++){
            main=await get('/commits/Main');
            if(main.sha!==process.env.BASE)break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(main.sha===process.env.BASE || main.commit.tree.sha!==source.tree.sha || !main.parents.some(p=>p.sha===process.env.SOURCE) || !main.parents.some(p=>p.sha===process.env.BASE))throw new Error('Main is not the exact reviewed merge; no deployment');
          const response=await fetch(base+'/actions/workflows/deploy-staging-code.yml/dispatches',{method:'POST',headers,body:JSON.stringify({ref:'Main',inputs:{confirm:process.env.CONFIRM}})});
          if(!response.ok)throw new Error('Deployment dispatch failed: '+response.status);
          console.log('Existing live deployment dispatched on Main '+main.sha+'. Verify completion and public bundle before claiming publication.');
          JS
