name: CI - complete checks with eight root test shards

on:
  workflow_call:

permissions:
  contents: read

# Every job checks the caller's exact commit. No deployment credentials are
# passed here. A reusable workflow succeeds only after every job succeeds.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install the Studio workspace
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint and boundaries
        run: npm run check

  root_tests:
    name: Root tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Root tests also inspect Studio's installed engine.
      - name: Install the Studio workspace
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Run every root file assigned to this shard
        run: node scripts/test-all.mjs --suite root --shard '${{ matrix.shard }}/8'

  workspace_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install the Studio workspace
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - run: node scripts/test-all.mjs --suite workspaces

  studio_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install the Studio workspace
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - run: node scripts/test-all.mjs --suite studio
