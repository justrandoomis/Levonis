name: Codex one-time LIVE deploy dispatcher

on:
  push:
    branches:
      - Main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the repository's guarded LIVE deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run deploy-staging-code.yml
          --repo "$GITHUB_REPOSITORY"
          --ref Main
          -f confirm=DEPLOY-CODE
