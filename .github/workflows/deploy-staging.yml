# ---------------------------------------------------------------------------
# WHICH WORKER SERVES WHOM (read this before running any deploy)
#
#   levonis-iq.com         -> Worker  levonis-staging          [LIVE]
#   studio.levonis-iq.com  -> Worker  levonis-studio-staging   [LIVE]
#   *.levonis-iq.com       -> Worker  levonis-staging          [LIVE]
#   Worker  levonis-studio  -> workers.dev only, NO domain     [alternate]
#   Worker  levonis         -> does not exist on the account
#
# Established from Cloudflare's own configuration, not from behaviour:
# custom domains, zone routes and the live Worker's bindings, read by
# `12 - Audit Studio Migrations and Routing` (runs 33380828524, 33382596554).
# The "-staging" names are historical. They are the production Workers.
# Full table: docs/WORKERS.md
# ---------------------------------------------------------------------------
# Rebuilds the levonis-staging Worker's D1 database and R2 bucket if they are
# missing, deploys to it, and runs the full automated API suite against it.
#
# READ THE BANNER ABOVE FIRST. This header used to say "the STAGING
# environment ... on workers.dev" and "never touches the production database".
# Both were false, and dangerously so: levonis-staging is the Worker serving
# levonis-iq.com, and levonis-db-staging is the real customer database. The
# api-tests suites register @test.local accounts in it, and the last step
# demotes them with a direct UPDATE. That is test data written to live data.
#
# It also REPLACES the Worker's plain-text vars wholesale, passing only five
# of the seven the config declares — STORE_ROOT_DOMAIN, EXTRA_ALLOWED_ORIGINS
# and STUDIO_ALLOWED_DESTINATIONS are dropped — and repoints APP_ORIGIN at a
# workers.dev URL.
#
# For an ordinary code deploy use `7 - Deploy LIVE main site levonis-staging`,
# which preserves every var and writes no test data.
name: 2 - Rebuild levonis-staging + run API tests (LIVE main site — writes test data)

on:
  workflow_dispatch:

concurrency: staging-deploy

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Ensure staging D1 database exists
        id: db
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-db-staging") | .uuid')
          if [ -z "$ID" ]; then
            echo "Creating levonis-db-staging…"
            npx wrangler d1 create levonis-db-staging > /dev/null
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-db-staging") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::could not create/find staging DB"; exit 1; }
          echo "staging_db_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Ensure staging R2 bucket exists
        run: |
          npx wrangler r2 bucket create levonis-files-staging 2>/dev/null || true
          npx wrangler r2 bucket list | grep -qw "levonis-files-staging" \
            || { echo "::error::could not create/find staging bucket"; exit 1; }

      - name: Fill staging database_id into wrangler.jsonc
        env:
          STAGING_DB_ID: ${{ steps.db.outputs.staging_db_id }}
        run: node scripts/set-deploy-ids.mjs --env staging

      - name: Build frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Apply migrations (STAGING database only)
        run: npx wrangler d1 migrations apply levonis-db-staging --remote --env staging

      # The same guard `7 - Deploy LIVE main site` runs (review F9): this
      # workflow deploys the Worker that serves every store's subdomain too, so
      # a store — or a renamed store's old address — whose name the new code
      # reserves would go dark here just the same. Read-only; a failed read
      # stops the deploy.
      - name: No live store is about to be renamed out of existence
        run: |
          set -e
          npx wrangler d1 execute levonis-db-staging --remote --env staging --json \
            --command "SELECT slug, 'live' AS kind FROM merchant_stores UNION ALL SELECT slug, 'retired' AS kind FROM merchant_store_slugs WHERE active = 0" \
            > /tmp/slugs.json 2>/tmp/slugs.err || {
              echo "::error::could not read the store slugs — the check below will stop the deploy"
              sed -n '1,20p' /tmp/slugs.err || true
            }
          node scripts/check-live-store-slugs.mjs /tmp/slugs.json

      - name: Deploy staging worker
        id: deploy
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: |
          set -e
          npx wrangler deploy --env staging \
            --var GOOGLE_CLIENT_ID:"$VITE_GOOGLE_CLIENT_ID" \
            --var INITIAL_ADMIN_EMAIL:"$INITIAL_ADMIN_EMAIL" \
            | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::could not determine staging URL"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Second deploy pass — set APP_ORIGIN and email vars
        # Why deploy twice: wrangler replaces the worker's plain-text vars
        # WHOLESALE on every deploy, and APP_ORIGIN (the trusted origin used
        # in password-reset email links) is only knowable AFTER the first
        # deploy has printed the workers.dev URL. So pass 1 captures the URL,
        # and pass 2 re-deploys with ALL vars — the previous ones MUST be
        # repeated here or they would be wiped.
        # EMAIL_ALLOWED_RECIPIENTS is the staging safety net: outbound email
        # only goes to EMAIL_TEST_RECIPIENT (may be empty = no sends).
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
        run: |
          set -e
          npx wrangler deploy --env staging \
            --var GOOGLE_CLIENT_ID:"$VITE_GOOGLE_CLIENT_ID" \
            --var INITIAL_ADMIN_EMAIL:"$INITIAL_ADMIN_EMAIL" \
            --var APP_ORIGIN:"${{ steps.deploy.outputs.url }}" \
            --var EMAIL_FROM:"$EMAIL_FROM" \
            --var EMAIL_ALLOWED_RECIPIENTS:"$EMAIL_TEST_RECIPIENT" \
            > /dev/null

      - name: Upload runtime secrets to the staging worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KYC_ENC_KEY: ${{ secrets.KYC_ENC_KEY }}
        run: |
          if [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --env staging
          else
            echo "TELEGRAM_WEBHOOK_SECRET not set — the Telegram webhook stays honestly disabled on staging"
          fi
          if [ -n "$KYC_ENC_KEY" ]; then
            printf '%s' "$KYC_ENC_KEY" | npx wrangler secret put KYC_ENC_KEY --env staging
          else
            echo "KYC_ENC_KEY not set — KYC submission stays honestly disabled on staging"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --env staging
          else
            echo "TELEGRAM_BOT_TOKEN not set — Telegram notifications stay off on staging"
          fi
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_ADMIN_CHAT_ID" | npx wrangler secret put TELEGRAM_ADMIN_CHAT_ID --env staging
          else
            echo "TELEGRAM_ADMIN_CHAT_ID not set — the bot has no destination chat yet"
          fi
          if [ -n "$EMAIL_API_KEY" ]; then
            printf '%s' "$EMAIL_API_KEY" | npx wrangler secret put EMAIL_API_KEY --env staging
          else
            echo "EMAIL_API_KEY not set — password-reset email stays honestly disabled on staging"
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --env staging
          else
            echo "GEMINI_API_KEY not set — AI features stay honestly disabled on staging"
          fi

      - name: Wait for the worker to serve
        run: |
          for i in $(seq 1 12); do
            curl -fsS -m 10 "${{ steps.deploy.outputs.url }}/api/health" && exit 0
            sleep 5
          done
          echo "::error::staging /api/health did not come up"; exit 1

      - name: Run API test suite against staging
        id: tests
        run: |
          API_BASE="${{ steps.deploy.outputs.url }}" \
          PROMOTE_CMD='npx wrangler d1 execute levonis-db-staging --remote --command {SQL}' \
          node scripts/api-tests.mjs | tee /tmp/tests.log
          tail -1 /tmp/tests.log

      - name: Run products/memberships (v2) API test suite against staging
        # ALLOW_LAUNCH_ACTIVATION is deliberately NOT set here: staging keeps
        # its real launch configuration untouched for owner testing. When the
        # launch is not yet activated, the suite activates ONLY its own test
        # membership via direct SQL (PROMOTE_CMD) and skips the global
        # activation-endpoint test.
        id: tests_v2
        run: |
          API_BASE="${{ steps.deploy.outputs.url }}" \
          PROMOTE_CMD='npx wrangler d1 execute levonis-db-staging --remote --command {SQL}' \
          node scripts/api-tests-v2.mjs | tee /tmp/tests-v2.log
          tail -1 /tmp/tests-v2.log

      - name: Run final-phase (v3) acceptance suite against staging
        # Reports passed / failed / BLOCKED distinctly — blocked rows are
        # honestly-unconfigured preconditions (owner decisions/secrets), never
        # counted as passes. TEST_TELEGRAM_WEBHOOK_SECRET lets the webhook
        # forgery/dedupe checks run against the real staging secret.
        id: tests_v3
        env:
          TEST_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          API_BASE="${{ steps.deploy.outputs.url }}" \
          PROMOTE_CMD='npx wrangler d1 execute levonis-db-staging --remote --command {SQL}' \
          node scripts/api-tests-v3.mjs | tee /tmp/tests-v3.log
          tail -1 /tmp/tests-v3.log

      - name: Demote test accounts (staging only)
        # The test suite promotes throwaway @test.local accounts to admin.
        # Clearing them leaves the staging DB with zero admins, so the
        # INITIAL_ADMIN_EMAIL bootstrap can fire on a real Google sign-in.
        run: |
          npx wrangler d1 execute levonis-db-staging --remote \
            --command "UPDATE users SET role='customer' WHERE role='admin' AND email LIKE '%@test.local'"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Staging deployment"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Test suite:"
            echo '```'
            tail -20 /tmp/tests.log 2>/dev/null || echo "tests did not run"
            echo '```'
            echo "- Products/memberships (v2) suite:"
            echo '```'
            tail -20 /tmp/tests-v2.log 2>/dev/null || echo "v2 tests did not run"
            echo '```'
            echo "- Final-phase (v3) acceptance suite:"
            echo '```'
            tail -25 /tmp/tests-v3.log 2>/dev/null || echo "v3 tests did not run"
            echo '```'
            echo "Reminder: add the staging URL to the Google OAuth client's Authorized JavaScript origins to test Google sign-in manually."
          } >> "$GITHUB_STEP_SUMMARY"
