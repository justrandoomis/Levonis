# Deploys the STAGING environment (worker "levonis-staging" on workers.dev)
# with its own D1 database and R2 bucket, then runs the full automated API
# test suite against it. Never touches the production database, the
# production bucket, or any DNS/domain.
name: 2 - Deploy Staging + Tests

on:
  workflow_dispatch:

concurrency: staging-deploy

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Ensure staging D1 database exists
        id: db
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-db-staging") | .uuid')
          if [ -z "$ID" ]; then
            echo "Creating levonis-db-staging…"
            npx wrangler d1 create levonis-db-staging > /dev/null
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-db-staging") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::could not create/find staging DB"; exit 1; }
          echo "staging_db_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Ensure staging R2 bucket exists
        run: |
          npx wrangler r2 bucket create levonis-files-staging 2>/dev/null || true
          npx wrangler r2 bucket list | grep -qw "levonis-files-staging" \
            || { echo "::error::could not create/find staging bucket"; exit 1; }

      - name: Fill staging database_id into wrangler.jsonc
        env:
          STAGING_DB_ID: ${{ steps.db.outputs.staging_db_id }}
        run: node scripts/set-deploy-ids.mjs

      - name: Build frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Apply migrations (STAGING database only)
        run: npx wrangler d1 migrations apply levonis-db-staging --remote --env staging

      - name: Deploy staging worker
        id: deploy
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: |
          set -e
          npx wrangler deploy --env staging \
            --var GOOGLE_CLIENT_ID:"$VITE_GOOGLE_CLIENT_ID" \
            --var INITIAL_ADMIN_EMAIL:"$INITIAL_ADMIN_EMAIL" \
            | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::could not determine staging URL"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload runtime secrets to the staging worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --env staging
          else
            echo "TELEGRAM_BOT_TOKEN not set — Telegram notifications stay off on staging"
          fi
          if [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_ADMIN_CHAT_ID" | npx wrangler secret put TELEGRAM_ADMIN_CHAT_ID --env staging
          else
            echo "TELEGRAM_ADMIN_CHAT_ID not set — the bot has no destination chat yet"
          fi

      - name: Wait for the worker to serve
        run: |
          for i in $(seq 1 12); do
            curl -fsS -m 10 "${{ steps.deploy.outputs.url }}/api/health" && exit 0
            sleep 5
          done
          echo "::error::staging /api/health did not come up"; exit 1

      - name: Run API test suite against staging
        id: tests
        run: |
          API_BASE="${{ steps.deploy.outputs.url }}" \
          PROMOTE_CMD='npx wrangler d1 execute levonis-db-staging --remote --command {SQL}' \
          node scripts/api-tests.mjs | tee /tmp/tests.log
          tail -1 /tmp/tests.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Staging deployment"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Test suite:"
            echo '```'
            tail -20 /tmp/tests.log 2>/dev/null || echo "tests did not run"
            echo '```'
            echo "Reminder: add the staging URL to the Google OAuth client's Authorized JavaScript origins to test Google sign-in manually."
          } >> "$GITHUB_STEP_SUMMARY"
