# READ-ONLY. Every statement is a SELECT against the live database.
#
# Why the public USD display rate is null (the storefront's dollar reading falls
# back to dinars). The answers are sealed in the runner to a one-time public key
# (scripts/bambu-import/seal.mjs) and only the .sealed file is uploaded; the log
# carries row counts only. Lives on branch diag/fx-rate only and is deleted with it.
name: 62 - Diagnose the public USD rate (read-only, sealed)

on:
  push:
    branches: [diag/fx-rate]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Read the FX tables (SELECT only), seal the answer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEAL_PUBKEY: ag6FJkQGkmEn6uNYNjbVk6axSsD371ZxHvgH_a524l0
        run: node scripts/diag/fx-sealed.mjs --out sealed-out

      - uses: actions/upload-artifact@v4
        with:
          name: fx-rate-sealed
          path: sealed-out/*.sealed
          retention-days: 1
          if-no-files-found: error
