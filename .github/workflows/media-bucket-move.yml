# ---------------------------------------------------------------------------
#   MOVE THE LEGACY MEDIA BUCKET INTO THE PUBLIC / PRIVATE PAIR
# ---------------------------------------------------------------------------
# The live store (`levonis-staging`, which is what serves levonis-iq.com —
# docs/WORKERS.md) binds three R2 buckets:
#
#     BUCKET      -> levonis-files-staging            22 objects, 6.28 MB
#     R2_PUBLIC   -> levonis-media-public-staging      0 objects
#     R2_PRIVATE  -> levonis-media-private-staging     0 objects
#
# Every byte of the store's media is in the LEGACY bucket and the two dedicated
# buckets are empty. `worker/lib/mediaStorage.ts` reads the dedicated bucket
# first and the legacy one second, so the site works — but only because of that
# fallback. This workflow is what ends the fallback.
#
# THE ONE-COPY RULE
# -----------------
# levonis-files-staging holds the owner's ONLY copy of the store's photography.
# So:
#
#   * job 1 COPIES and VERIFIES. It deletes nothing, ever, under any input.
#   * job 2 DELETES the legacy SOURCE objects, behind a SECOND typed
#     confirmation. It cannot start unless job 1 finished green in the same
#     run, and it re-verifies each object at its destination immediately before
#     deleting that object's source.
#   * neither job creates, renames or deletes a BUCKET. Which buckets should
#     cease to exist is the owner's decision and is made in the dashboard.
#
# KEYS ARE NOT REWRITTEN
# ----------------------
# An object keeps its exact key; only its bucket changes. That is deliberate,
# and it is what makes this safe: `buildMediaKey` does not encode visibility
# into the path, so every `r2_key` and `/files/...` reference in D1 stays valid
# with no database write at all. The one rename this system does want —
# `UIUx/*` to `ui/levonis/*` — is NOT done here, because it has to rewrite the
# `settings` rows in the same D1 batch. `POST /api/admin/media/migration/apply`
# is what does that, one object at a time, and it already exists.
#
# WHICH BUCKET EACH OBJECT GOES TO
# --------------------------------
# Decided by `planLegacyMediaKey` in `worker/lib/mediaMigration.ts` — the same
# function the Worker and the admin API use, imported and executed here rather
# than restated. There is exactly one split rule in this repository, and the
# runner below contains no second opinion about what is public.
name: 38 - Move legacy media into the public/private buckets (gated, copy-then-verify)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE-MEDIA to copy + verify. Deletes nothing.'
        required: true
        default: ''
      source_bucket:
        description: 'Legacy bucket to read FROM'
        required: true
        default: 'levonis-files-staging'
      public_bucket:
        description: 'Destination for anonymous-public objects'
        required: true
        default: 'levonis-media-public-staging'
      private_bucket:
        description: 'Destination for everything else'
        required: true
        default: 'levonis-media-private-staging'
      delete_confirm:
        description: 'SECOND GATE. Leave EMPTY on the first run. Type DELETE-LEGACY-SOURCE to also delete the verified source objects afterwards.'
        required: false
        default: ''

concurrency: media-bucket-move

jobs:
  # =========================================================================
  # JOB 1 — COPY AND VERIFY. WRITES ONLY. DELETES NOTHING.
  # =========================================================================
  copy:
    name: Copy legacy objects and verify every copy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # R2's data plane is S3-only. wrangler 4.127 has `r2 object get/put/delete`
      # but NO way to LIST a bucket's objects, and a migration that cannot
      # enumerate its source is not a migration. These are an R2 API token
      # (Object Read & Write) — a DIFFERENT credential from
      # CLOUDFLARE_API_TOKEN, which is a Cloudflare API token and cannot speak
      # S3.
      #
      # TWO NAMES, ONE CREDENTIAL. This repository already held the R2 token as
      # CLOUDFLARE_R2_*, so that pair is read FIRST and the R2_S3_* pair is only
      # a fallback for a repository that named it the other way. An unset secret
      # is the empty string, which `||` treats as false — so this resolves to
      # whichever pair exists, and asking an owner to mint a second token for a
      # credential they already have would be pure ceremony, and one more live
      # key to keep safe.
      #
      # The VALUES never appear anywhere: they are read straight into the
      # process environment, the guard below tests only whether they are empty,
      # and GitHub masks a registered secret in every log line regardless.
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Recent AWS CLI v2 releases send CRC32 trailers by default and validate
      # them on responses. R2 is S3-compatible, not S3, and this checksum
      # negotiation is the one place that regularly bites. `when_required` keeps
      # the CLI to the classic behaviour. Object integrity does NOT rest on
      # this: every copy is independently verified below.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Confirmation gate
        run: |
          [ "${{ inputs.confirm }}" = "MIGRATE-MEDIA" ] \
            || { echo "::error::type MIGRATE-MEDIA in the confirm input — aborting, nothing was touched"; exit 1; }

      - name: Refuse to move a bucket onto itself
        run: |
          set -e
          SRC='${{ inputs.source_bucket }}'
          PUB='${{ inputs.public_bucket }}'
          PRI='${{ inputs.private_bucket }}'
          for name in "$SRC" "$PUB" "$PRI"; do
            case "$name" in
              ''|*[!a-z0-9-]*)
                echo "::error::\"$name\" is not a plain R2 bucket name (lowercase, digits, hyphen)"; exit 1 ;;
            esac
          done
          if [ "$SRC" = "$PUB" ] || [ "$SRC" = "$PRI" ] || [ "$PUB" = "$PRI" ]; then
            echo "::error::source, public and private must be three DIFFERENT buckets"; exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Preflight — credentials, tooling, and that all three buckets exist
        run: |
          set -e
          command -v aws >/dev/null \
            || { echo "::error::the AWS CLI is not on this runner, and R2's object API is S3-only"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] \
            || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::No R2 S3 credential is configured. This job reads, in order:"
            echo "::error::  CLOUDFLARE_R2_ACCESS_KEY_ID / CLOUDFLARE_R2_SECRET_ACCESS_KEY"
            echo "::error::  R2_S3_ACCESS_KEY_ID / R2_S3_SECRET_ACCESS_KEY"
            echo "::error::If one pair already exists, check its NAME matches one of those exactly."
            echo "::error::Otherwise create one: Cloudflare dashboard -> R2 -> API -> Manage API"
            echo "::error::tokens -> Create token, permission 'Object Read & Write', scoped to the"
            echo "::error::three buckets named in the inputs. CLOUDFLARE_API_TOKEN cannot be used:"
            echo "::error::it is a Cloudflare API token and R2's object API speaks S3."
            exit 1
          fi
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "R2_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
          for b in '${{ inputs.source_bucket }}' '${{ inputs.public_bucket }}' '${{ inputs.private_bucket }}'; do
            aws s3api head-bucket --endpoint-url "$ENDPOINT" --bucket "$b" >/dev/null 2>&1 \
              || { echo "::error::bucket \"$b\" does not exist on this account, or this token cannot see it. Nothing was copied."; exit 1; }
            echo "bucket ok: $b"
          done

      # WHY THE RUNNER IS GENERATED AND NOT COMMITTED
      # The gate and the thing the gate guards live in one file, so they cannot
      # drift apart, and the runner is written into scripts/ so that
      # `tests/tsconfig.json` (which includes ../scripts/**/*.ts) typechecks it
      # against the real repository BEFORE it is allowed to touch R2. The file
      # exists only inside a CI checkout; nothing commits it. Job 2 does not
      # re-generate it — it downloads the exact bytes job 1 ran.
      - name: Generate the move runner
        run: |
          cat > ./scripts/media-bucket-move.gen.ts <<'TSEOF'
          /**
           * Legacy R2 media move — copy + verify (MODE=copy), or verify + prune
           * (MODE=prune). Generated by .github/workflows/media-bucket-move.yml
           * and never committed.
           *
           * Which bucket an object belongs in is decided by `planLegacyMediaKey`,
           * this repository's single split rule, imported below.
           */
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { planLegacyMediaKey } from '../worker/lib/mediaMigration';
          import { isSafeMediaKey } from '../worker/lib/mediaStorage';

          function required(name: string): string {
            const value = process.env[name];
            if (!value) throw new Error(`${name} is not set`);
            return value;
          }

          const MODE = process.env.MODE === 'prune' ? 'prune' : 'copy';
          const SOURCE = required('SOURCE_BUCKET');
          const PUBLIC_BUCKET = required('PUBLIC_BUCKET');
          const PRIVATE_BUCKET = required('PRIVATE_BUCKET');
          const ENDPOINT = required('R2_ENDPOINT');
          const MANIFEST = required('MANIFEST');

          /**
           * One `aws s3api` call. Arguments are passed as an array — nothing here
           * is ever assembled into a shell string, so a key containing a quote or
           * a space cannot become a command.
           */
          function aws(args: string[], expectJson = true): any {
            const [operation, ...rest] = args;
            const out = execFileSync(
              'aws',
              ['s3api', operation, '--endpoint-url', ENDPOINT, '--output', 'json', ...rest],
              { encoding: 'utf8', maxBuffer: 256 * 1024 * 1024 }
            );
            if (!expectJson) return null;
            const text = out.trim();
            return text ? JSON.parse(text) : null;
          }

          function awsOrNull(args: string[]): any {
            try {
              return aws(args);
            } catch {
              // head-object on an absent key exits non-zero. That is an answer,
              // not a failure, and it is the answer this script asks for most.
              return null;
            }
          }

          interface SourceObject { key: string; size: number; etag: string }

          /**
           * Every object in the bucket, paged to the very end. `--no-paginate`
           * turns OFF the CLI's own merging so the cursor is explicit and this
           * loop is the only thing deciding when the listing is complete — a
           * silently truncated listing is a silently incomplete migration.
           */
          function listAll(bucket: string): SourceObject[] {
            const found: SourceObject[] = [];
            let token: string | null = null;
            do {
              const args = ['list-objects-v2', '--bucket', bucket, '--no-paginate', '--max-keys', '1000'];
              if (token) args.push('--continuation-token', token);
              const page = aws(args) ?? {};
              for (const item of page.Contents ?? []) {
                found.push({ key: String(item.Key), size: Number(item.Size), etag: String(item.ETag ?? '') });
              }
              token = page.IsTruncated ? String(page.NextContinuationToken) : null;
            } while (token);
            return found;
          }

          const scratch = mkdtempSync(join(tmpdir(), 'r2move-'));
          function sha256(bucket: string, key: string, tag: string): string {
            const file = join(scratch, tag + '-' + createHash('sha1').update(key).digest('hex'));
            aws(['get-object', '--bucket', bucket, '--key', key, file]);
            return createHash('sha256').update(readFileSync(file)).digest('hex');
          }

          /** An ETag is the content MD5 only when the object is single-part. */
          function simpleEtag(etag: string): string | null {
            const clean = etag.replace(/"/g, '');
            return clean && !clean.includes('-') ? clean : null;
          }

          interface Proof { ok: boolean; method: string; detail: string }

          /**
           * A copy is "done" only when the destination is PROVEN to hold the same
           * bytes. Size always; ETag when both sides are single-part, because then
           * it is the MD5 of the content. When either side is multipart the ETags
           * are not comparable at all, so both objects are downloaded and SHA-256
           * compared — slower, and the only honest answer.
           */
          function verify(destBucket: string, source: SourceObject): Proof {
            const head = awsOrNull(['head-object', '--bucket', destBucket, '--key', source.key]);
            if (!head) return { ok: false, method: 'missing', detail: 'destination has no such object' };
            if (Number(head.ContentLength) !== source.size) {
              return { ok: false, method: 'size', detail: 'dest ' + head.ContentLength + ' B vs source ' + source.size + ' B' };
            }
            const a = simpleEtag(source.etag);
            const b = simpleEtag(String(head.ETag ?? ''));
            if (a && b) {
              return a === b
                ? { ok: true, method: 'etag', detail: a }
                : { ok: false, method: 'etag', detail: a + ' != ' + b };
            }
            const sa = sha256(SOURCE, source.key, 'src');
            const sb = sha256(destBucket, source.key, 'dst');
            return sa === sb
              ? { ok: true, method: 'sha256', detail: sa }
              : { ok: false, method: 'sha256', detail: sa + ' != ' + sb };
          }

          interface Row {
            key: string;
            visibility: string;
            /** The media DOMAIN the key's prefix resolves to — products, chat,
             *  receipts, reviews… The report is unreadable without it. */
            domain: string;
            destination: string;
            /** The key WRITTEN at the destination. `buildMediaKey` does not
             *  encode visibility into a path, so a copy keeps its key and this
             *  equals `key` — but the prune gate compares it instead of
             *  assuming it, because "the key does not change" is precisely the
             *  assumption that would delete the wrong source if it ever broke. */
            destinationKey: string;
            bytes: number;
            /** The verdict itself. `outcome` is a label for humans; reading the
             *  verdict back out of that label would be a second rule to keep
             *  in sync with the first, so the row carries it directly. */
            verified: boolean;
            outcome: string;
            method: string;
            detail: string;
          }

          const rows: Row[] = [];
          const blocked: Row[] = [];

          /**
           * A THROW MUST NOT TAKE THE RECORD WITH IT.
           *
           * The prune loop deletes irreversibly, one object at a time. Without
           * this, an exception on object 10 — a throttled delete, a 503 on the
           * get-object inside a SHA-256 comparison — would exit node before the
           * manifest was written and before anything was printed. The step that
           * uploads `media-prune-manifest` is `if: always()`, so it would have
           * uploaded the file still sitting on disk: job 1's COPY manifest,
           * saying mode "copy", verified_all true, nothing deleted. The only
           * forensic record of a half-finished destruction would have been a
           * document asserting that nothing happened.
           *
           * So the work is caught, the report below always runs on whatever was
           * accumulated, and the failure is re-raised at the very end.
           */
          let fatal: string | null = null;

          try {
          if (MODE === 'copy') {
            const objects = listAll(SOURCE);
            const total = objects.reduce((n, o) => n + o.size, 0);
            console.log(SOURCE + ': ' + objects.length + ' object(s), ' + total + ' B');
            for (const object of objects) {
              // An unsafe key is one the Worker's own `isSafeMediaKey` refuses to
              // serve from ANY bucket. Copying it would create a second
              // unreachable copy and let the run call that progress.
              if (!isSafeMediaKey(object.key)) {
                blocked.push({
                  key: object.key, visibility: '-', domain: '-', destination: '-', destinationKey: '-',
                  bytes: object.size, verified: false, outcome: 'BLOCKED', method: 'unsafe-key',
                  detail: 'the Worker will not serve this key from any bucket; rename or move it by hand',
                });
                continue;
              }
              // THE SPLIT RULE. Imported, not reimplemented. `referenced` is true
              // because THIS job copies everything: whether an object is still
              // referenced decides whether it may eventually be deleted, not
              // where it lives, and nothing is deleted here.
              const plan = planLegacyMediaKey(object.key, true);
              const destination = plan.visibility === 'public' ? PUBLIC_BUCKET : PRIVATE_BUCKET;

              // Re-runnable: an object already in place is verified, not re-copied.
              const existing = awsOrNull(['head-object', '--bucket', destination, '--key', object.key]);
              let action = 'already-present';
              if (!existing || Number(existing.ContentLength) !== object.size) {
                // Server-side copy: the bytes never traverse this runner.
                const encoded = object.key.split('/').map(encodeURIComponent).join('/');
                aws(['copy-object', '--bucket', destination, '--key', object.key,
                     '--copy-source', SOURCE + '/' + encoded, '--metadata-directive', 'COPY']);
                action = 'copied';
              }
              const proof = verify(destination, object);
              rows.push({
                key: object.key, visibility: plan.visibility, domain: plan.domain, destination,
                destinationKey: object.key, bytes: object.size,
                verified: proof.ok, outcome: proof.ok ? 'VERIFIED (' + action + ')' : 'FAILED',
                method: proof.method, detail: proof.detail,
              });
              console.log((proof.ok ? 'ok   ' : 'FAIL ') + plan.visibility.padEnd(7) + ' ' +
                destination + '  ' + object.key + '  [' + action + '/' + proof.method + ']');
            }
          } else {
            // PRUNE. The manifest proves job 1 verified these keys in this run.
            // This re-proves it NOW, object by object, and deletes each source
            // only after that object's own destination has just answered for it.
            const manifest = JSON.parse(readFileSync(MANIFEST, 'utf8'));

            // WHOLE-MANIFEST GATES. One bad row is not a reason to delete the
            // other seventeen, so these refuse the entire run.
            const manifestFailed = (manifest.rows as Row[]).filter((r) => r.outcome === 'FAILED').length;
            const manifestBlocked = (manifest.blocked ?? []).length;
            console.log('manifest BLOCKED: ' + manifestBlocked + '   manifest FAILED: ' + manifestFailed);
            if (!manifest.verified_all || manifestBlocked > 0 || manifestFailed > 0) {
              throw new Error('the copy manifest is not a clean pass — refusing to delete anything');
            }
            // The delete targets SOURCE by name. If SOURCE were ever also a
            // destination, this loop would delete the copies it just proved.
            if (SOURCE === PUBLIC_BUCKET || SOURCE === PRIVATE_BUCKET) {
              throw new Error('the source bucket is also a destination — refusing to delete anything');
            }

            const sources = new Map<string, SourceObject>(
              listAll(SOURCE).map((o): [string, SourceObject] => [o.key, o])
            );

            /**
             * THE PER-OBJECT GATE, one named check at a time.
             *
             * Everything below is checked BEFORE the delete for THIS object,
             * and every check prints whether it held — so a reader can see the
             * reason each source was allowed to go, rather than trusting that
             * a loop somewhere did the right thing. Any single failure keeps
             * that object's source and moves on; it never widens.
             */
            function pruneGate(row: Row, source: SourceObject): string | null {
              const checks: Array<[string, boolean, string]> = [
                ['manifest row verified=true', row.verified === true, String(row.verified)],
                ['source key matches the manifest', row.key === source.key, row.key],
                ['destination is an authorised bucket',
                  row.destination === PUBLIC_BUCKET || row.destination === PRIVATE_BUCKET, row.destination],
                ['destination is not the source bucket', row.destination !== SOURCE, row.destination],
                ['destination key equals the manifest destination key',
                  row.destinationKey === row.key, String(row.destinationKey)],
              ];
              for (const [name, held, value] of checks) {
                console.log('    ' + (held ? 'ok  ' : 'FAIL') + '  ' + name + ' : ' + value);
                if (!held) return name;
              }
              return null;
            }

            for (const row of manifest.rows as Row[]) {
              console.log('---- ' + row.key);
              const source = sources.get(row.key);
              if (!source) {
                // Already pruned by an earlier run. Re-running is a no-op, not an error.
                console.log('    skip  not in the legacy bucket — an earlier run already pruned it');
                rows.push({ ...row, verified: true, outcome: 'ALREADY-GONE', method: 're-list', detail: 'not in the legacy bucket' });
                continue;
              }
              const refused = pruneGate(row, source);
              if (refused) {
                console.log('    ::error::KEPT — ' + refused);
                blocked.push({ ...row, verified: false, outcome: 'KEPT', method: 'gate', detail: refused });
                continue;
              }
              // Existence + size + ETag (or SHA-256 when either side is
              // multipart), taken against the destination RIGHT NOW.
              const proof = verify(row.destination, source);
              console.log('    ' + (proof.ok ? 'ok  ' : 'FAIL') + '  destination re-verified by ' + proof.method + ' : ' + proof.detail);
              if (!proof.ok) {
                blocked.push({ ...row, verified: false, outcome: 'KEPT', method: proof.method, detail: proof.detail });
                continue;
              }
              // ONE object, from the LEGACY bucket, by its exact key.
              aws(['delete-object', '--bucket', SOURCE, '--key', row.key], false);
              rows.push({ ...row, verified: true, outcome: 'SOURCE-DELETED', method: proof.method, detail: proof.detail });
              console.log('    pruned ' + row.key + ' from ' + SOURCE + ' (copy in ' + row.destination + ' proved by ' + proof.method + ')');
            }

            // AFTERWARDS: the legacy bucket must hold none of the manifest's
            // keys, and every destination object must still be there. Asking
            // again, from scratch, is the only answer worth reporting.
            const stillInSource = listAll(SOURCE).filter((o) => (manifest.rows as Row[]).some((r) => r.key === o.key));
            console.log('');
            console.log('LEGACY SOURCE COPIES REMAINING FROM THE MANIFEST: ' + stillInSource.length);
            for (const leftover of stillInSource) console.log('  still present: ' + leftover.key + ' (' + leftover.size + ' B)');
            let missingPublic = 0;
            let missingPrivate = 0;
            for (const row of manifest.rows as Row[]) {
              const head = awsOrNull(['head-object', '--bucket', row.destination, '--key', row.destinationKey]);
              if (head && Number(head.ContentLength) === row.bytes) continue;
              if (row.visibility === 'public') missingPublic++;
              else missingPrivate++;
              console.log('  ::error::DESTINATION GONE OR CHANGED: ' + row.destination + '/' + row.destinationKey);
            }
            console.log('PUBLIC DESTINATION OBJECTS MISSING : ' + missingPublic);
            console.log('PRIVATE DESTINATION OBJECTS MISSING: ' + missingPrivate);
            if (missingPublic > 0 || missingPrivate > 0) {
              throw new Error('a destination object is missing after the prune — the copies are what survive, and one did not');
            }
          }
          } catch (error) {
            fatal = describeError(error);
            console.error('');
            console.error('::error::RUN STOPPED: ' + fatal);
            console.error('The report below covers everything that happened BEFORE this point.');
          }

          const failures = rows.filter((r) => r.outcome === 'FAILED').length;
          // COUNTED, not assumed. `LEGACY DELETED` used to be the literal 0 —
          // true of every copy run and of no prune run, including the one that
          // deletes all eighteen exactly as intended.
          const deleted = rows.filter((r) => r.outcome === 'SOURCE-DELETED').length;
          const verifiedAll = !fatal && failures === 0 && blocked.length === 0;
          writeFileSync(MANIFEST, JSON.stringify({
            mode: MODE, source: SOURCE, public_bucket: PUBLIC_BUCKET, private_bucket: PRIVATE_BUCKET,
            generated_at: new Date().toISOString(), verified_all: verifiedAll, rows, blocked,
          }, null, 2));

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (summaryPath) {
            const lines = [
              '## ' + (MODE === 'copy' ? 'Copy + verify' : 'Prune verified sources'), '',
              'Source `' + SOURCE + '` -> `' + PUBLIC_BUCKET + '` / `' + PRIVATE_BUCKET + '`', '',
              '| key | visibility | destination | bytes | outcome | proof |',
              '|---|---|---|---|---|---|',
            ];
            for (const r of [...rows, ...blocked]) {
              lines.push('| `' + r.key + '` | ' + r.visibility + ' | ' + r.destination + ' | ' +
                r.bytes + ' | ' + r.outcome + ' | ' + r.method + ': ' + r.detail + ' |');
            }
            // A prune that deleted seventeen objects and kept one has NOT
            // "refused deletion", and saying so to someone holding no other
            // copy is the worst sentence this file could print.
            lines.push('', verifiedAll
              ? (MODE === 'copy'
                  ? '**' + rows.length + ' object(s) byte-verified at the destination. Nothing was deleted by this job.**'
                  : '**' + deleted + ' legacy source object(s) deleted after re-verification. Every destination copy re-checked and present.**')
              : (MODE === 'copy'
                  ? '**' + failures + ' failed, ' + blocked.length + ' blocked. Nothing was deleted; deletion is refused.**'
                  : '**RUN DID NOT COMPLETE CLEANLY. ' + deleted + ' source object(s) WERE ALREADY DELETED, ' +
                    blocked.length + ' kept. Read the per-object list below before assuming anything.**'));
            writeFileSync(summaryPath, lines.join('\n') + '\n', { flag: 'a' });
          }

          // ------------------------------------------------- THE FULL REPORT
          //
          // Printed to the CONSOLE, every run, pass or fail. The step summary
          // is a web page; a migration's per-object result has to be readable
          // where the run is read, or "18 of 22" is the only fact that travels.
          const all = [...rows, ...blocked];
          console.log('\n===== PER-OBJECT RESULT =====');
          for (const r of all) {
            console.log(
              [
                // In prune the outcome IS the news — SOURCE-DELETED must never
                // be flattened into a cheerful "OK".
                MODE === 'prune' ? r.outcome : r.verified ? 'OK     ' : r.outcome === 'BLOCKED' ? 'BLOCKED' : r.outcome,
                'src=' + r.key,
                'domain=' + r.domain,
                'class=' + r.visibility,
                'dest=' + r.destination,
                'destKey=' + (r.destination === '-' ? '-' : r.key),
                'bytes=' + r.bytes,
                'proof=' + r.method + (r.detail ? ':' + r.detail : ''),
              ].join('  ')
            );
          }
          const pub = rows.filter((r) => r.visibility === 'public' && r.verified);
          const priv = rows.filter((r) => r.visibility === 'private' && r.verified);
          console.log('\n===== SUMMARY =====');
          console.log('TOTAL LEGACY OBJECTS: ' + all.length);
          console.log('PUBLIC VERIFIED: ' + pub.length);
          console.log('PRIVATE VERIFIED: ' + priv.length);
          console.log('BLOCKED: ' + blocked.length);
          console.log('FAILED: ' + failures);
          console.log('LEGACY DELETED: ' + deleted);
          console.log('\nPUBLIC OBJECT LIST:');
          for (const r of pub) console.log('  ' + r.key + '  (' + r.bytes + ' B, ' + r.method + ')');
          console.log('PRIVATE OBJECT LIST:');
          for (const r of priv) console.log('  ' + r.key + '  (' + r.bytes + ' B, ' + r.method + ')');
          console.log('BLOCKED OBJECT LIST + EXACT REASON:');
          for (const r of blocked) console.log('  ' + r.key + '  -> ' + r.method + ': ' + r.detail);
          if (blocked.length === 0) console.log('  (none)');

          if (!verifiedAll) {
            console.error('\n' + failures + ' object(s) failed verification, ' + blocked.length + ' blocked.');
            if (MODE === 'prune' && deleted > 0) {
              console.error(deleted + ' SOURCE OBJECT(S) WERE DELETED BEFORE THIS RUN STOPPED. They are listed above as SOURCE-DELETED.');
            }
            // NAME THEM, IN THE LOG. These rows lived only in the step summary,
            // so a run that refused to delete could not tell anyone WHICH four
            // objects to fix without opening a web page and scrolling a table.
            // A refusal you cannot act on is only half a safety feature.
            for (const r of rows.filter((x) => x.outcome === 'FAILED')) {
              console.error('  FAILED  ' + r.key + '  (' + r.method + ': ' + r.detail + ')');
            }
            for (const r of blocked) {
              console.error('  BLOCKED ' + r.key + '  (' + r.method + ': ' + r.detail + ')');
            }
            if (MODE === 'copy') {
              console.error('Nothing has been deleted. Fix or hand-move those objects, then re-run —');
              console.error('objects already verified are skipped, so a re-run is cheap and safe.');
            } else {
              console.error('A re-run will skip what is already gone and retry only what was kept.');
            }
            if (fatal) console.error('The run stopped early: ' + fatal);
            process.exit(1);
          }
          TSEOF
          test -s ./scripts/media-bucket-move.gen.ts || { echo "::error::runner was not written"; exit 1; }
          wc -l ./scripts/media-bucket-move.gen.ts

      # The runner is typechecked against the real worker/ sources it imports
      # BEFORE it is allowed near R2. A migration script that does not compile
      # against the split rule it claims to use is not using it.
      - name: Typecheck the runner against the repository it imports from
        run: npx tsc --noEmit -p tests/tsconfig.json

      - name: COPY every legacy object to its bucket, then verify every copy
        env:
          MODE: copy
          SOURCE_BUCKET: ${{ inputs.source_bucket }}
          PUBLIC_BUCKET: ${{ inputs.public_bucket }}
          PRIVATE_BUCKET: ${{ inputs.private_bucket }}
          MANIFEST: ${{ runner.temp }}/media-move-manifest.json
        run: npx tsx ./scripts/media-bucket-move.gen.ts

      # DOES THE SHOP ACTUALLY SERVE WHAT WE JUST FILED?
      #
      # A migration that verifies bytes in a bucket has proved storage, not
      # delivery. The Worker decides public-vs-private from the KEY, by the same
      # isAnonymousPublicMediaKey this job used to choose a bucket — so the two
      # can disagree, and the way you find out is by asking the live site as an
      # anonymous stranger would.
      #
      # Both directions matter, and the second one more:
      #   a PUBLIC key must answer 200 with no credentials;
      #   a PRIVATE key must NOT — a customer's receipt or chat photo answering
      #   200 to a stranger is a data leak, and this step would catch it.
      #
      # Read-only, unauthenticated, and never fatal: the live Worker may be
      # older than the classification this run used, and that is a deploy fact
      # to report, not a reason to fail a storage migration.
      # `if: always()` IS THE WHOLE POINT, and its absence made the last run
      # useless. The copy step exits non-zero whenever ANYTHING is blocked, and
      # the four things blocked here are zero-byte dashboard folder markers that
      # will never be copyable. So `continue-on-error` alone did nothing: a step
      # that is never STARTED cannot continue past an error. Delivery is an
      # independent question from storage and must be asked either way.
      - name: Ask the live site whether these keys are served as classified
        if: always()
        continue-on-error: true
        run: |
          set +e
          BASE="https://levonis-iq.com"
          LEAKS=0
          PUBFAIL=0
          echo "=== anonymous delivery, through the Worker's own /files route ==="
          echo "(no cookie, no Authorization header - exactly what a stranger sends)"
          probe() {
            key="$1"; expect="$2"
            code=$(curl -s -o /tmp/probe.bin -w '%{http_code}' --max-time 25 "$BASE/files/$key")
            bytes=$(stat -c%s /tmp/probe.bin 2>/dev/null || echo 0)
            if [ "$expect" = "public" ]; then
              if [ "$code" = "200" ] && [ "$bytes" -gt 0 ]; then
                echo "  PUBLIC OK       $code  ${bytes} B  $key"
              else
                echo "  ::error::PUBLIC FAILED  $code  ${bytes} B  $key  (expected 200 with a body)"
                PUBFAIL=$((PUBFAIL + 1))
              fi
            else
              if [ "$code" = "200" ] && [ "$bytes" -gt 0 ]; then
                echo "  ::error::LEAK   $code  ${bytes} B  $key  (a private object answered an anonymous request)"
                LEAKS=$((LEAKS + 1))
              else
                echo "  private OK      $code  ${bytes} B  $key  (correctly refused)"
              fi
            fi
          }
          probe "UiUx/Logo/Logo.webp" public
          # One representative key per customer-data domain this migration filed
          # as private. All four are refused by the SAME check: /files/* answers
          # an anonymous request for any non-public key with 403 "Sign in to
          # access this file" before it looks at the prefix at all, so the
          # per-domain branches below it (owner, chat participant) are never
          # reached without a session. Any refusal is correct here - only a 200
          # carrying a body is not, and that is what this step is looking for.
          probe "receipts/usr_04834acf6e1e4bf1bd6f/3994c9ee34f64aa9a2c4.png" private
          probe "chat/usr_7eeadbc88ab04da7856d/a4af69669be943e0ada9.jpg" private
          probe "reviews/usr_934b7beb1ff24ce2b6b6/4aa60f3409074d8f8fb2.png" private
          probe "reviews-evidence/usr_934b7beb1ff24ce2b6b6/6f68671f892c4c4d94f2.png" private
          echo ""
          echo "=== a key that does not exist must look the same as one you may not have ==="
          nf=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$BASE/files/receipts/usr_nobody/none.png")
          echo "  absent receipt -> $nf (an existing-but-forbidden receipt answers 403; both refuse)"
          echo ""
          echo "=== do the public pages that carry the logo still load? ==="
          for page in / /products; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$page")
            echo "  $page -> $code"
          done
          echo ""
          echo "PUBLIC FAILURES: $PUBFAIL"
          echo "ANONYMOUS LEAKS: $LEAKS"

      # ONE directory, so the artifact's internal layout is flat and known.
      # (upload-artifact@v4 roots a multi-path upload at the paths' common
      # ancestor, which for a runner.temp path and a workspace path is several
      # directories above both — job 2 would then not find either file.)
      - name: Stage the manifest and the runner for job 2
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/artifact"
          cp "${{ runner.temp }}/media-move-manifest.json" "${{ runner.temp }}/artifact/media-move-manifest.json"
          cp ./scripts/media-bucket-move.gen.ts "${{ runner.temp }}/artifact/media-bucket-move.gen.ts"
          ls -l "${{ runner.temp }}/artifact"

      # The manifest is the ONLY thing that can unlock job 2, and it is uploaded
      # only if every step above exited zero. There is no path to the delete job
      # that does not pass through a green verification.
      - name: Upload the verification manifest and the exact runner that produced it
        uses: actions/upload-artifact@v4
        with:
          name: media-move-manifest
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 30

      # THE NUMBERS GO LAST.
      #
      # The runner prints its totals when it finishes, which is the middle of
      # the job — two more steps run after it, and a log reader (or an API
      # client fetching the tail) lands past them every time. The counts that
      # answer "did this migration succeed?" belong at the END of the job, so
      # they are the first thing found and the last thing printed.
      #
      # Recomputed from the manifest rather than echoed from the step above, so
      # these lines report what was actually WRITTEN, not what was intended.
      - name: Print the verified totals last, where a reader will find them
        if: always()
        run: |
          node -e '
            const m = require("${{ runner.temp }}/media-move-manifest.json");
            const rows = m.rows ?? [], blocked = m.blocked ?? [];
            const n = (v) => rows.filter((r) => r.visibility === v && r.verified).length;
            console.log("===== VERIFIED TOTALS =====");
            console.log("SOURCE BUCKET        : " + m.source);
            console.log("TOTAL REAL OBJECTS   : " + rows.length);
            console.log("PUBLIC VERIFIED      : " + n("public"));
            console.log("PRIVATE VERIFIED     : " + n("private"));
            console.log("BLOCKED              : " + blocked.length);
            console.log("FAILED               : " + rows.filter((r) => r.outcome === "FAILED").length);
            console.log("LEGACY DATA FILES DELETED: " + rows.filter((r) => r.outcome === "SOURCE-DELETED").length);
            console.log("VERIFIED ALL         : " + m.verified_all);
            const byDomain = {};
            for (const r of rows) byDomain[r.domain] = (byDomain[r.domain] ?? 0) + 1;
            console.log("BY DOMAIN            : " + JSON.stringify(byDomain));
          '

  # =========================================================================
  # JOB 2 — DELETE THE LEGACY SOURCE OBJECTS. SEPARATELY GATED.
  # =========================================================================
  # It cannot run unless ALL of these hold:
  #   * job 1 succeeded in THIS run (`needs: copy`), and
  #   * the owner typed the second phrase, and
  #   * the manifest job 1 produced is for these exact buckets and says every
  #     object verified, and
  #   * each object's destination re-answers for it, right now, one at a time.
  #
  # It deletes OBJECTS from the legacy bucket. It never deletes a bucket.
  prune:
    name: Delete the verified legacy source objects (second gate)
    needs: copy
    if: ${{ inputs.delete_confirm != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Same pair, same precedence as job 1 — see the note there.
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.R2_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.R2_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Second confirmation gate
        run: |
          [ "${{ inputs.delete_confirm }}" = "DELETE-LEGACY-SOURCE" ] \
            || { echo "::error::type DELETE-LEGACY-SOURCE to delete the verified source objects — aborting, nothing deleted"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # The manifest AND the exact runner job 1 executed. Job 2 re-generates
      # nothing, so the code that verified and the code that deletes are the
      # same bytes.
      - uses: actions/download-artifact@v4
        with:
          name: media-move-manifest
          path: ${{ runner.temp }}/from-copy

      - name: Refuse a manifest that is not a clean pass, or is for other buckets
        run: |
          set -e
          cp "${{ runner.temp }}/from-copy/media-bucket-move.gen.ts" ./scripts/media-bucket-move.gen.ts
          cp "${{ runner.temp }}/from-copy/media-move-manifest.json" "${{ runner.temp }}/media-move-manifest.json"
          MANIFEST="${{ runner.temp }}/media-move-manifest.json" \
          WANT_SOURCE='${{ inputs.source_bucket }}' \
          WANT_PUBLIC='${{ inputs.public_bucket }}' \
          WANT_PRIVATE='${{ inputs.private_bucket }}' \
          node -e '
            const m = JSON.parse(require("fs").readFileSync(process.env.MANIFEST, "utf8"));
            const want = {
              source: process.env.WANT_SOURCE,
              public_bucket: process.env.WANT_PUBLIC,
              private_bucket: process.env.WANT_PRIVATE,
            };
            for (const [k, v] of Object.entries(want)) {
              if (m[k] !== v) { console.error("::error::manifest " + k + " is " + m[k] + ", this run asked for " + v); process.exit(1); }
            }
            if (m.mode !== "copy") { console.error("::error::manifest is not from a copy job"); process.exit(1); }
            if (!m.verified_all) { console.error("::error::manifest says verification did not pass"); process.exit(1); }
            console.log("manifest accepted: " + m.rows.length + " verified object(s)");
          '
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          echo "R2_ENDPOINT=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: RE-VERIFY each object, then delete only that object's source
        env:
          MODE: prune
          SOURCE_BUCKET: ${{ inputs.source_bucket }}
          PUBLIC_BUCKET: ${{ inputs.public_bucket }}
          PRIVATE_BUCKET: ${{ inputs.private_bucket }}
          MANIFEST: ${{ runner.temp }}/media-move-manifest.json
        run: npx tsx ./scripts/media-bucket-move.gen.ts

      - name: Upload the prune manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-prune-manifest
          path: ${{ runner.temp }}/media-move-manifest.json
          if-no-files-found: warn
          retention-days: 30

      # HOW MANY IRREPLACEABLE OBJECTS DID THIS JOB DESTROY?
      #
      # Job 1 has a totals step; job 2 had none, so the only place
      # SOURCE-DELETED was ever counted was a step that runs in the job where
      # that count is always zero. The job that actually deletes has to be the
      # job that says how much it deleted, and it has to say it LAST, where a
      # reader lands.
      #
      # `if: always()` because a run that stopped half-way is the run whose
      # numbers matter most.
      - name: Print what was actually deleted, last
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const path = "${{ runner.temp }}/media-move-manifest.json";
            if (!fs.existsSync(path)) { console.log("no manifest on disk — the run did not reach its report"); process.exit(0); }
            const m = JSON.parse(fs.readFileSync(path, "utf8"));
            const rows = m.rows ?? [], blocked = m.blocked ?? [];
            const count = (o) => rows.filter((r) => r.outcome === o).length;
            console.log("===== LEGACY SOURCE CLEANUP TOTALS =====");
            console.log("MANIFEST MODE              : " + m.mode);
            if (m.mode !== "prune") {
              console.log("::error::this is not a prune manifest — the delete step did not write its record");
            }
            console.log("SOURCE BUCKET              : " + m.source);
            console.log("LEGACY SOURCE DELETED      : " + count("SOURCE-DELETED"));
            console.log("ALREADY GONE (earlier run) : " + count("ALREADY-GONE"));
            console.log("KEPT (refused a check)     : " + blocked.length);
            console.log("DESTINATION OBJECTS DELETED: 0");
            console.log("CLEAN RUN                  : " + m.verified_all);
            for (const r of blocked) console.log("  KEPT " + r.key + " -> " + r.method + ": " + r.detail);
          '
