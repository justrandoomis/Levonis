# ---------------------------------------------------------------------------
#   levonis-iq.com -> Worker levonis-staging
# ---------------------------------------------------------------------------
# Read-only proof that the three things the owner asked for are LIVE:
#
#   1. the product form no longer carries the «الفلاتر» block,
#   2. its save bar is the flush-to-the-edge one, not the floating card,
#   3. the import/export template is offered per product type, and the type
#      endpoint exists and is admin-gated,
#   4. the TXT export reads the RELATIONAL options/colours/images rather than
#      the products row alone, and gates the cost on the admin's permission.
#
# WHAT IT WRITES: nothing. Every request is an anonymous GET; the admin
# endpoints are probed only for their refusal, which is what proves they are
# both deployed and still closed. Check 4 additionally reads the deployed
# Worker script over the Cloudflare API — a GET — and prints verdicts only,
# never the script.
name: 22 - Verify Live Product Form & Import Template (read-only)

on:
  workflow_dispatch:
    inputs:
      apex:
        description: 'Main site origin'
        required: false
        default: 'https://levonis-iq.com'

concurrency: verify-live-product-template

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APEX: ${{ github.event.inputs.apex || 'https://levonis-iq.com' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: The template endpoints are deployed and still admin-only
        id: api
        run: |
          set -euo pipefail
          fail=0
          refuse() { # path, what it is
            code=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 25 "$APEX$1" || echo 000)
            # 401/403 proves the route EXISTS and is closed; 404 would mean the
            # deploy never carried it, which is the failure this step is for.
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "  ok   $2 is deployed and refuses a stranger ($code)"
            else
              echo "  FAIL $2 answers $code: $(head -c 140 /tmp/body.json)"
              fail=1
            fi
          }
          refuse '/api/admin/import/types'                       'the product-type list'
          refuse '/api/admin/import/template?type=filament'      'the filament template'
          refuse '/api/admin/import/lookups'                     'the classification lookups'
          refuse '/api/admin/taxonomy/catalogs'                  'the section tree'
          refuse '/api/admin/template/export/no-such-product'    'the TXT export'
          exit $fail

      - name: Read every module the deployed app serves
        id: fetch
        run: |
          set -euo pipefail
          bash scripts/live-modules.sh "$APEX" "/"
          ls /tmp/mods > /tmp/module-list.txt

      - name: The shipped product form dropped the filters block
        id: filters
        run: |
          set -euo pipefail
          fail=0
          # `grep -l` writes to a FILE and is never piped: `grep -q` would stop
          # at the first match, the writer would take SIGPIPE, and `pipefail`
          # would then read a successful match as a failed pipeline.
          hit=$(grep -l 'Filters — separate from sections' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -z "$hit" ]; then
            echo "  ok   no served module carries the «الفلاتر» block any more"
          else
            echo "  FAIL the filters block is still in $(basename "$hit")"; fail=1
          fi
          hit=$(grep -l 'Sub-section' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   the sub-section field is still shipped — in $(basename "$hit")"
          else
            echo "  FAIL the sub-section field is missing from the bundle"; fail=1
          fi
          exit $fail

      - name: The shipped save bar is the flush one
        id: savebar
        run: |
          set -euo pipefail
          fail=0
          hit=$(grep -l 'save-bar' /tmp/mods/* 2>/dev/null | head -1 || true)
          [ -n "$hit" ] || { echo "  FAIL no served module renders the save bar"; exit 1; }
          echo "  ok   the save bar is shipped — in $(basename "$hit")"
          # The old bar faded the page through a gradient and sat on rounded
          # corners; the new one is an opaque band with a hairline on top.
          bad=$(grep -l 'from-zinc-950 via-zinc-950/95 to-transparent' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -z "$bad" ]; then
            echo "  ok   the floating gradient bar is gone"
          else
            echo "  FAIL the old gradient save bar is still in $(basename "$bad")"; fail=1
          fi
          good=$(grep -l 'admin-main-pb' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$good" ]; then
            echo "  ok   the shell publishes its bottom padding for the bar to cancel — in $(basename "$good")"
          else
            echo "  FAIL the bottom-edge mechanism is not in the bundle"; fail=1
          fi
          exit $fail

      - name: The shipped import panel offers the four product types
        id: types
        run: |
          set -euo pipefail
          fail=0
          hit=$(grep -l 'data-import-type' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   the type picker is shipped — in $(basename "$hit")"
          else
            echo "  FAIL no served module renders the product-type picker"; fail=1
          fi
          hit=$(grep -l 'import/types' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   the panel asks the server for the types — in $(basename "$hit")"
          else
            echo "  FAIL the panel does not read /api/admin/import/types"; fail=1
          fi
          exit $fail

      - name: Per-option availability is live — 0043
        id: availability
        run: |
          set -euo pipefail
          fail=0
          present() { # marker, what it is
            hit=$(grep -l "$1" /tmp/mods/* 2>/dev/null | head -1 || true)
            if [ -n "$hit" ]; then
              echo "  ok   $2 — in $(basename "$hit")"
            else
              echo "  FAIL $2 is not in any served module"; fail=1
            fi
          }
          # The storefront's two-step chooser: pick the model, then pick how to
          # get it. Attribute VALUES are what survive minification; the
          # authored data-* form becomes an object key and would not match.
          present 'variant-chooser'      'the model chooser ships'
          present 'availability-chooser' 'the availability chooser ships'
          present 'variant_key'          'options carry their model key'
          present 'availability_type'    'options carry their own availability'
          present 'lead_time_text'       'the pre-order lead time reaches the customer'
          # The admin editor's per-option availability control.
          present 'option-availability'  'the admin option editor asks the question'
          exit $fail

      - name: The pre-order lead time is customer-facing, the cost is not
        id: costsafety
        run: |
          set -euo pipefail
          fail=0
          # A public product payload must never carry a cost at ANY level, and
          # the 0043 fields must not have smuggled one in beside them. This
          # reads a real storefront product anonymously.
          slug=$(curl -s --compressed --max-time 25 "$APEX/api/products?limit=1" \
            | grep -oE '"slug":"[^"]+"' | head -1 | cut -d'"' -f4 || true)
          if [ -z "$slug" ]; then
            echo "  ok   no public product to read — nothing to leak"
            exit 0
          fi
          body=$(curl -s --compressed --max-time 25 "$APEX/api/products/$slug")
          if printf '%s' "$body" | grep -q 'cost_iqd'; then
            echo "  FAIL a public product payload carries cost_iqd"; fail=1
          else
            echo "  ok   the public payload for \"$slug\" carries no cost at any level"
          fi
          exit $fail

      # ------------------------------------------------------- worker source
      # The two checks above read the BROWSER bundle. The TXT export is server
      # code, and no anonymous request can show what it puts in the file: the
      # route is admin-only, and this job deliberately holds no admin
      # credentials. So the deployed Worker script itself is read — a GET
      # against the Cloudflare API with the token this repository already uses
      # to deploy — and the two lines that were wrong are located inside it.
      #
      # The script is NEVER printed. Only the verdicts below reach the log.
      - name: The deployed TXT export reads the relational tables and gates the cost
        id: exportcode
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/worker.bundle -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-staging" || echo 000)
          if [ "$code" != "200" ]; then
            echo "  FAIL could not read the deployed Worker script (HTTP $code)"
            exit 1
          fi
          echo "  read the deployed script ($(wc -c < /tmp/worker.bundle) bytes)"
          node -e "
            const fs = require('fs');
            const s = fs.readFileSync('/tmp/worker.bundle', 'utf8');
            let fail = 0;
            const ok = (m) => console.log('  ok   ' + m);
            const no = (m) => { console.log('  FAIL ' + m); fail = 1; };

            // A positive control first. If the script we downloaded does not
            // even contain the export route, every miss below would be a miss
            // for the wrong reason.
            if (s.includes('/export/:productId')) ok('the TXT export route is in the deployed script');
            else { no('the deployed script has no TXT export route — the checks below prove nothing'); process.exit(1); }

            // 1. The bug the owner hit: the export loaded the products ROW and
            //    stopped there, so a product whose options, colours and images
            //    live in the relational tables exported as a near-empty file.
            // The loader is matched by PREFIX, not by an exact name: it was
            // renamed to loadProductDocWithView when the single persistence
            // contract landed, and an exact-name check reported the export as
            // broken while it was reading the relation tables correctly. What
            // matters is the body, asserted below.
            const i = s.indexOf('async function loadProductDoc');
            if (i < 0) no('no loadProductDoc* loader is in the deployed script');
            else {
              const body = s.slice(i, i + 600);
              if (body.includes('loadRelationsView')) ok('the export reads the relational tables');
              else no('the export still reads only the products row — options/colours/images would be missing');
              if (body.includes('applyRelations')) ok('it overlays them the same way the storefront does');
              else no('the relational rows are read but not overlaid onto the document');
            }

            // 2. §11: the TXT file used to carry every cost to anyone who could
            //    reach the button. CSV always gated it; TXT did not.
            const j = s.indexOf('/export/:productId');
            const route = s.slice(j, j + 500);
            if (route.includes('includeCost')) ok('the TXT export asks whether this admin may see cost');
            else no('the TXT export does not gate the cost — it would leak to any staff account');
            process.exit(fail);
          "

      # ---------------------------------------------------------------
      # The 2026-09-09 product-form round: P1 the effective price, P2 the
      # FDM/Resin narrowing, P3 the honest image failure, P4 the usage-step
      # media. Each check greps for a string that exists ONLY because the fix
      # shipped — an anchor a refactor would have to deliberately rewrite, not
      # a coincidence of the bundler.
      # ---------------------------------------------------------------
      - name: The product-form round is live — effective prices, FDM narrowing, honest images
        id: formround
        run: |
          set -euo pipefail
          fail=0

          # P1. EVERY MARKER HERE IS A STRING LITERAL OR AN ATTRIBUTE VALUE,
          # never an identifier: `rowCells` and friends are renamed by the
          # minifier, so grepping for them would fail on a bundle that carries
          # the fix perfectly. Verified against a local `npm run build` before
          # this check was written.
          #
          # The provenance line under each price cell exists only because the
          # cell resolves through the shared ladder — it has nothing to print
          # otherwise.
          hit=$(grep -l 'data-price-mode' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P1 the price provenance line ships — in $(basename "$hit")"
          else
            echo "  FAIL P1 the provenance line is missing — the form would show «inherit» again"; fail=1
          fi
          # The «يرث» reset button: a cell can only offer to STOP overriding if
          # it knows it is overriding, which is the resolved mode.
          hit=$(grep -l 'data-price-inherit' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P1 the return-to-inherit control ships — in $(basename "$hit")"
          else
            echo "  FAIL P1 the return-to-inherit control is missing"; fail=1
          fi
          # And the member-fallback disclosure: a tier with no price of its own
          # is charged the regular price, and the cell says so.
          hit=$(grep -l 'regular-fallback' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P1 the PRIME/PRO fallback disclosure ships — in $(basename "$hit")"
          else
            echo "  FAIL P1 the member-fallback disclosure is missing"; fail=1
          fi

          # P2 is server-side, so it is proved by the API rather than the
          # bundle: the seeded FDM section must answer with the FDM group and
          # WITHOUT the resin one. The endpoint is admin-only, so an anonymous
          # probe proves deployment + closure, exactly like the checks above.
          code=$(curl -s -o /tmp/tpl.json -w '%{http_code}' \
            "$APEX/api/admin/taxonomy/templates?category=cat_printers_fdm" || echo 000)
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "  ok   P2 the section-template endpoint is deployed and still admin-only (HTTP $code)"
          else
            echo "  FAIL P2 the section-template endpoint answered $code to an anonymous GET"; fail=1
          fi
          echo "  note P2 the narrowing itself is server-side; the client only renders whatever groups that endpoint returns"

          # P3. A failed image must say so and offer a replacement rather than
          # rendering the browser's broken-file glyph.
          hit=$(grep -l 'تعذر تحميل الصورة' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P3 the honest image-failure state ships — in $(basename "$hit")"
          else
            echo "  FAIL P3 the image failure state is missing from the bundle"; fail=1
          fi
          hit=$(grep -l 'data-image-primary-broken' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P3 the broken-primary warning ships — in $(basename "$hit")"
          else
            echo "  FAIL P3 the broken-primary warning is missing"; fail=1
          fi
          hit=$(grep -l 'data-image-replace-url' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P3 replace-URL ships, so a failure is repaired and never deleted — in $(basename "$hit")"
          else
            echo "  FAIL P3 the replace-URL control is missing"; fail=1
          fi

          # P4. The usage-step editor warns before a media-only step is lost.
          hit=$(grep -l 'data-usage-step-warning' /tmp/mods/* 2>/dev/null | head -1 || true)
          if [ -n "$hit" ]; then
            echo "  ok   P4 the usage-step media warning ships — in $(basename "$hit")"
          else
            echo "  FAIL P4 the usage-step warning is missing"; fail=1
          fi

          exit $fail

      - name: Result
        if: always()
        run: |
          {
            echo '### Live product form & import template verification'
            echo ''
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| template endpoints deployed and admin-only | ${{ steps.api.outcome }} |"
            echo "| the filters block is gone from the form | ${{ steps.filters.outcome }} |"
            echo "| the save bar is the flush-to-the-edge one | ${{ steps.savebar.outcome }} |"
            echo "| the import panel offers the four product types | ${{ steps.types.outcome }} |"
            echo "| per-option availability, lead time and model key ship | ${{ steps.availability.outcome }} |"
            echo "| a public product payload still carries no cost | ${{ steps.costsafety.outcome }} |"
            echo "| the deployed TXT export reads relations and gates cost | ${{ steps.exportcode.outcome }} |"
            echo "| the product-form round is live (P1 price, P2 narrowing, P3 images, P4 usage media) | ${{ steps.formround.outcome }} |"
            echo ''
            echo 'Read-only: every request was an anonymous GET; the admin endpoints were probed only for their refusal.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run if any check failed
        if: steps.api.outcome != 'success' || steps.filters.outcome != 'success' || steps.savebar.outcome != 'success' || steps.types.outcome != 'success' || steps.availability.outcome != 'success' || steps.costsafety.outcome != 'success' || steps.exportcode.outcome != 'success' || steps.formround.outcome != 'success'
        run: exit 1
