# ---------------------------------------------------------------------------
# WHICH WAYS IN ARE ACTUALLY WORKING RIGHT NOW — ten seconds, no deploy.
#
# Workflow 7 already prints this, but it prints it after a seventeen-minute
# deploy, which is no use when the question is "is Google sign-in on?" and the
# answer changes without anyone deploying anything.
#
# THE FAILURE THIS EXISTS FOR (docs/AUTH_PROVIDERS.md §10). There are two
# deployers for levonis-staging. Workflow 7 reads the running Worker's vars and
# carries them forward; the Cloudflare Workers Builds Git integration reads
# wrangler.jsonc, where those vars are empty strings, and writes the empty
# strings over them. `wrangler deploy` replaces plain-text vars WHOLESALE, so
# every push to the default branch blanks GOOGLE_CLIENT_ID and EMAIL_FROM —
# and Google sign-in, password reset, email verification and email sign-in
# codes all go dark, silently, until somebody runs workflow 7 again.
#
# SECRETS SURVIVE AND VARS DO NOT, which is why the symptom looks random:
# `whatsappOtp:true` beside `google:false` is that bug every time, because
# WASENDER_API_KEY is a secret and GOOGLE_CLIENT_ID is a var.
#
# MANUAL ONLY, on purpose. A schedule here would email on every push until the
# Git integration is disconnected, and a check that cries every hour is a check
# people turn off. Add a `schedule:` line once there is one deployer.
#
# READ-ONLY: four unauthenticated GETs against the live site. It creates
# nothing, changes nothing, and prints no secret — the Google client id is
# public by construction and is still only reported as present or absent.
# ---------------------------------------------------------------------------
name: 46 - Verify LIVE sign-in methods (read-only, 10 seconds)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the live site what it offers
        run: |
          set -e
          BODY=$(curl -sS --max-time 25 "https://levonis-iq.com/api/auth/capabilities")
          echo "$BODY" | jq -e '.success == true' > /dev/null \
            || { echo "::error::/api/auth/capabilities did not answer"; echo "$BODY" | head -c 300; exit 1; }

          {
            echo "| Method | Live |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for k in emailPassword google telegram phoneSignIn phoneSignup emailOtp whatsappOtp passwordReset emailVerification; do
            V=$(echo "$BODY" | jq -r ".$k")
            echo "  $k: $V"
            echo "| $k | $V |" >> "$GITHUB_STEP_SUMMARY"
          done

          # The two halves of the same story, told apart. A var that was blanked
          # and a secret that was never uploaded look identical from outside,
          # and they have completely different fixes.
          GOOGLE=$(echo "$BODY" | jq -r '.google')
          WA=$(echo "$BODY" | jq -r '.whatsappOtp')
          MAIL=$(echo "$BODY" | jq -r '.emailOtp')

          FAIL=0
          if [ "$GOOGLE" != "true" ]; then
            echo "::error::Google sign-in is OFF. GOOGLE_CLIENT_ID is a VAR on the Worker."
            FAIL=1
          fi
          if [ "$MAIL" != "true" ]; then
            echo "::error::Email codes, password reset and email verification are OFF. They need EMAIL_API_KEY (a secret) AND EMAIL_FROM (a var)."
            FAIL=1
          fi

          if [ "$FAIL" = "1" ] && [ "$WA" = "true" ]; then
            echo "::warning::A VAR was lost while a SECRET survived — that is the signature of a Cloudflare Git-integration deploy overwriting wrangler.jsonc's empty vars. See docs/AUTH_PROVIDERS.md §10. Run workflow 7 to restore, and disconnect the Git integration so it stops happening."
          fi

          [ "$FAIL" = "0" ] || exit 1
          echo "every sign-in method this shop is configured for is live"

      # ---------------------------------------------------------------------
      # THE ONE THING /api/auth/capabilities CANNOT ANSWER.
      #
      # `whatsappOtp: true` means a WasenderAPI KEY is present. It does not mean
      # a single message can be sent. WasenderAPI drives a REAL WhatsApp account
      # — a phone linked by QR code — and that session can be logged out while
      # the key stays perfectly valid. The provider then answers a 4xx saying
      # "Session is not Connected", not a 401, so nothing that only checks
      # configuration can tell the difference.
      #
      # That is the shop being "configured" and unable to send one code, for
      # days, while every customer is told to try again shortly. The only honest
      # way to know is to ask the provider, which needs the key — and the key is
      # a repository secret, so this workflow can ask and the public capabilities
      # endpoint cannot.
      #
      # It prints the SESSION STATE and never the key.
      # ---------------------------------------------------------------------
      - name: Is the shop's WhatsApp actually linked, or only configured?
        env:
          WASENDER_API_KEY: ${{ secrets.WASENDER_API_KEY }}
        run: |
          set -e
          if [ -z "$WASENDER_API_KEY" ]; then
            echo "::warning::no WASENDER_API_KEY repository secret — WhatsApp codes are off by configuration, not by session"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/wa.json -w '%{http_code}' --max-time 20             -H "Authorization: Bearer $WASENDER_API_KEY"             https://www.wasenderapi.com/api/status || echo 000)
          echo "provider answered HTTP $CODE"
          # Session state only. The body can carry account details, so a fixed
          # whitelist of fields is echoed rather than the whole answer.
          STATUS=$(jq -r '.status // .data.status // .session_status // "unknown"' /tmp/wa.json 2>/dev/null || echo unknown)
          echo "session status : $STATUS"
          echo "| WhatsApp session | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
          case "$CODE:$STATUS" in
            200:connected)
              echo "WhatsApp can send — the phone is linked" ;;
            401:*|403:*)
              echo "::error::the WasenderAPI key is rejected (401/403). Replace the WASENDER_API_KEY secret and re-run workflow 7."
              exit 1 ;;
            *)
              echo "::error::WhatsApp is configured but NOT connected (status: $STATUS). Re-link the phone in the WasenderAPI dashboard by scanning its QR code — no deploy will fix this, and every sign-in code over WhatsApp fails until it is done."
              exit 1 ;;
          esac

      - name: What Telegram has registered for this bot
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e
          if [ -z "$TG" ]; then
            echo "::warning::no TELEGRAM_BOT_TOKEN repository secret"
            exit 0
          fi
          curl -sS --max-time 20 "https://api.telegram.org/bot${TG}/getWebhookInfo" -o /tmp/tg.json
          URL=$(jq -r '.result.url // ""' /tmp/tg.json)
          PENDING=$(jq -r '.result.pending_update_count // 0' /tmp/tg.json)
          LAST=$(jq -r '.result.last_error_message // "none"' /tmp/tg.json)
          echo "registered url : ${URL:-<none>}"
          echo "pending updates: $PENDING"
          echo "last error     : $LAST"
          echo "| Telegram webhook | ${URL:-none} |" >> "$GITHUB_STEP_SUMMARY"
          [ "$URL" = "https://levonis-iq.com/api/telegram/webhook" ] \
            || { echo "::error::the bot does not point at the live handler — run workflow 16 in repair mode"; exit 1; }
          # A backlog means Telegram is retrying because the handler is refusing
          # it. A stale last_error with no backlog is history, not a fault.
          [ "$PENDING" -lt 5 ] \
            || { echo "::error::$PENDING updates are queued — the webhook handler is refusing Telegram"; exit 1; }
          echo "Telegram is delivering to the live handler"

      - name: The schema the live code expects is the schema it has
        run: |
          set -e
          H=$(curl -sS --max-time 25 "https://levonis-iq.com/api/health")
          echo "$H" | jq -c '.schema'
          [ "$(echo "$H" | jq -r '.schema.state')" = "current" ] \
            || { echo "::error::the live database is behind the code that is serving it"; exit 1; }
