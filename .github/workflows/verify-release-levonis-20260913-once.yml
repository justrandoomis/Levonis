# Isolated read-only release proof; no application source or Main changes.
# The first probe incorrectly expected /policy to redirect; it is a working
# render alias. Assert its visible contents instead. Home product shelves load
# on intersection, so browse the real catalog before testing a product link.
name: 43 - Verify published Levonis release (read-only)
on:
  push:
    branches: [codex/release-levonis-20260913]
    paths: ['.github/workflows/verify-release-levonis-20260913-once.yml']
permissions:
  contents: read
  actions: read
concurrency: levonis-release-read-only-proof
jobs:
  verify:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/release-levonis-20260913' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require completed deployment and unchanged reviewed Main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/levonis-live-proof
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const base='https://api.github.com/repos/justrandoomis/Levonis';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          async function get(path){const r=await fetch(base+path,{headers});if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}
          const expected='6b373ded26a1606fd4a545f9cf42c7dc5769094d';
          const run=await get('/actions/runs/34779666070');
          const main=await get('/commits/Main');
          if(run.status!=='completed'||run.conclusion!=='success'||run.head_sha!==expected||main.sha!==expected)throw new Error('Deployment/source mismatch');
          writeFileSync('/tmp/levonis-live-proof/deployment.json',JSON.stringify({run_id:run.id,sha:expected,result:run.conclusion,url:run.html_url},null,2));
          JS
      - name: Install the same isolated browser driver as the green gate
        run: |
          npm install --prefix /tmp/levonis-browser --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/levonis-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Actual published page contents and navigation, no mutations
        env:
          PLAYWRIGHT_MODULE: /tmp/levonis-browser/node_modules/playwright
        run: node .github/levonis-release-live-proof.cjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: levonis-live-release-proof
          path: /tmp/levonis-live-proof/
          retention-days: 7
