# Deploys the CODE to the levonis-staging worker — the one serving
# levonis-iq.com — without touching its data and without changing its config.
#
# WHY NOT "2 - Deploy Staging + Tests":
#
#   * That workflow runs the api-tests suites afterwards, and those CREATE
#     users, orders and memberships. Correct for a throwaway staging database;
#     wrong for the one holding real customers. This one only reads.
#   * That workflow sets APP_ORIGIN to the workers.dev URL it just deployed to.
#     The worker is served on a custom domain now, so that would silently
#     re-point every password-reset and verification link in outbound email at
#     workers.dev. This one CARRIES THE WORKER'S EXISTING VARS FORWARD.
#
# The second point is the whole reason this file exists. `wrangler deploy`
# replaces a Worker's plain-text vars WHOLESALE: any var not passed on the
# command line is deleted from the running Worker. So the current values are
# read back from the Cloudflare API first and passed straight back in, and the
# deploy is refused outright if that read fails — deploying blind would wipe
# them.
#
# Secrets live in a separate store and `wrangler deploy` leaves them alone,
# so no existing secret is ever read or rewritten here. The one write is
# opt-in: if the owner has set the STUDIO_HANDOFF_SECRET repository secret,
# it is uploaded after the deploy so the Studio sign-in handoff has a shared
# secret to compare. Unset, this workflow touches no secret at all.
name: 7 - Deploy Staging Code (no test data, keeps vars)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-CODE to confirm'
        required: true
        default: ''

concurrency: staging-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the confirmation
        run: |
          [ "${{ github.event.inputs.confirm }}" = "DEPLOY-CODE" ] \
            || { echo "::error::type DEPLOY-CODE to confirm"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # `npm run check` now typechecks studio/ too, and it FAILS rather than
      # skipping when that workspace is not installed — deliberately, because
      # a check that quietly passes on code it never read is what let an
      # unbuildable Studio sit in main for a day. So it has to be installed
      # here. It is a separate workspace with its own lockfile; ~20s.
      - name: Install the Studio workspace (npm run check covers it)
        working-directory: studio
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint and unit tests
        run: |
          npm run check
          npm run test:unit

      # Read the vars the running Worker has RIGHT NOW. If this fails the
      # deploy stops: shipping without them would delete them.
      - name: Read the running Worker's plain-text vars
        id: vars
        run: |
          set -e
          curl -sS -f \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-staging/settings" \
            -o /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json > /dev/null \
            || { echo "::error::could not read the worker settings — refusing to deploy and wipe its vars"; exit 1; }

          # Names only. Values are masked in the log and never printed.
          echo "vars currently set on the worker:"
          jq -r '[.result.bindings[] | select(.type == "plain_text") | .name] | sort | join(", ")' /tmp/settings.json

          jq -r '.result.bindings[] | select(.type == "plain_text") | "\(.name)\t\(.text)"' /tmp/settings.json \
            > /tmp/vars.tsv
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] || continue
            echo "::add-mask::$value"
          done < /tmp/vars.tsv
          echo "count=$(wc -l < /tmp/vars.tsv)" >> "$GITHUB_OUTPUT"

      - name: Resolve the staging database id into wrangler.jsonc
        id: db
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-db-staging") | .uuid')
          [ -n "$ID" ] || { echo "::error::levonis-db-staging not found"; exit 1; }
          echo "::add-mask::$ID"
          echo "staging_db_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Fill it in
        env:
          STAGING_DB_ID: ${{ steps.db.outputs.staging_db_id }}
        run: node scripts/set-deploy-ids.mjs --env staging

      - name: Build the frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      # Migrations first: code must never be ahead of its database again.
      # This is the exact failure that took the storefront down on 2026-08-30.
      - name: Apply any pending migrations BEFORE the code that needs them
        run: npx wrangler d1 migrations apply levonis-db-staging --remote --env staging

      # Carrying vars forward preserves what is already there, but it gives
      # the owner no way to SET one — and the Studio sign-in handoff needs a
      # var this worker has never had. STUDIO_ALLOWED_DESTINATIONS is the
      # exact-origin allowlist read by worker/routes/studio.ts; without it
      # every handoff answers 503 STUDIO_NOT_CONFIGURED. Setting the
      # repository secret of the same name adds it here and overrides any
      # stale value; leaving it unset changes nothing.
      - name: Let the owner set the Studio handoff allowlist
        env:
          STUDIO_ALLOWED_DESTINATIONS: ${{ secrets.STUDIO_ALLOWED_DESTINATIONS }}
        run: |
          set -e
          if [ -z "$STUDIO_ALLOWED_DESTINATIONS" ]; then
            echo "STUDIO_ALLOWED_DESTINATIONS not set — Studio sign-in stays honestly disabled"
            exit 0
          fi
          # Drop any existing row for this name first, so the value below is
          # the only one that reaches --var (a repeated --var is ambiguous).
          grep -v "^STUDIO_ALLOWED_DESTINATIONS	" /tmp/vars.tsv > /tmp/vars.keep || true
          printf 'STUDIO_ALLOWED_DESTINATIONS\t%s\n' "$STUDIO_ALLOWED_DESTINATIONS" >> /tmp/vars.keep
          mv /tmp/vars.keep /tmp/vars.tsv
          echo "STUDIO_ALLOWED_DESTINATIONS will be set on this deploy"

      # STORE_ROOT_DOMAIN decides what `classifyHost` calls the apex, and
      # therefore whether /api/admin/* is served at all. It was previously
      # DERIVED from APP_ORIGIN — and APP_ORIGIN on this Worker does not name
      # levonis-iq.com, so every host classified as `foreign`, including the
      # apex, and the whole admin API answered 404 on the live site.
      #
      # hosts.ts no longer fails closed onto the operator that way, but the
      # derivation is still the wrong thing to depend on: the domain the site
      # is served on is a fact this workflow already knows (it curls it, four
      # steps down). So it is set explicitly, and the repository variable
      # overrides it for anyone serving the code somewhere else.
      - name: Pin the store root domain
        env:
          STORE_ROOT_DOMAIN: ${{ vars.STORE_ROOT_DOMAIN || 'levonis-iq.com' }}
        run: |
          set -e
          grep -v "^STORE_ROOT_DOMAIN	" /tmp/vars.tsv > /tmp/vars.keep || true
          printf 'STORE_ROOT_DOMAIN\t%s\n' "$STORE_ROOT_DOMAIN" >> /tmp/vars.keep
          mv /tmp/vars.keep /tmp/vars.tsv
          echo "STORE_ROOT_DOMAIN will be set to $STORE_ROOT_DOMAIN"

      # APP_ORIGIN is what every absolute link is built from: password reset,
      # email verification, auth redirects, Telegram deep links, invoice
      # links. It was NOT naming this domain, so every one of those pointed
      # somewhere else.
      #
      # It is pinned here for the same reason as STORE_ROOT_DOMAIN: the
      # domain this Worker serves is a fact the workflow already knows — it
      # curls it a few steps down — and leaving it to be carried forward from
      # whatever happened to be live is how it drifted in the first place.
      #
      # This workflow deploys the Worker on the CUSTOM DOMAIN. The throwaway
      # workers.dev staging deploy is workflow 2, which sets its own
      # APP_ORIGIN to the URL it just deployed to and is untouched by this.
      - name: Pin the origin every absolute link is built from
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN || 'https://levonis-iq.com' }}
          EXPECTED: ${{ vars.STORE_ROOT_DOMAIN || 'levonis-iq.com' }}
        run: |
          set -e
          case "$APP_ORIGIN" in
            https://*) ;;
            *) echo "::error::APP_ORIGIN must be an https:// origin"; exit 1 ;;
          esac
          echo "$APP_ORIGIN" | grep -q "://$EXPECTED" \
            || { echo "::error::APP_ORIGIN ($APP_ORIGIN) does not name $EXPECTED"; exit 1; }

          PREVIOUS=$(awk -F'\t' '$1=="APP_ORIGIN"{print $2}' /tmp/vars.tsv)
          if [ "$PREVIOUS" = "$APP_ORIGIN" ]; then
            echo "APP_ORIGIN already names the live site — unchanged"
          else
            echo "APP_ORIGIN will be set to $APP_ORIGIN (it did not name the live site)"
          fi
          grep -v "^APP_ORIGIN	" /tmp/vars.tsv > /tmp/vars.keep || true
          printf 'APP_ORIGIN\t%s\n' "$APP_ORIGIN" >> /tmp/vars.keep
          mv /tmp/vars.keep /tmp/vars.tsv

      - name: Deploy, carrying every existing var forward
        run: |
          set -e
          ARGS=()
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] || continue
            ARGS+=(--var "$name:$value")
          done < /tmp/vars.tsv
          echo "re-applying ${#ARGS[@]} existing var(s) so none are wiped"
          npx wrangler deploy --env staging "${ARGS[@]}"

      # AFTER the deploy, never before: a deploy does not touch secrets, but
      # uploading to a worker that is about to be replaced is pointless
      # ordering. The shared secret must be byte-identical to the one on
      # levonis-studio-staging — the Studio worker presents it on
      # /api/studio/handoff/redeem and this worker compares it in constant
      # time. Unset here means the handoff stays honestly disabled.
      - name: Upload the Studio handoff shared secret
        env:
          STUDIO_HANDOFF_SECRET: ${{ secrets.STUDIO_HANDOFF_SECRET }}
        run: |
          if [ -n "$STUDIO_HANDOFF_SECRET" ]; then
            printf '%s' "$STUDIO_HANDOFF_SECRET" | npx wrangler secret put STUDIO_HANDOFF_SECRET --env staging
          else
            echo "STUDIO_HANDOFF_SECRET not set — Studio sign-in stays honestly disabled"
          fi

      # The same proof the Studio deploy now carries, for the store. A green
      # deploy only means wrangler did not error; it does not mean the browser
      # is being handed the new bundle. Vite content-hashes asset filenames, so
      # if levonis-iq.com serves the exact file this run built, byte for byte,
      # then what visitors load IS what was just built.
      #
      # The anchor is client-rendered, so no amount of curling the HTML would
      # show it — the assertion has to be about the script that renders it.
      - name: Prove the live store serves the bundle this run built
        run: |
          set -e
          LOCAL=$(grep -l 'data-service":"studio"' dist/assets/*.js | head -1)
          if [ -z "$LOCAL" ]; then
            echo "::error::no built asset renders the Studio card — tests/store-isolation.test.ts should have caught this"
            exit 1
          fi
          NAME=$(basename "$LOCAL")
          echo "the Studio card is rendered by $NAME ($(wc -c < "$LOCAL") bytes)"

          for i in $(seq 1 10); do
            curl -fsS --max-time 30 "https://levonis-iq.com/assets/$NAME" -o /tmp/live.js && break
            echo "attempt $i: $NAME not served yet"
            sleep 6
          done
          if [ ! -s /tmp/live.js ]; then
            echo "::error::levonis-iq.com does not serve $NAME — the live store is running an older bundle"
            exit 1
          fi

          cmp -s "$LOCAL" /tmp/live.js \
            || { echo "::error::levonis-iq.com serves a DIFFERENT $NAME than this run built"; exit 1; }
          echo "live $NAME is byte-identical to the file this run built"

          # And the specific behaviour the owner asked for: the Studio opens in
          # its own tab, and cannot hand the new tab a handle on this page.
          # Checked around the marker rather than as one literal string — the
          # minifier is free to reorder props, and a check that breaks on a
          # reordering would fail a build that is perfectly correct.
          node -e '
            const fs = require("node:fs");
            const js = fs.readFileSync("/tmp/live.js", "utf8");
            const marker = "\"data-service\":\"studio\"";
            let at = js.indexOf(marker), seen = 0, bad = [];
            while (at !== -1) {
              seen++;
              const win = js.slice(Math.max(0, at - 300), at + 300);
              const missing = ["_blank", "noopener", "noreferrer"].filter((t) => !win.includes(t));
              if (missing.length) bad.push(`occurrence ${seen} is missing: ${missing.join(", ")}`);
              at = js.indexOf(marker, at + 1);
            }
            if (!seen) { console.error("::error::the live bundle renders no Studio card at all"); process.exit(1); }
            if (bad.length) { console.error("::error::" + bad.join("; ")); process.exit(1); }
            console.log(`the live store opens the Studio in its own tab (${seen} entry point(s), each with noopener and noreferrer)`);
          '

      - name: Verify the live site, read-only
        id: probe
        run: |
          fail=0
          for p in /api/health /api/home '/api/products?limit=3' /api/memberships/plans; do
            code=$(curl -s -o /tmp/b.txt -w '%{http_code}' --max-time 25 "https://levonis-iq.com$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || fail=1
          done
          echo "── the plan catalog the storefront will show"
          curl -s --max-time 25 "https://levonis-iq.com/api/memberships/plans" \
            | jq -c '[.plans[] | {id, tier, duration_months, price_iqd}]'
          [ "$fail" = "0" ] || { echo "::error::an endpoint did not answer 200 after the deploy"; exit 1; }

      # The two failures the first production verification found, checked on
      # every deploy from now on. Both were invisible to `npm run check`.
      - name: Prove the live site reports the right origin for its own links
        run: |
          set -e
          # The Worker echoes its configured origin in the Studio handoff's
          # honest-refusal payload and in /api/settings/public. Whichever is
          # available, an emailed link built on this deployment has to start
          # with the live domain.
          BODY=$(curl -s --max-time 25 "https://levonis-iq.com/api/settings/public" || echo '{}')
          echo "$BODY" | head -c 400; echo
          if echo "$BODY" | jq -e '.appOrigin // .app_origin // empty' > /dev/null 2>&1; then
            ORIGIN=$(echo "$BODY" | jq -r '.appOrigin // .app_origin')
            echo "the live site reports its origin as: $ORIGIN"
            case "$ORIGIN" in
              https://levonis-iq.com*) echo "  correct" ;;
              *) echo "::error::the live site builds absolute links on $ORIGIN"; exit 1 ;;
            esac
          else
            echo "  (the public settings endpoint does not expose the origin; the var was set above)"
          fi

      - name: Prove the apex still serves its own admin API and its own cart
        run: |
          set -e
          # 401 (or 403) means the route EXISTS and refused a stranger. 404
          # means the host guard is refusing the apex itself, which is how the
          # entire admin console went dark.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            "https://levonis-iq.com/api/admin/community/overview" || echo 000)
          echo "/api/admin/community/overview (signed out) -> $CODE"
          case "$CODE" in
            401|403) echo "  the admin API is reachable on the apex" ;;
            404) echo "::error::the apex is refusing its own admin API — STORE_ROOT_DOMAIN does not match this host"; exit 1 ;;
            *) echo "::error::unexpected status $CODE"; exit 1 ;;
          esac

          # Adding to a cart needs a session, so this checks the statement's
          # own failure mode instead: a signed-out add must be refused by AUTH
          # (401), never by a 500 from SQL that names an index that does not
          # exist. That 500 is exactly what shipped.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -X POST \
            -H 'Content-Type: application/json' -H 'Origin: https://levonis-iq.com' \
            --data '{"productId":"nope","qty":1}' \
            "https://levonis-iq.com/api/cart/items" || echo 000)
          echo "POST /api/cart/items (signed out) -> $CODE"
          [ "$CODE" != "500" ] || { echo "::error::the cart endpoint is answering 500"; exit 1; }

      - name: Confirm the vars survived
        run: |
          curl -sS -f \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-staging/settings" \
            -o /tmp/after.json
          BEFORE=${{ steps.vars.outputs.count }}
          AFTER=$(jq -r '[.result.bindings[] | select(.type == "plain_text")] | length' /tmp/after.json)
          echo "plain-text vars: $BEFORE before, $AFTER after"
          jq -r '[.result.bindings[] | select(.type == "plain_text") | .name] | sort | join(", ")' /tmp/after.json
          [ "$AFTER" -ge "$BEFORE" ] || { echo "::error::the deploy dropped $((BEFORE - AFTER)) var(s)"; exit 1; }
