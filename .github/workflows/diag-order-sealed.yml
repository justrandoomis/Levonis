# READ-ONLY. Every statement is a SELECT against the live database.
#
# One customer complaint about one order. The answers are sealed in the runner
# to a one-time public key (scripts/bambu-import/seal.mjs) and only the
# .sealed file is uploaded; the log carries row counts only. Lives on branch
# diag/order-30ad only and is deleted with it.
name: 61 - Diagnose one order (read-only, sealed)

on:
  push:
    branches: [diag/order-30ad]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Read the order (SELECT only), seal the answer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEAL_PUBKEY: Clnx4_83Zw5mAOhamIWSLenlGLMP6l7iFWIVILYYvH0
        run: node scripts/diag/order-sealed.mjs --out sealed-out

      - uses: actions/upload-artifact@v4
        with:
          name: order-30ad-sealed
          path: sealed-out/*.sealed
          retention-days: 1
          if-no-files-found: error
