# ---------------------------------------------------------------------------
#   levonis-iq.com -> Worker levonis-staging
# ---------------------------------------------------------------------------
# Read-only proof that Quick Edit pricing is LIVE, not merely merged:
#
#   1. the price-grid endpoints are deployed and still admin-only,
#   2. the shipped bundle actually renders the drawer, the mode chips, the
#      profit column and the preview-before-apply gate,
#   3. the products list carries the quick-price button and the inline price
#      field,
#   4. and the code serving the site declares the four adjustment fields, so an
#      import carrying them is validated rather than refused. (That the 0044
#      migration RAN is proved by the deploy workflow's own migration step,
#      which fails the deploy if it cannot apply — not by anything here.)
#
# WHAT IT WRITES: nothing. Every request is an anonymous GET; the admin
# endpoints are probed only for their refusal, which is what proves they are
# both deployed and still closed.
name: 25 - Verify Live Quick Edit Pricing (read-only)

on:
  workflow_dispatch:
    inputs:
      apex:
        description: 'Main site origin'
        required: false
        default: 'https://levonis-iq.com'

concurrency: verify-live-quick-price

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APEX: ${{ github.event.inputs.apex || 'https://levonis-iq.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: The price-grid endpoints are deployed and still admin-only
        run: |
          set -euo pipefail
          fail=0
          refuse() { # path, what it is
            code=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 25 "$APEX$1" || echo 000)
            # 401/403 proves the route EXISTS and is closed; 404 would mean the
            # deploy never carried it, which is the failure this step is for.
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "  ok   $2 is deployed and refuses a stranger ($code)"
            else
              echo "  FAIL $2 answers $code: $(head -c 140 /tmp/body.json)"
              fail=1
            fi
          }
          refuse '/api/admin/products/does-not-exist/price-grid'    'the price grid'
          refuse '/api/admin/products/does-not-exist/price-history' 'the price history'
          exit $fail

      - name: The write endpoints are closed to a stranger too
        run: |
          set -euo pipefail
          fail=0
          write() { # method, path, what it is
            code=$(curl -s -o /tmp/w.json -w '%{http_code}' --max-time 25 \
                     -X "$1" -H 'Content-Type: application/json' -d '{}' "$APEX$2" || echo 000)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "  ok   $3 refuses a stranger ($code)"
            else
              echo "  FAIL $3 answers $code: $(head -c 140 /tmp/w.json)"
              fail=1
            fi
          }
          write PATCH '/api/admin/products/does-not-exist/price-grid'          'the dirty-cell save'
          write POST  '/api/admin/products/does-not-exist/price-grid/bulk'     'the bulk change'
          write POST  '/api/admin/products/does-not-exist/price-grid/copy'     'the price copy'
          write POST  '/api/admin/products/does-not-exist/price-grid/undo'     'the undo'
          write POST  '/api/admin/products/does-not-exist/price-grid/cost-change' 'the cost-change preview'
          # The traits write — an option's fulfilment route, stock and active
          # flag from the same drawer as its prices. It re-derives the
          # product's sale types, so a stranger reaching it would be able to
          # turn a pre-order product into a direct sale.
          write PATCH '/api/admin/products/does-not-exist/price-grid/traits'  'the traits save'
          exit $fail

      - name: Read every module the deployed app serves
        run: |
          set -euo pipefail
          bash scripts/live-modules.sh "$APEX" "/"

      - name: The shipped admin renders the Quick Edit drawer
        run: |
          set -euo pipefail
          fail=0
          # Only VALUES are grepped, never `attr="value"`: minification turns a
          # JSX prop into an object key, so the attribute form is absent from a
          # perfectly correct bundle.
          want() { # needle, what it is
            hit=$(grep -l "$1" /tmp/mods/* 2>/dev/null | head -1 || true)
            if [ -n "$hit" ]; then
              echo "  ok   $2 — in $(basename "$hit")"
            else
              echo "  FAIL $2 is not in any served module"; fail=1
            fi
          }
          want 'price-grid'      'the drawer talks to the price-grid endpoint'
          want 'quick-price'     'the products list carries the quick-price button'
          want 'inline-price'    'the list price is editable where it is read'
          want 'qp-mode-btn'     'every cell offers its three modes'
          want 'qp-profit'       'the profit is shown beside each row'
          want 'qp-guard'        'the profit guard has somewhere to speak'
          want 'bulk-preview'    'the bulk tab previews'
          want 'bulk-apply'      'and applies separately'
          want 'copy-preview'    'the copy tab previews'
          want 'price-history'   'the history tab is shipped'
          want 'PROFIT_GUARD'    'the drawer knows the guard refusal by code'
          # The traits controls, live in the same drawer as the prices.
          want 'price-grid/traits'  'the drawer writes availability, stock and active'
          want 'qp-availability'    'an option offers its fulfilment route'
          want 'qp-stock'           'stock is typed where the row is read'
          want 'qp-active'          'and an option can be switched off from here'
          want 'qp-traits'          'the traits row is rendered'
          # The global rules the owner asked to keep OUT of the product form.
          want 'shipping-policy'    'the admin can edit the global shipping rules'
          want 'preorder-gift'      'and the PRO pre-order gift rule'
          want 'protected-delivery' 'checkout offers protected shipping'
          want 'protectedDelivery'  'and sends the choice with the quote'
          exit $fail

      - name: The deployed template declares the adjustment fields
        run: |
          set -euo pipefail
          # WHAT THIS DOES NOT PROVE, said plainly: it does not read the live
          # database, so it is not evidence that migration 0044 ran. That
          # evidence is the deploy workflow's own step, "Apply any pending
          # migrations BEFORE the code that needs them", which runs
          # `wrangler d1 migrations apply --remote` and fails the deploy if it
          # cannot. What IS checked here is the other half — that the CODE now
          # serving the site declares the four fields, so an import file
          # carrying them is validated rather than rejected as unknown.
          fail=0
          code=$(curl -s -o /tmp/blank.txt -w '%{http_code}' --max-time 25 "$APEX/api/admin/template/blank" || echo 000)
          if [ "$code" = "200" ]; then
            for f in regular_adjust_iqd prime_adjust_iqd pro_adjust_iqd cost_adjust_iqd; do
              if grep -q "$f" /tmp/blank.txt; then
                echo "  ok   the served template declares $f"
              else
                echo "  FAIL the served template is missing $f"; fail=1
              fi
            done
          elif [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "  ok   the blank template is admin-gated ($code) — field coverage is proved by tests/importCsv.test.ts"
          else
            echo "  FAIL /api/admin/template/blank answers $code"; fail=1
          fi
          exit $fail

      - name: Summary
        if: always()
        run: echo "Quick Edit pricing verified against $APEX"
