name: 49 - Model fulfillment and pricing regression (no deployment)
on:
  push:
    branches: [codex/model-fulfillment-pricing]
  pull_request:
    branches: [Main]
    paths: ['packages/pricing/src/**', 'tests/fulfillment*.test.ts', 'worker/lib/fulfillment*.ts', 'migrations/0072_model_fulfillment.sql', '.github/workflows/verify-model-fulfillment.yml']
permissions:
  contents: read
concurrency:
  group: model-fulfillment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source without git credentials or runner environment
        run: git archive --format=tar.gz HEAD -o /tmp/fulfillment-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fulfillment-source-${{ github.run_id }}
          path: /tmp/fulfillment-source.tar.gz
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fulfillment regression tests
        shell: bash
        run: |
          mkdir -p /tmp/fulfillment-proof
          set +e
          node --import tsx --test tests/fulfillment*.test.ts > /tmp/fulfillment-proof/tests.log 2>&1
          result=$?
          cat /tmp/fulfillment-proof/tests.log
          exit "$result"
      - name: Shared pricing package types
        if: ${{ !cancelled() }}
        run: npm run check --workspace @levonis/pricing
      - name: Focused lint
        if: ${{ !cancelled() }}
        run: npx --no-install eslint packages/pricing/src/fulfillment*.ts worker/lib/fulfillment*.ts tests/fulfillment*.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fulfillment-proof-${{ github.run_id }}
          path: /tmp/fulfillment-proof/
          retention-days: 7
