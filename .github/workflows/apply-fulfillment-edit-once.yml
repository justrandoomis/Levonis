# Temporary integration transport, never merged to Main, never deploys.
name: 50 - Apply reviewed fulfillment integration to draft only
on:
  push:
    branches: [codex/model-fulfillment-pricing]
    paths: ['.github/fulfillment-edit.mjs']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/model-fulfillment-pricing' && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply exact-parent edits and save only to the same draft branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/fulfillment-edit.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve absent reservation fields and use supplied A1 membership fixture'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/model-fulfillment-pricing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run all fulfillment regressions
        run: node --import tsx --test tests/fulfillment*.test.ts
      - name: Types and lint
        if: ${{ !cancelled() }}
        run: |
          npm run check --workspace @levonis/pricing
          npx --no-install eslint packages/pricing/src/fulfillment*.ts tests/fulfillment*.test.ts
