name: 43 - Verify exact release browsers (read-only)

on:
  push:
    branches: [codex/live-release-20260913]
    paths: ['.github/workflows/verify-release-browser-once.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 48ecfeb1431e451c5494bc988708c2e569d9f42c
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser driver
        run: |
          npm install --prefix /tmp/levonis-browser --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/levonis-browser/node_modules/.bin/playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || { tail -50 /tmp/browser-install.log; exit 1; }
      - name: Test the actual release components in both browser engines
        env:
          PLAYWRIGHT_MODULE: /tmp/levonis-browser/node_modules/playwright
        shell: bash
        run: |
          mkdir -p /tmp/levonis-diagnostics
          git rev-parse HEAD > /tmp/levonis-diagnostics/commit.txt
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4175 > /tmp/levonis-diagnostics/vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/tests/browser/bloub.html > /dev/null; then break; fi
            sleep 1
          done
          set +e
          node scripts/e2e-bloub-continuation.mjs > /tmp/levonis-diagnostics/browser.log 2>&1
          result=$?
          tail -70 /tmp/levonis-diagnostics/browser.log
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-browser-${{ github.run_id }}
          path: /tmp/levonis-diagnostics/
          retention-days: 7
