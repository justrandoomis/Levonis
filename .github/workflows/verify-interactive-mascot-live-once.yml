# Temporary public browser proof, isolated from Main. Never creates live data.
name: 47 - Verify live interactive mascot (read-only)
on:
  push:
    branches: [codex/release-interactive-mascot]
    paths: ['.github/workflows/verify-interactive-mascot-live-once.yml', '.github/mascot-live-proof.cjs']
permissions:
  contents: read
  actions: read
concurrency:
  group: interactive-mascot-live-proof
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'justrandoomis/Levonis' && github.ref == 'refs/heads/codex/release-interactive-mascot'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser engines while the release gate finishes
        run: |
          npm install --prefix /tmp/levonis-browser --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/levonis-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Require successful deployment of the exact reviewed merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mascot-live-proof
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const base='https://api.github.com/repos/justrandoomis/Levonis',source='a33dea17bd8119273dd2166ec269620ab27ff04e',previous='6b373ded26a1606fd4a545f9cf42c7dc5769094d';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          async function get(path){const r=await fetch(base+path,{headers});if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}
          const reviewed=await get('/git/commits/'+source);
          let passed=false;
          for(let attempt=0;attempt<85;attempt++){
            const main=await get('/commits/Main');
            if(main.sha!==previous){
              if(main.commit.tree.sha!==reviewed.tree.sha||!main.parents.some(p=>p.sha===source))throw new Error('Unexpected Main source');
              const data=await get('/actions/runs?branch=Main&event=workflow_dispatch&per_page=10');
              const run=data.workflow_runs.find(r=>r.head_sha===main.sha&&r.path==='.github/workflows/deploy-staging-code.yml');
              if(run?.status==='completed'){
                if(run.conclusion!=='success')throw new Error('Live deployment failed');
                writeFileSync('/tmp/mascot-live-proof/deployment.json',JSON.stringify({run:run.id,sha:main.sha,source,result:run.conclusion,verifiedAt:new Date().toISOString()},null,2));
                passed=true;break;
              }
            }
            await new Promise(r=>setTimeout(r,20000));
          }
          if(!passed)throw new Error('Exact-source deployment not completed');
          JS
      - name: Anonymous mobile, tablet and desktop checks; block all mutations
        env:
          PLAYWRIGHT_MODULE: /tmp/levonis-browser/node_modules/playwright
        run: node .github/mascot-live-proof.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-interactive-mascot-proof
          path: /tmp/mascot-live-proof/
          retention-days: 7
