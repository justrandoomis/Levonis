# Merchant subdomains: check, then apply, the two pieces of Cloudflare
# configuration that make `ali3d.levonis-iq.com` reach the Worker.
#
# DEFAULT IS READ-ONLY. Without `confirm: APPLY` this changes nothing at all.
# The two things it can write are DNS on a live domain and a Worker route;
# both reach every visitor immediately if they are wrong.
#
# IT PROBES FROM OUTSIDE FIRST, with no token. `dig` and `curl` answer "do
# merchant subdomains work" directly, and they answer it even when the API
# token cannot read the zone. The API steps that follow explain WHY, and each
# one tolerates its own failure so a single missing permission cannot hide the
# rest of the report — the first version of this file stopped at the first
# 10000 and left the route half unknown.
#
# WHAT IT WRITES, WHEN CONFIRMED:
#
#   1. A PROXIED `CNAME *` in the zone. Existing records win over a wildcard,
#      so `studio` and `mail` keep resolving to their own targets — checked
#      before AND after, not assumed.
#   2. A Worker route `*.<domain>/*` bound to whichever Worker actually serves
#      the apex today. That Worker is looked up from the API rather than
#      hard-coded: the one serving levonis-iq.com is `levonis-staging` and no
#      Worker named `levonis` exists on the account (docs/DECISIONS.md row
#      52), so a name typed from memory would bind every merchant subdomain
#      to nothing.
#
# WHAT IT NEVER DOES: deploy code, run a migration, touch a database, a
# bucket, a secret, or any DNS record other than the wildcard.
#
# TOKEN PERMISSIONS. Beyond its Workers permissions the token needs
# Zone:DNS:Edit and Zone:Workers Routes:Edit on this zone. When one is
# missing the summary names it exactly, so the owner knows which checkbox to
# tick rather than being told "authentication error".
name: 10 - Merchant Subdomains (wildcard DNS + route)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to write the wildcard DNS record and route. Anything else = read-only report.'
        required: false
        default: ''
      domain:
        description: 'Zone to configure'
        required: false
        default: 'levonis-iq.com'

concurrency: cloudflare-wildcard

jobs:
  wildcard:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ github.event.inputs.domain || 'levonis-iq.com' }}
      APPLY: ${{ github.event.inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------ outside first
      # No token, no API. This is what a visitor's browser would find, and it
      # is the only evidence that actually matters.
      - name: What the internet sees right now
        id: outside
        continue-on-error: true
        run: |
          PROBE="probe-$GITHUB_RUN_ID.$DOMAIN"
          echo "apex     $(dig +short "$DOMAIN" | tr '\n' ' ')"
          echo "studio   $(dig +short "studio.$DOMAIN" | tr '\n' ' ')"
          echo "mail     $(dig +short "mail.$DOMAIN" | tr '\n' ' ')"
          RANDOM_ANS=$(dig +short "$PROBE" | tr '\n' ' ')
          echo "random   ${RANDOM_ANS:-(does not resolve)}"

          if [ -n "$RANDOM_ANS" ]; then
            echo "dns=resolving" >> "$GITHUB_OUTPUT"
          else
            echo "dns=missing" >> "$GITHUB_OUTPUT"
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://$PROBE/api/health" || echo 000)
          echo "an arbitrary subdomain reaching the Worker: $CODE"
          echo "worker=$CODE" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------- what the Worker holds
      # The §95 run saw the apex classify as `main` at 03:36 and `foreign` at
      # 03:40 with no deploy between, so the variable itself has to be read
      # rather than inferred from behaviour. VALUES ARE NEVER PRINTED — only
      # whether each one is present and whether it names this domain.
      - name: Does the Worker actually hold the root domain
        id: vars
        continue-on-error: true
        run: |
          echo "root=unknown" >> "$GITHUB_OUTPUT"
          echo "origin=unknown" >> "$GITHUB_OUTPUT"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/levonis-staging/settings" \
            -o /tmp/settings.json || true
          if ! jq -e '.success == true' /tmp/settings.json > /dev/null 2>&1; then
            echo "::warning::could not read the Worker settings"
            exit 0
          fi

          echo "plain-text vars on the Worker:"
          jq -r '[.result.bindings[] | select(.type=="plain_text") | .name] | sort | join(", ")' /tmp/settings.json

          ROOT=$(jq -r --arg n STORE_ROOT_DOMAIN \
            '.result.bindings[] | select(.type=="plain_text" and .name==$n) | .text // ""' /tmp/settings.json)
          ORIGIN=$(jq -r --arg n APP_ORIGIN \
            '.result.bindings[] | select(.type=="plain_text" and .name==$n) | .text // ""' /tmp/settings.json)
          [ -z "$ROOT" ] || echo "::add-mask::$ROOT"
          [ -z "$ORIGIN" ] || echo "::add-mask::$ORIGIN"

          if [ -z "$ROOT" ]; then
            echo "STORE_ROOT_DOMAIN: ABSENT"
            echo "root=absent" >> "$GITHUB_OUTPUT"
          elif [ "$ROOT" = "$DOMAIN" ]; then
            echo "STORE_ROOT_DOMAIN: present and equal to $DOMAIN"
            echo "root=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::STORE_ROOT_DOMAIN is set but is NOT $DOMAIN"
            echo "root=WRONG VALUE" >> "$GITHUB_OUTPUT"
          fi

          if echo "$ORIGIN" | grep -q "://$DOMAIN"; then
            echo "APP_ORIGIN: names $DOMAIN"
            echo "origin=ok" >> "$GITHUB_OUTPUT"
          else
            echo "APP_ORIGIN: does NOT name $DOMAIN"
            echo "origin=WRONG VALUE" >> "$GITHUB_OUTPUT"
          fi

          # Which version of the script is deployed, and when. A behaviour
          # change with no deploy of ours means somebody else's deploy, or a
          # rollout still in progress.
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/levonis-staging/deployments" \
            -o /tmp/dep.json || true
          # Sorted explicitly: the API's order is not guaranteed, and taking
          # the wrong end of the list is how the first attempt at this
          # reported three deployments from before the one being diagnosed.
          jq -r '[.result.deployments[]?] | sort_by(.created_on) | reverse | .[0:6][]
                 | "  \(.created_on)  \(.id[0:8])  by \(.author_email // "?")  source=\(.source // "?")"' \
            /tmp/dep.json 2>/dev/null || echo "  (deployment list unavailable)"

      # --------------------------------------------------------------- zone
      - name: Resolve the zone
        id: zone
        continue-on-error: true
        run: |
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" -o /tmp/zone.json || true
          if ! jq -e '.success == true' /tmp/zone.json > /dev/null 2>&1; then
            echo "::warning::cannot list zones — the token is missing Zone:Zone:Read on $DOMAIN"
            jq -r '.errors[]? | "  cloudflare: \(.code) \(.message)"' /tmp/zone.json 2>/dev/null || true
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ID=$(jq -r '.result[0].id // ""' /tmp/zone.json)
          if [ -z "$ID" ]; then
            echo "::warning::zone $DOMAIN is not on this account"
          else
            echo "::add-mask::$ID"
            echo "zone resolved"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------- DNS
      - name: Read the DNS records
        id: dns
        continue-on-error: true
        env:
          ZONE: ${{ steps.zone.outputs.id }}
        run: |
          echo "existing=unknown" >> "$GITHUB_OUTPUT"
          echo "perm=unknown" >> "$GITHUB_OUTPUT"
          [ -n "$ZONE" ] || { echo "no zone id — skipping"; exit 0; }

          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?per_page=200" -o /tmp/dns.json || true
          if ! jq -e '.success == true' /tmp/dns.json > /dev/null 2>&1; then
            echo "::warning::cannot read DNS — the token is missing Zone:DNS:Read on $DOMAIN"
            jq -r '.errors[]? | "  cloudflare: \(.code) \(.message)"' /tmp/dns.json 2>/dev/null || true
            echo "perm=MISSING Zone:DNS:Read" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "perm=ok" >> "$GITHUB_OUTPUT"

          echo "Records that must keep winning over the wildcard:"
          jq -r --arg d "$DOMAIN" '
            .result[]
            | select(.name == "studio." + $d or .name == "mail." + $d or .name == $d or .name == "www." + $d)
            | "  \(.type)  \(.name)  proxied=\(.proxied)"' /tmp/dns.json

          WILD=$(jq -r --arg d "$DOMAIN" '.result[] | select(.name == "*." + $d) | .id' /tmp/dns.json | head -1)
          if [ -n "$WILD" ]; then
            echo "::add-mask::$WILD"
            echo "wildcard_id=$WILD" >> "$GITHUB_OUTPUT"
            echo "existing=$(jq -r --arg d "$DOMAIN" '.result[] | select(.name == "*." + $d) | "\(.type) -> \(.content) proxied=\(.proxied)"' /tmp/dns.json | head -1)" >> "$GITHUB_OUTPUT"
            echo "a wildcard record already exists"
          else
            echo "existing=none" >> "$GITHUB_OUTPUT"
            echo "NO wildcard record — merchant subdomains do not resolve yet"
          fi

      - name: Create or correct the wildcard record
        id: dnswrite
        if: ${{ github.event.inputs.confirm == 'APPLY' }}
        continue-on-error: true
        env:
          ZONE: ${{ steps.zone.outputs.id }}
          WILD_ID: ${{ steps.dns.outputs.wildcard_id }}
        run: |
          echo "result=skipped" >> "$GITHUB_OUTPUT"
          [ -n "$ZONE" ] || { echo "::warning::no zone id — cannot write DNS"; exit 0; }

          BODY=$(jq -nc --arg d "$DOMAIN" \
            '{type:"CNAME", name:"*", content:$d, proxied:true, ttl:1,
              comment:"merchant storefronts — one wildcard, no per-store record"}')

          if [ -n "$WILD_ID" ]; then
            curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$WILD_ID" \
              --data "$BODY" -o /tmp/put.json || true
          else
            curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              --data "$BODY" -o /tmp/put.json || true
          fi

          if ! jq -e '.success == true' /tmp/put.json > /dev/null 2>&1; then
            echo "::warning::could not write the wildcard record — the token is missing Zone:DNS:Edit on $DOMAIN"
            jq -r '.errors[]? | "  cloudflare: \(.code) \(.message)"' /tmp/put.json 2>/dev/null || true
            echo "result=BLOCKED (needs Zone:DNS:Edit)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=written" >> "$GITHUB_OUTPUT"
          echo "wildcard CNAME * -> $DOMAIN, proxied"

      # ------------------------------------------------------------- routes
      - name: Which Worker serves the apex
        id: worker
        continue-on-error: true
        run: |
          echo "name=" >> "$GITHUB_OUTPUT"
          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/domains?hostname=$DOMAIN" \
            -o /tmp/domains.json || true
          if ! jq -e '.success == true' /tmp/domains.json > /dev/null 2>&1; then
            echo "::warning::cannot list Worker custom domains"
            jq -r '.errors[]? | "  cloudflare: \(.code) \(.message)"' /tmp/domains.json 2>/dev/null || true
            exit 0
          fi
          NAME=$(jq -r '.result[0].service // ""' /tmp/domains.json)
          if [ -z "$NAME" ]; then
            echo "::warning::no Worker custom domain is bound to $DOMAIN — nothing to bind the wildcard to"
          else
            echo "the apex is served by the Worker: $NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Read the Worker routes
        id: routes
        continue-on-error: true
        env:
          ZONE: ${{ steps.zone.outputs.id }}
        run: |
          echo "bound_to=unknown" >> "$GITHUB_OUTPUT"
          echo "perm=unknown" >> "$GITHUB_OUTPUT"
          [ -n "$ZONE" ] || { echo "no zone id — skipping"; exit 0; }

          curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" -o /tmp/routes.json || true
          if ! jq -e '.success == true' /tmp/routes.json > /dev/null 2>&1; then
            echo "::warning::cannot read Worker routes — the token is missing Zone:Workers Routes:Read on $DOMAIN"
            jq -r '.errors[]? | "  cloudflare: \(.code) \(.message)"' /tmp/routes.json 2>/dev/null || true
            echo "perm=MISSING Zone:Workers Routes:Read" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "perm=ok" >> "$GITHUB_OUTPUT"

          echo "routes on this zone:"
          jq -r '.result[] | "  \(.pattern) -> \(.script // "(none)")"' /tmp/routes.json

          PATTERN="*.$DOMAIN/*"
          EXISTING=$(jq -r --arg p "$PATTERN" '.result[] | select(.pattern == $p) | .id' /tmp/routes.json | head -1)
          if [ -n "$EXISTING" ]; then
            echo "::add-mask::$EXISTING"
            echo "route_id=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "bound_to=$(jq -r --arg p "$PATTERN" '.result[] | select(.pattern == $p) | .script' /tmp/routes.json | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "bound_to=none" >> "$GITHUB_OUTPUT"
            echo "NO wildcard route — merchant subdomains would reach Cloudflare and not the Worker"
          fi

      - name: Bind the wildcard route to that Worker
        id: routewrite
        if: ${{ github.event.inputs.confirm == 'APPLY' }}
        continue-on-error: true
        env:
          ZONE: ${{ steps.zone.outputs.id }}
          ROUTE_ID: ${{ steps.routes.outputs.route_id }}
          SCRIPT: ${{ steps.worker.outputs.name }}
        run: |
          echo "result=skipped" >> "$GITHUB_OUTPUT"
          if [ -z "$ZONE" ] || [ -z "$SCRIPT" ]; then
            echo "::warning::no zone id or no Worker on the apex — cannot bind the route"
            exit 0
          fi

          BODY=$(jq -nc --arg p "*.$DOMAIN/*" --arg s "$SCRIPT" '{pattern:$p, script:$s}')
          if [ -n "$ROUTE_ID" ]; then
            curl -sS -X PUT -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes/$ROUTE_ID" \
              --data "$BODY" -o /tmp/route.json || true
          else
            curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE/workers/routes" \
              --data "$BODY" -o /tmp/route.json || true
          fi
          if ! jq -e '.success == true' /tmp/route.json > /dev/null 2>&1; then
            echo "::warning::could not write the route — the token is missing Zone:Workers Routes:Edit on $DOMAIN"
            jq -r '.errors[]? | "  cloudflare: \(.code) \(.message)"' /tmp/route.json 2>/dev/null || true
            echo "result=BLOCKED (needs Zone:Workers Routes:Edit)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=written" >> "$GITHUB_OUTPUT"
          echo "route *.$DOMAIN/* -> $SCRIPT"

      # ------------------------------------------------------------- proof
      # An API call being accepted is not evidence. This is.
      - name: Prove it from outside
        id: proof
        continue-on-error: true
        run: |
          PROBE="probe2-$GITHUB_RUN_ID.$DOMAIN"
          echo "--- system hosts must NOT be captured by the wildcard"
          for h in studio mail; do
            printf '  %s.%s -> %s\n' "$h" "$DOMAIN" "$(dig +short "$h.$DOMAIN" | tr '\n' ' ')"
          done

          echo "--- an arbitrary subdomain"
          printf '  %s -> %s\n' "$PROBE" "$(dig +short "$PROBE" | tr '\n' ' ')"

          curl -s -o /dev/null -w '  apex /api/health: %{http_code}\n' --max-time 25 "https://$DOMAIN/api/health" || true
          curl -s -o /dev/null -w '  studio:           %{http_code}\n' --max-time 25 "https://studio.$DOMAIN/" || true

          echo
          echo "--- what is actually answering on a merchant host"
          # A status code alone cannot tell a Worker apart from a redirect
          # rule sitting in front of one. The response headers can.
          curl -sSI --max-time 25 "https://$PROBE/api/health" 2>&1 \
            | grep -iE '^(HTTP/|location|server|cf-ray|cf-cache-status|content-type):' \
            | sed 's/^/  /' || true

          echo
          echo "--- THE ONE THAT MATTERS: platform admin refused off the apex"
          curl -sSI --max-time 25 "https://$PROBE/api/admin/community/overview" 2>&1 \
            | grep -iE '^(HTTP/|location|server):' | sed 's/^/  /' || true
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            "https://$PROBE/api/admin/community/overview" || echo 000)
          echo "  /api/admin/community/overview on a merchant host: $CODE"
          echo "admin_code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            200|401|403)
              echo "::error::the apex-only admin guard is NOT in effect on this host"
              exit 1;;
            404)
              echo "  refused as expected — the route does not exist on this host";;
            000)
              echo "  the host does not resolve yet, so there is nothing to reach";;
            30*)
              # Something in front of the Worker is redirecting. Follow it: if
              # it lands on the apex, the admin API is being reached under the
              # apex's own hostname, which is fine — but it also means merchant
              # subdomains are not served by the Worker at all yet.
              echo "  a redirect is intercepting this host. Following it:"
              curl -sSL -o /dev/null --max-time 25 \
                -w '    final url: %{url_effective}\n    final code: %{http_code}\n' \
                "https://$PROBE/api/admin/community/overview" || true
              echo "  UNPROVEN: the Worker is not answering on merchant hosts"
              ;;
            *)
              echo "  unexpected status; treat as unproven";;
          esac

      - name: Say plainly what happened
        if: always()
        run: |
          {
            if [ "$APPLY" = "APPLY" ]; then echo "### Apply requested"; else
              echo "### Read-only report — nothing was changed"
              echo ""
              echo "Re-run with \`confirm: APPLY\` to write the wildcard record and route."
            fi
            echo ""
            echo "| Item | State |"
            echo "|---|---|"
            echo "| STORE_ROOT_DOMAIN on the Worker | ${{ steps.vars.outputs.root }} |"
            echo "| APP_ORIGIN names this domain | ${{ steps.vars.outputs.origin }} |"
            echo "| An arbitrary subdomain resolves | ${{ steps.outside.outputs.dns }} |"
            echo "| …and reaches the Worker (HTTP) | ${{ steps.outside.outputs.worker }} |"
            echo "| DNS API access | ${{ steps.dns.outputs.perm }} |"
            echo "| Wildcard DNS record | ${{ steps.dns.outputs.existing }} |"
            echo "| Wildcard DNS write | ${{ steps.dnswrite.outputs.result || 'not attempted' }} |"
            echo "| Worker serving the apex | ${{ steps.worker.outputs.name || 'unknown' }} |"
            echo "| Routes API access | ${{ steps.routes.outputs.perm }} |"
            echo "| Wildcard route | ${{ steps.routes.outputs.bound_to }} |"
            echo "| Wildcard route write | ${{ steps.routewrite.outputs.result || 'not attempted' }} |"
            echo "| /api/admin/* on a merchant host | ${{ steps.proof.outputs.admin_code || 'not measured' }} (404 is correct) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The job's own verdict, after the report rather than instead of it.
      - name: Fail if the admin guard did not hold
        if: ${{ steps.proof.outcome == 'failure' }}
        run: |
          echo "::error::see the proof step — a merchant host could reach /api/admin/*"
          exit 1
