name: 0 - Diagnose Live Site (read-only)
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host (diagnostic reads configured owner and roles only)
        required: false
        default: levonis-iq.com
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read owner configuration and account matches (no identities printed)
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/levonis-staging/settings',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          const settings=await response.json();
          if(!response.ok||!settings.success)throw new Error('Cannot read live worker settings');
          const binding=settings.result.bindings.find(b=>b.name==='INITIAL_ADMIN_EMAIL');
          const owner=binding?.type==='plain_text'?String(binding.text??'').trim().toLowerCase():'';
          const literal=v=>"'"+v.replaceAll("'","''")+"'";
          const sql="SELECT COUNT(*) AS admin_count,SUM(CASE WHEN lower(trim(email))="+literal(owner)+" THEN 1 ELSE 0 END) AS configured_owner_admin_matches,SUM(CASE WHEN lower(username)='just.randoomis' THEN 1 ELSE 0 END) AS signed_in_admin_matches,SUM(CASE WHEN lower(username)='just.randoomis' AND lower(trim(email))="+literal(owner)+" THEN 1 ELSE 0 END) AS signed_in_is_configured_owner FROM users WHERE role='admin'";
          const result=spawnSync('npx',['wrangler','d1','execute','levonis-db-staging','--remote','--json','--command',sql],{encoding:'utf8'});
          if(result.status!==0)throw new Error('Read-only D1 diagnostic failed');
          const parsed=JSON.parse(result.stdout);
          console.log(JSON.stringify({owner_binding_present:!!binding,owner_binding_type:binding?.type??null,owner_value_present:!!owner,...parsed[0].results[0]}));
          JS
