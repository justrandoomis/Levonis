name: 0 - Diagnose Live Site (read-only)
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to probe (unused; verification uses the configured database)
        required: false
        default: levonis-iq.com
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify actual participant response (SELECT only, no names or amounts)
        run: |
          node --import tsx --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { participantOverview } from './worker/lib/financeParticipants.ts';
          function literal(v) {
            if(v == null) return 'NULL';
            if(typeof v === 'number' && Number.isFinite(v)) return String(v);
            if(typeof v === 'string') return "'" + v.replaceAll("'", "''") + "'";
            throw new Error('Unsupported read parameter');
          }
          function rows(sql, values=[]) {
            if(!/^\s*SELECT\b/i.test(sql)) throw new Error('Only SELECT is allowed');
            let next=0;const used=new Set();
            const command=sql.replace(/\?(\d*)/g,(_match,index)=>{const i=index?Number(index)-1:next++;used.add(i);return literal(values[i]);});
            if(used.size!==values.length||[...used].some(i=>i<0||i>=values.length)) throw new Error('Parameter mismatch');
            const result=spawnSync(process.execPath,['node_modules/wrangler/bin/wrangler.js','d1','execute','levonis-db-staging','--remote','--json','--command',command],{encoding:'utf8',maxBuffer:8*1024*1024});
            if(result.status!==0) throw new Error('Read-only database query failed; no account data printed');
            const payload=JSON.parse(result.stdout);
            if(payload.length!==1||payload[0].success!==true)throw new Error('Read-only query did not succeed');
            return payload[0].results;
          }
          const db={prepare(sql){
            let values=[];
            const statement={bind(...next){values=next;return statement;},async all(){return {results:rows(sql,values)};},async first(){return rows(sql,values)[0]??null;}};
            return statement;
          }};
          const users=rows("SELECT user_id FROM finance_staff WHERE user_id IS NOT NULL UNION SELECT user_id FROM investment_profiles ORDER BY user_id");
          const summaries=[];
          for(const user of users){
            const data=await participantOverview(db,user.user_id),s=data.summary;
            summaries.push({
              linked_employment_records:data.employment.length,
              calculation_states:data.employment.map(e=>e.reconciliation_state),
              has_work_earnings:s.staff_iqd>0,
              has_available_earnings:s.earnings_available_iqd>0,
              has_available_staff_source:data.entries.some(e=>e.kind==='staff'&&e.available_iqd>0),
              has_paid_earnings:s.earnings_paid_iqd>0,
              has_reserved_earnings:s.earnings_held_iqd>0,
              has_advance_balance:s.advance_balance_iqd>0,
              has_settlement_debt:s.debt_iqd>0,
              pending_costs:s.pending_costs,
              reconciliation_pending:s.reconciliation_pending,
              summary_numbers_finite:Object.values(s).every(v=>typeof v!=='number'||Number.isFinite(v))
            });
          }
          const pending=rows("SELECT c.state,json_extract(c.snapshot,'$.rule.basis') AS basis,\n    s.active,s.archived_at IS NOT NULL AS archived,s.start_work_date IS NOT NULL AS has_start,\n    o.status AS order_state,\n    COALESCE(o.status='delivered' AND date(o.delivered_at,'+3 hours')>s.start_work_date,0) AS date_eligible,\n    COUNT(*) AS source_count\n  FROM finance_order_costs c JOIN finance_staff s ON s.id=c.staff_id JOIN orders o ON o.id=c.order_id\n  WHERE s.user_id IS NOT NULL AND c.state='pending_cost'\n  GROUP BY c.state,basis,s.active,archived,has_start,order_state,date_eligible");
          const integrity=rows(`SELECT
            (SELECT COUNT(*) FROM finance_wage_periods WHERE ends_before IS NOT NULL AND ends_before<=starts_on) AS invalid_wage_intervals,
            (SELECT COUNT(*) FROM finance_cost_rules r WHERE r.staff_id IS NOT NULL AND NOT EXISTS(SELECT 1 FROM finance_wage_versions v WHERE v.rule_id=r.id)) AS staff_rules_without_history,
            (SELECT COUNT(*) FROM finance_wage_targets t JOIN finance_order_costs c ON c.id=t.cost_id JOIN finance_wage_versions v ON v.id=t.wage_version_id WHERE v.staff_id<>c.staff_id) AS mismatched_wage_staff,
            (SELECT COUNT(*) FROM purchase_investor_agreements a WHERE a.allocated_iqd<>(SELECT COALESCE(SUM(principal_iqd),0) FROM purchase_investor_allocations x WHERE x.purchase_id=a.purchase_id)) AS unbalanced_funding_allocations,
            (SELECT COUNT(*) FROM purchase_investor_lot_capital p JOIN inventory_lots l ON l.id=p.lot_id JOIN investment_contracts c ON c.id=p.contract_id WHERE c.incoming_id<>l.incoming_id) AS mismatched_capital_lots`)[0];
          const review=rows(`SELECT
            (SELECT COUNT(*) FROM finance_staff_reconciliations WHERE state='failed') AS failed_reconciliations,
            (SELECT COUNT(*) FROM finance_withdrawal_payments p WHERE p.amount_iqd<>(SELECT COALESCE(SUM(amount_iqd),0) FROM finance_withdrawal_payment_lines l WHERE l.payment_id=p.id)) AS historical_payment_allocations_to_review,
            (SELECT COUNT(*) FROM investments i WHERE NOT EXISTS(SELECT 1 FROM investment_legacy_links l WHERE l.legacy_investment_id=i.id)) AS unreviewed_legacy_investments`)[0];
          console.log(JSON.stringify({participant_response_checks:summaries,pending_source_checks:pending,integrity,review},null,2));
          if(Object.values(integrity).some(v=>v!==0)||summaries.some(s=>!s.summary_numbers_finite))throw new Error('Financial release integrity check failed');
          JS
