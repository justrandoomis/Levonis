name: 0 - Diagnose Live Site (read-only)
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to probe (unused; verification uses the configured database)
        required: false
        default: levonis-iq.com
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify actual participant response (SELECT only, no names or amounts)
        run: |
          node --import tsx --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { participantOverview } from './worker/lib/financeParticipants.ts';
          function literal(v) {
            if(v == null) return 'NULL';
            if(typeof v === 'number' && Number.isFinite(v)) return String(v);
            if(typeof v === 'string') return "'" + v.replaceAll("'", "''") + "'";
            throw new Error('Unsupported read parameter');
          }
          function rows(sql, values=[]) {
            if(!/^\s*SELECT\b/i.test(sql)) throw new Error('Only SELECT is allowed');
            let n=0;
            const command=sql.replace(/\?/g,()=>literal(values[n++]));
            if(n!==values.length) throw new Error('Parameter mismatch');
            const result=spawnSync(process.execPath,['node_modules/wrangler/bin/wrangler.js','d1','execute','levonis-db-staging','--remote','--json','--command',command],{encoding:'utf8',maxBuffer:8*1024*1024});
            if(result.status!==0) throw new Error('Read-only database query failed; no account data printed');
            const payload=JSON.parse(result.stdout);
            if(payload.length!==1||payload[0].success!==true)throw new Error('Read-only query did not succeed');
            return payload[0].results;
          }
          const db={prepare(sql){
            let values=[];
            const statement={bind(...next){values=next;return statement;},async all(){return {results:rows(sql,values)};},async first(){return rows(sql,values)[0]??null;}};
            return statement;
          }};
          const users=rows("SELECT DISTINCT user_id FROM finance_staff WHERE user_id IS NOT NULL AND archived_at IS NULL ORDER BY user_id");
          const summaries=[];
          for(const user of users){
            const data=await participantOverview(db,user.user_id),s=data.summary;
            summaries.push({
              linked_employment_records:data.employment.length,
              calculation_states:data.employment.map(e=>e.reconciliation_state),
              has_work_earnings:s.staff_iqd>0,
              has_available_earnings:s.earnings_available_iqd>0,
              has_available_staff_source:data.entries.some(e=>e.kind==='staff'&&e.available_iqd>0),
              has_paid_earnings:s.earnings_paid_iqd>0,
              has_reserved_earnings:s.earnings_held_iqd>0,
              has_advance_balance:s.advance_balance_iqd>0,
              has_settlement_debt:s.debt_iqd>0,
              pending_costs:s.pending_costs,
              reconciliation_pending:s.reconciliation_pending,
              summary_numbers_finite:Object.values(s).every(v=>typeof v!=='number'||Number.isFinite(v))
            });
          }
          console.log(JSON.stringify({participant_response_checks:summaries},null,2));
          JS
