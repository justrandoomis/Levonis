name: 0 - Diagnose Live Site (read-only)
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to probe (unused; verification uses the configured database)
        required: false
        default: levonis-iq.com
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare read-only queries from the candidate eligibility predicate
        run: |
          node --import tsx --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { staffReconciliationBlockedSql, effectiveStaffCostSql, staffPaidSql, heldSourceSql } from './worker/lib/financeParticipants.ts';
          const ready = `c.state IN ('due','approved') AND ${effectiveStaffCostSql()}-${staffPaidSql()}-${heldSourceSql("'staff'","c.id")}>0 AND NOT ${staffReconciliationBlockedSql()}`;
          writeFileSync('/tmp/staff-verification.sql', `
            SELECT s.active,s.archived_at IS NOT NULL AS archived,s.start_work_date IS NOT NULL AS has_start,
              j.state AS calculation_state,
              EXISTS(SELECT 1 FROM finance_order_costs c WHERE c.staff_id=s.id AND ${ready}) AS has_ready_wage_source,
              EXISTS(SELECT 1 FROM finance_order_costs c JOIN finance_posting_errors p ON p.order_id=c.order_id WHERE c.staff_id=s.id AND p.event_key='cogs:'||c.order_id AND ${ready}) AS ready_despite_inventory_warning,
              EXISTS(SELECT 1 FROM orders o WHERE o.seller_type='levonis' AND o.status='delivered' AND date(o.delivered_at,'+3 hours')>s.start_work_date) AS has_deliveries_after_start
            FROM finance_staff s LEFT JOIN finance_staff_reconciliations j ON j.staff_id=s.id ORDER BY s.id;
            SELECT substr(p.event_key,1,instr(p.event_key,':')-1) AS warning_type,
              json_extract(c.snapshot,'$.rule.basis') AS pay_basis,COUNT(*) AS affected_sources
            FROM finance_order_costs c JOIN finance_posting_errors p ON p.order_id=c.order_id
            WHERE c.staff_id IS NOT NULL GROUP BY warning_type,pay_basis;
            SELECT c.state,json_extract(c.snapshot,'$.rule.basis') AS basis,
              c.amount_iqd IS NULL AS amount_pending,
              COALESCE(c.amount_iqd,0)+COALESCE((SELECT SUM(delta_iqd) FROM finance_cost_adjustments x WHERE x.cost_id=c.id),0)>0 AS effective_positive,
              c.order_item_id IS NOT NULL AS per_line,
              json_extract(c.snapshot,'$.fifo_cogs_iqd') IS NOT NULL AS frozen_cost_known,
              EXISTS(SELECT 1 FROM order_items i WHERE i.id=c.order_item_id
                AND (SELECT COALESCE(SUM(a.qty),0) FROM order_item_inventory_allocations a WHERE a.order_item_id=i.id AND a.released_at IS NULL)>=i.qty
                AND EXISTS(SELECT 1 FROM order_item_inventory_allocations a WHERE a.order_item_id=i.id AND a.released_at IS NULL)
                AND NOT EXISTS(SELECT 1 FROM order_item_inventory_allocations a WHERE a.order_item_id=i.id AND a.released_at IS NULL AND a.cogs_iqd IS NULL)) AS current_fifo_known,
              EXISTS(SELECT 1 FROM finance_order_adjustments x WHERE x.order_id=c.order_id AND x.field='cogs_iqd' AND (x.order_item_id=c.order_item_id OR x.order_item_id IS NULL)) AS manually_verified_cost,
              EXISTS(SELECT 1 FROM finance_payment_allocations x WHERE x.cost_id=c.id) AS has_payment,
              EXISTS(SELECT 1 FROM finance_withdrawal_allocations x WHERE x.source_kind='staff' AND x.source_id=c.id) AS has_withdrawal
            FROM finance_order_costs c JOIN finance_posting_errors p ON p.order_id=c.order_id
            WHERE c.staff_id IS NOT NULL ORDER BY c.id;`);
          JS
      - name: Verify live accrual without displaying names or amounts (SELECT only)
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync(process.execPath, ['node_modules/wrangler/bin/wrangler.js', 'd1', 'execute', 'levonis-db-staging', '--remote', '--json', '--command', readFileSync('/tmp/staff-verification.sql', 'utf8')], { encoding: 'utf8' });
          if (result.status !== 0) { console.error(result.stderr || result.stdout); process.exit(result.status || 1); }
          console.log(JSON.stringify(JSON.parse(result.stdout).map((query) => query.results), null, 2));
          JS
