name: 0 - Diagnose Live Site (read-only)
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to probe (unused; diagnostics use the configured database)
        required: false
        default: levonis-iq.com
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Anonymized staff accrual health (SELECT only)
        run: |
          npx wrangler d1 execute levonis-db-staging --remote --json --command "
          SELECT
            s.start_work_date IS NOT NULL AS has_start,
            s.active,
            s.archived_at IS NOT NULL AS archived,
            s.user_id IS NOT NULL AS linked,
            j.state,
            j.revision=s.employment_version AS current_revision,
            j.processed_orders>0 AS has_progress,
            j.adjusted_orders>0 AS has_adjustments,
            j.updated_at,
            CASE WHEN j.error='' THEN ''
              WHEN j.error LIKE '%too many%' THEN 'resource-limit'
              WHEN j.error LIKE '%SQLITE_ERROR%' OR j.error LIKE '%no such%' THEN 'sql-error'
              WHEN j.error LIKE '%CHECK constraint%' THEN 'concurrent-write'
              WHEN j.error LIKE '%UNIQUE%' THEN 'duplicate'
              WHEN j.error LIKE '%FOREIGN KEY%' THEN 'foreign-key'
              WHEN j.error LIKE '%الفترة%' OR j.error LIKE '%مغلق%' THEN 'period-closed'
              WHEN j.error LIKE '%المستثمر%' THEN 'investor-pending'
              WHEN j.error LIKE '%FIFO%' THEN 'fifo-pending'
              WHEN j.error LIKE '%سحب%' THEN 'held-withdrawal'
              ELSE 'other' END AS failure,
            EXISTS(SELECT 1 FROM finance_cost_rules r WHERE r.staff_id=s.id AND r.active=1) AS has_rules,
            EXISTS(SELECT 1 FROM finance_cost_rules r WHERE r.staff_id=s.id AND r.active=1 AND r.employment_effective_default=1) AS has_inherited_rule_date,
            EXISTS(SELECT 1 FROM orders o WHERE o.seller_type='levonis' AND o.status='delivered' AND date(o.delivered_at,'+3 hours')>s.start_work_date) AS has_eligible_orders,
            EXISTS(SELECT 1 FROM finance_order_costs c WHERE c.staff_id=s.id AND c.amount_iqd>0 AND c.state IN ('due','approved')) AS has_earnings,
            EXISTS(SELECT 1 FROM finance_order_costs c JOIN finance_posting_errors pe ON pe.order_id=c.order_id WHERE c.staff_id=s.id) AS has_posting_errors
          FROM finance_staff s LEFT JOIN finance_staff_reconciliations j ON j.staff_id=s.id ORDER BY s.id;" | jq '.[0].results'
          npx wrangler d1 execute levonis-db-staging --remote --json --command "
          SELECT state,COUNT(*) AS jobs FROM finance_staff_reconciliations GROUP BY state;
          SELECT status,COUNT(*) AS orders, SUM(delivered_at IS NULL OR delivered_at='') AS missing_delivery_time FROM orders WHERE seller_type='levonis' GROUP BY status;
          SELECT CASE WHEN message LIKE '%too many%' THEN 'resource-limit'
            WHEN message LIKE '%CHECK constraint%' THEN 'concurrent-write'
            WHEN message LIKE '%المستثمر%' THEN 'investor-pending'
            WHEN message LIKE '%FIFO%' THEN 'fifo-pending'
            WHEN message LIKE '%مغلق%' THEN 'period-closed'
            ELSE 'other' END AS failure,COUNT(*) AS errors FROM finance_posting_errors GROUP BY failure;
          " | jq '[.[].results]'
