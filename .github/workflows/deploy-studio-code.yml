# ---------------------------------------------------------------------------
# WHICH WORKER SERVES WHOM (read this before running any deploy)
#
#   levonis-iq.com         -> Worker  levonis-staging          [LIVE]
#   studio.levonis-iq.com  -> Worker  levonis-studio-staging   [LIVE]
#   *.levonis-iq.com       -> Worker  levonis-staging          [LIVE]
#   Worker  levonis-studio  -> workers.dev only, NO domain     [alternate]
#   Worker  levonis         -> does not exist on the account
#
# Established from Cloudflare's own configuration, not from behaviour:
# custom domains, zone routes and the live Worker's bindings, read by
# `12 - Audit Studio Migrations and Routing` (runs 33380828524, 33382596554).
# The "-staging" names are historical. They are the production Workers.
# Full table: docs/WORKERS.md
# ---------------------------------------------------------------------------
# Deploys the CODE to the levonis-studio-staging worker — the one serving
# studio.levonis-iq.com — carrying its existing configuration forward.
#
# WHY NOT "4 - Deploy Studio Staging": that workflow's second pass re-sets
# APP_ORIGIN and MAIN_SITE_ORIGIN from repository secrets. Per DECISIONS row
# 30 those secrets are optional and may not be set, and `wrangler deploy`
# replaces a Worker's plain-text vars WHOLESALE — so deploying with them empty
# would blank the origins the sign-in handoff between the store and the Studio
# depends on, and break Studio login on a Worker that is currently working.
#
# This reads the Worker's current vars from the Cloudflare API first, refuses
# to deploy at all if that read fails, passes every one of them straight back,
# and afterwards asserts none were dropped. Values are masked; only names are
# logged.
#
# Two exceptions to "carry forward only", both opt-in and both no-ops unless
# the owner sets the matching repository secret: the sign-in origins
# (APP_ORIGIN, MAIN_SITE_ORIGIN) can be SET here, because carrying vars
# forward can never introduce a var the worker has never had; and the shared
# handoff secret is uploaded after the deploy. A deploy never reads or
# rewrites any other secret — those live in a separate store and survive it.
name: 8 - Deploy LIVE Studio levonis-studio-staging (keeps vars)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-STUDIO-CODE to confirm'
        required: true
        default: ''

concurrency: studio-staging-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the confirmation
        working-directory: .
        run: |
          [ "${{ github.event.inputs.confirm }}" = "DEPLOY-STUDIO-CODE" ] \
            || { echo "::error::type DEPLOY-STUDIO-CODE to confirm"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Studio is its own npm workspace, but tests/auth-handoff.test.mjs
      # imports `hono`, which is a dependency of the ROOT workspace. Locally
      # that resolves because Node walks up into the repo's node_modules; with
      # only studio/ installed it does not, and the suite fails on a missing
      # package rather than on anything real.
      - name: Install the root workspace (the Studio tests import from it)
        working-directory: .
        run: npm ci --no-audit --no-fund

      - run: npm ci --no-audit --no-fund

      - name: Read the running Worker's plain-text vars
        id: vars
        run: |
          set -e
          curl -sS -f \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-studio-staging/settings" \
            -o /tmp/settings.json
          jq -e '.success == true' /tmp/settings.json > /dev/null \
            || { echo "::error::could not read the worker settings — refusing to deploy and wipe its vars"; exit 1; }
          echo "vars currently set on the worker:"
          jq -r '[.result.bindings[] | select(.type == "plain_text") | .name] | sort | join(", ")' /tmp/settings.json
          jq -r '.result.bindings[] | select(.type == "plain_text") | "\(.name)\t\(.text)"' /tmp/settings.json \
            > /tmp/vars.tsv
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] || continue
            echo "::add-mask::$value"
          done < /tmp/vars.tsv
          echo "count=$(wc -l < /tmp/vars.tsv)" >> "$GITHUB_OUTPUT"

      - name: Resolve the Studio staging database id
        id: db
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="levonis-studio-db-staging") | .uuid')
          [ -n "$ID" ] || { echo "::error::levonis-studio-db-staging not found"; exit 1; }
          echo "::add-mask::$ID"
          echo "studio_db_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Fill it in
        env:
          STUDIO_STAGING_DB_ID: ${{ steps.db.outputs.studio_db_id }}
          CLOUDFLARE_ENV: staging
        run: node scripts/set-deploy-ids.mjs

      - name: Build and run the Studio test suite
        env:
          CLOUDFLARE_ENV: staging
        run: |
          npm run build
          node --test tests/*.test.mjs

      # This worker is the one behind studio.levonis-iq.com, so its own
      # trusted origin is the custom domain — NOT the workers.dev URL that
      # workflow 4 writes. Both vars are read by studio/worker/auth/session.ts
      # (MAIN_SITE_ORIGIN, for the server-to-server code exchange) and
      # studio/worker/index.ts (APP_ORIGIN, for return-URL validation and
      # cookies). Carrying vars forward could never introduce them; these two
      # repository secrets can. Unset leaves the worker exactly as it is.
      - name: Let the owner set the Studio sign-in origins
        env:
          STUDIO_APP_ORIGIN: ${{ secrets.STUDIO_PROD_APP_ORIGIN }}
          STUDIO_MAIN_SITE_ORIGIN: ${{ secrets.STUDIO_PROD_MAIN_SITE_ORIGIN }}
        run: |
          set -e
          set_var() {
            [ -n "$2" ] || { echo "$1 not set — leaving it as it is"; return 0; }
            grep -v "^$1	" /tmp/vars.tsv > /tmp/vars.keep || true
            printf '%s\t%s\n' "$1" "$2" >> /tmp/vars.keep
            mv /tmp/vars.keep /tmp/vars.tsv
            echo "$1 will be set on this deploy"
          }
          set_var APP_ORIGIN "$STUDIO_APP_ORIGIN"
          set_var MAIN_SITE_ORIGIN "$STUDIO_MAIN_SITE_ORIGIN"

      - name: Deploy, carrying every existing var forward
        run: |
          set -e
          ARGS=()
          while IFS=$'\t' read -r name value; do
            [ -n "$name" ] || continue
            ARGS+=(--var "$name:$value")
          done < /tmp/vars.tsv
          echo "re-applying ${#ARGS[@]} existing var(s) so none are wiped"
          npx wrangler deploy --env staging "${ARGS[@]}"

      # The NAME matters: studio/worker/auth/callback.ts reads
      # env.STUDIO_HANDOFF_SECRET. Workflow 4 used to upload this under a
      # name nothing reads, so the secret landed on the worker and sign-in
      # still answered AUTH_NOT_CONFIGURED with no error to explain why.
      # It must be byte-identical to the secret on levonis-staging.
      - name: Upload the Studio handoff shared secret
        env:
          STUDIO_HANDOFF_SECRET: ${{ secrets.STUDIO_HANDOFF_SECRET }}
        run: |
          if [ -n "$STUDIO_HANDOFF_SECRET" ]; then
            printf '%s' "$STUDIO_HANDOFF_SECRET" | npx wrangler secret put STUDIO_HANDOFF_SECRET --env staging
          else
            echo "STUDIO_HANDOFF_SECRET not set — Studio sign-in stays honestly disabled"
          fi

      # THE CHECK THAT WAS MISSING. Three times the owner reported the Studio
      # unchanged, and three times the answer came from reading git history
      # afterwards instead of from the deploy saying so. The third time the
      # cause was that the Studio could not build at all.
      #
      # Vite content-hashes every asset filename, so if the live domain serves
      # the exact file this run just built, byte for byte, then the bundle out
      # there IS the bundle in here. That is the whole claim, checked rather
      # than assumed — and it fails loudly instead of leaving the owner to
      # notice.
      - name: Prove the live Studio serves the bundle this run built
        run: |
          set -e
          S=https://studio.levonis-iq.com
          LOCAL=$(grep -rl '\.tb-logo { display: none !important; }' dist/client/assets/*.js | head -1)
          if [ -z "$LOCAL" ]; then
            echo "::error::no built asset carries the branding rule — studio/tests/editor-theme.test.mjs should have caught this"
            exit 1
          fi
          NAME=$(basename "$LOCAL")
          echo "the branding rule is in $NAME ($(wc -c < "$LOCAL") bytes)"

          # A fresh deploy takes a moment to propagate to every edge.
          for i in $(seq 1 10); do
            curl -fsS --max-time 30 "$S/assets/$NAME" -o /tmp/live.js && break
            echo "attempt $i: $NAME not served yet"
            sleep 6
          done
          if [ ! -s /tmp/live.js ]; then
            echo "::error::$S does not serve $NAME — the live Studio is running an older bundle"
            exit 1
          fi

          if cmp -s "$LOCAL" /tmp/live.js; then
            echo "live $NAME is byte-identical to the file this run built"
          else
            echo "::error::$S serves a DIFFERENT $NAME than this run built"
            exit 1
          fi

          grep -q '\.tb-logo { display: none !important; }' /tmp/live.js \
            || { echo "::error::the live bundle does not carry the wordmark rule"; exit 1; }
          echo "the live Studio carries the LEVONIS branding"

      # The whole point of the change: a desktop keeps the threaded core, an
      # iPad does not, and everything else is identical.
      - name: Verify the isolation headers per platform
        working-directory: .
        run: |
          S=https://studio.levonis-iq.com
          sleep 5

          desktop=$(curl -s -o /dev/null -D - --max-time 25 "$S/" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            | grep -ci '^cross-origin-embedder-policy: require-corp' || true)
          echo "desktop COEP present: $desktop"

          ipad=$(curl -s -o /dev/null -D - --max-time 25 "$S/" \
            -A "Mozilla/5.0 (iPad; CPU OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            | grep -ci '^cross-origin-embedder-policy' || true)
          echo "iPad COEP present: $ipad"

          nosniff=$(curl -s -o /dev/null -D - --max-time 25 "$S/" \
            -A "Mozilla/5.0 (iPad; CPU OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1" \
            | grep -ci '^x-content-type-options: nosniff' || true)
          echo "iPad still gets nosniff: $nosniff"

          [ "$desktop" = "1" ] || { echo "::error::a desktop lost cross-origin isolation — it should keep threads"; exit 1; }
          [ "$ipad" = "0" ] || { echo "::error::an iPad is still cross-origin isolated — it will still take the threaded core"; exit 1; }
          [ "$nosniff" = "1" ] || { echo "::error::an iPad lost the other security headers"; exit 1; }

      - name: Confirm the vars survived
        run: |
          curl -sS -f \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/levonis-studio-staging/settings" \
            -o /tmp/after.json
          BEFORE=${{ steps.vars.outputs.count }}
          AFTER=$(jq -r '[.result.bindings[] | select(.type == "plain_text")] | length' /tmp/after.json)
          echo "plain-text vars: $BEFORE before, $AFTER after"
          jq -r '[.result.bindings[] | select(.type == "plain_text") | .name] | sort | join(", ")' /tmp/after.json
          [ "$AFTER" -ge "$BEFORE" ] || { echo "::error::the deploy dropped $((BEFORE - AFTER)) var(s)"; exit 1; }
