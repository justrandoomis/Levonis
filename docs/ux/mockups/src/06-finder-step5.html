<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="shot" content="full=0;height=844">
<title>مرشد الطابعات: السؤال 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap">
<!-- Levonis UX mockup. Light theme tokens from src/index.css (THEME TOKENS, light).
     Product data and photographs: the live public API, GET only. -->
<style>
:root{
  --canvas:#f3f0ea; --surface:#fbfaf7; --raised:#ffffff; --selected:#ebe6dc; --line:#e0dace; --line-2:#d3ccbf;
  --ink:#16181b; --ink-2:#45484e; --muted:#5f6268; --faint:#8b8d92;
  --gold:#7a6331; --gold-fill:#bca36b; --gold-ink:#111214;
  --charcoal:#0e1013; --charcoal-2:#14171c; --ivory:#f3f0ea;
  --ok:#1b7046; --ok-soft:#e3efe7; --warn:#92590c; --warn-soft:#f5ead6; --danger:#b3343a; --pro:#bb3e52;
  --focus:#7a6331;
  --shadow-2:0 12px 32px -16px rgb(22 24 27/.22); --shadow-3:0 28px 70px -28px rgb(22 24 27/.34);
  --r-card:14px; --gut:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0;line-height:1.5}
.screen{width:390px;min-height:844px;margin:0 auto;position:relative;overflow:hidden;background:var(--canvas)}
.num{unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.ltr{direction:ltr;unicode-bidi:isolate}
.ic{display:block;flex:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0}

/* ---------- top bar */
.topbar{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);
  background:rgb(243 240 234/.88);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid transparent}
.topbar.edge{border-bottom-color:var(--line)}
.iconbtn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);position:relative;flex:none}
.iconbtn.bare{background:transparent;border-color:transparent}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;font-size:16px;font-weight:800;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title small{display:block;font-size:11.5px;color:var(--muted);line-height:16px}
.dotbadge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--canvas);font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--canvas)}

/* ---------- section heads */
.sec{padding:0 var(--gut)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sechead h2{font-size:17px;line-height:26px;font-weight:800}
.sechead h2 small{font-size:12px;color:var(--muted);font-weight:600;margin-inline-start:6px}
.seeall{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:44px;padding:0 2px}

/* ---------- chips */
.chips{display:flex;gap:6px;overflow:hidden;padding:0 var(--gut)}
.chip{height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.chip .c{font-weight:600;color:var(--muted)}
.chip.on .c{color:rgb(243 240 234/.7)}
.chip.x{background:var(--selected);border-color:transparent;color:var(--ink);padding-inline-end:8px}

/* ---------- PRODUCT CARD (compact) */
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;min-width:0;position:relative}
.pc-media{position:relative;aspect-ratio:6/5;background:var(--charcoal);overflow:hidden}
.pc-media img{width:100%;height:100%;object-fit:cover;object-position:50% 4%;display:block}
.pc-cmp{position:absolute;top:6px;inset-inline-start:6px;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;
  background:rgb(14 16 19/.52);backdrop-filter:blur(8px);color:#f3f0ea;border:1px solid rgb(255 255 255/.14)}
.pc-cmp.on{background:#f3f0ea;color:var(--ink);border-color:#f3f0ea}
.pc-sale{position:absolute;top:8px;inset-inline-end:8px;height:18px;padding:0 6px;border-radius:5px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em;display:grid;place-items:center}
.pc-body{padding:9px 10px 10px;display:flex;flex-direction:column;flex:1;min-width:0}
.pc-name{font-size:12.5px;line-height:17px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px;text-align:right}
.pc-price{margin-top:6px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;min-width:0}
.pc-price .from{font-size:10px;color:var(--muted);font-weight:600}
.pc-price .amt{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:20px}
.pc-price .cur{font-size:10.5px;font-weight:700;color:var(--ink-2)}
.pc-member{display:flex;align-items:center;gap:4px;font-size:10.5px;line-height:15px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden}
.pc-member b{color:var(--pro);font-weight:800;letter-spacing:.02em}
.pc-member .ic{color:var(--pro)}
.pc-avail{margin-top:auto;padding-top:7px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;line-height:15px;font-weight:700}
.av{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.av i{width:6px;height:6px;border-radius:9px;display:block;flex:none}
.av.ok{color:var(--ok)} .av.ok i{background:var(--ok);box-shadow:0 0 0 3px rgb(27 112 70/.14)}
.av.pre{color:var(--warn)} .av.pre i{border:1.5px solid var(--warn);width:7px;height:7px}
.av.off{color:var(--muted)} .av.off i{background:var(--faint)}
.pc-avail .qty{font-size:10.5px;color:var(--muted);font-weight:600}
.pc-avail .qty.low{color:var(--warn)}

.rail{display:flex;gap:10px;padding:0 var(--gut);overflow:hidden}
.rail .pc{width:148px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 var(--gut)}

/* ---------- buttons */
.btn{height:44px;border-radius:12px;padding:0 16px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--canvas)}
.btn.gold{background:var(--gold-fill);color:var(--gold-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.ghost-dark{border:1px solid rgb(243 240 234/.22);color:#f3f0ea}
.btn.sm{height:36px;border-radius:10px;font-size:12.5px;padding:0 12px}
.btn.block{width:100%}

/* ---------- bottom nav (the current floating bar) */
.bnav{direction:ltr;position:absolute;inset-inline:10px;bottom:14px;height:66px;display:flex;align-items:center;justify-content:space-between;z-index:30}
.bnav .pill{width:142px;height:62px;border-radius:20px;background:#1b1e23;color:#c9ccd2;display:flex;align-items:center;justify-content:space-around;box-shadow:0 10px 30px -12px rgb(0 0 0/.5)}
.bnav .pill div{display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:1px}
.bnav .blob{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#6f7a46,#3b4629 70%);box-shadow:0 10px 26px -8px rgb(59 70 41/.7);display:grid;place-items:center;margin-top:-4px}
.bnav .blob span{display:flex;gap:9px}
.bnav .blob span i{width:9px;height:17px;border-radius:9px;background:#f3f0ea;display:block}

/* ---------- misc */
.hair{height:1px;background:var(--line);margin:0 var(--gut)}
.muted{color:var(--muted)}
.cap{font-size:12px;color:var(--muted);line-height:18px}
.field{height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font-size:13.5px}
.seg{display:flex;background:var(--selected);border-radius:10px;padding:3px;gap:2px}
.seg span{flex:1;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg span.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgb(22 24 27/.1)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.2)}
.switch.on{background:var(--ok)}
.switch.on::after{inset-inline-start:auto;inset-inline-end:3px}
.dark{background:var(--charcoal);color:var(--ivory)}

.fbar{display:flex;align-items:center;gap:10px;padding:8px var(--gut) 0;height:56px}
.fbar .p{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.fbar a{font-size:13px;font-weight:700;color:var(--ink-2);min-width:40px;text-align:start;min-height:44px;display:grid;place-items:center}
.prog{display:flex;gap:4px;padding:6px var(--gut) 0}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line);display:block}
.prog i.done{background:var(--ink)}
.prog i.cur{background:linear-gradient(to left,var(--ink) 45%,var(--line) 45%)}
.q{padding:22px var(--gut) 0}
.q h1{font-size:25px;line-height:36px;font-weight:800;letter-spacing:-.01em}
.q p{font-size:13px;color:var(--muted);line-height:20px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px var(--gut) 0}
.tile{text-align:start;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 12px 12px;min-height:118px;display:flex;flex-direction:column;gap:8px}
.tile .g{width:36px;height:36px;border-radius:11px;background:var(--selected);display:grid;place-items:center;color:var(--ink)}
.tile b{font-size:14px;line-height:20px;font-weight:800}
.tile span{font-size:11.5px;line-height:16px;color:var(--muted)}
.tile.on{background:var(--raised);border-color:var(--ink);box-shadow:var(--shadow-2)}
.tile.on .g{background:var(--ink);color:var(--canvas)}
.tile .ck{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.ffoot{position:absolute;inset-inline:0;bottom:0;padding:12px var(--gut) 26px;display:flex;gap:10px;background:linear-gradient(to top,var(--canvas) 70%,rgb(243 240 234/0))}
.answers{display:flex;flex-wrap:wrap;gap:6px;padding:14px var(--gut) 0}
.answers .a{height:28px;border-radius:14px;padding:0 10px;background:var(--selected);font-size:11.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center}
.rows{padding:14px var(--gut) 0;display:flex;flex-direction:column;gap:8px}
.orow{text-align:start;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-height:64px}
.orow .g{width:38px;height:38px;border-radius:11px;background:var(--selected);display:grid;place-items:center;color:var(--ink);flex:none}
.orow .t{flex:1}
.orow b{display:block;font-size:14px;font-weight:800;line-height:20px}
.orow span{display:block;font-size:11.5px;color:var(--muted);line-height:16px}
.orow .rk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800}
.orow.on{background:var(--raised);border-color:var(--ink)}
.orow.on .g{background:var(--ink);color:var(--canvas)}
.orow.on .rk{background:var(--ink);border-color:var(--ink);color:#fff}
.limit{padding:10px var(--gut) 0;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
</style>

</head>
<body>
<div class="screen" style="height:844px">
<div class="fbar">
  <button class="iconbtn" aria-label="إغلاق المرشد"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="p" aria-live="polite">السؤال <span class="num">5</span> من <span class="num">6</span></div>
  <a href="#">تخطَّ</a>
</div>
<div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="6" aria-valuenow="5"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class=""></i></div>
<div class="answers" aria-label="إجاباتك">
  <span class="a">مشروع تجاري</span><span class="a">Filament</span><span class="a num">1.25 – 2.5 مليون</span><span class="a">لا مانع من الطلب المسبق</span>
</div>
<div class="q" style="padding-top:14px"><h1>ما الأهم لك؟</h1><p>اختر أمرين على الأكثر، بالترتيب. الأول يُحسب أكثر.</p></div>
<div class="rows" role="group" aria-label="الأولويات"><button class="orow" aria-pressed="false"><span class="g"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg></span><span class="t"><b>الجودة والدقة</b><span>طبقات أنعم وتفاصيل أدق</span></span><span class="rk num"></span></button><button class="orow on" aria-pressed="true"><span class="g"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg></span><span class="t"><b>السرعة</b><span>إنجاز أكثر في وقت أقل</span></span><span class="rk num">1</span></button><button class="orow" aria-pressed="false"><span class="g"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10v4h3l4 3.5v-11L8 10z"/><path d="M16 9.5c.8.8.8 4.2 0 5"/></svg></span><span class="t"><b>الهدوء</b><span>للبيت أو المكتب</span></span><span class="rk num"></span></button><button class="orow on" aria-pressed="true"><span class="g"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a8 8 0 100 16c1.2 0 1.6-.9 1.2-1.8-.5-1 .2-2.2 1.3-2.2H17a3 3 0 003-3c0-5-3.6-9-8-9z"/><circle cx="8" cy="11" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg></span><span class="t"><b>تعدد الألوان</b><span>أكثر من لون في الطبعة</span></span><span class="rk num">2</span></button><button class="orow" aria-pressed="false"><span class="g"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L15 9M14 5v2M18 9h2M17.5 5.5l-1.3 1.3M19 13l-1.3-1.3"/></svg></span><span class="t"><b>سهولة الاستخدام</b><span>تشغيل سريع وصيانة قليلة</span></span><span class="rk num"></span></button><button class="orow" aria-pressed="false"><span class="g"><svg class="ic " width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></span><span class="t"><b>حجم الطباعة</b><span>قطع كبيرة دفعة واحدة</span></span><span class="rk num"></span></button></div>
<div class="limit"><svg class="ic " width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>اخترت أمرين. ألغِ أحدهما لتختار غيره.</div>
<div class="ffoot"><button class="btn ghost" style="width:104px">رجوع</button><button class="btn primary" style="flex:1">التالي</button></div>
</div>
</body>
</html>
