<script>self.__next_f.push([1,"ull,{\"width\":846,\"height\":750,\"src\":\"https://store.bblcdn.com/s1/default/e18eb628c8344757b3ee3fb9152d5161/Accessories.png\",\"alt\":\"PTFE Tube (185mm*2+225mm*2+900mm*1)\"}],[\"$\",\"h3\",null,{\"children\":\"PTFE Tube (185mm*2+225mm*2+900mm*1)\"}]]}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"$Ld0\",null,{\"width\":846,\"height\":750,\"src\":\"https://store.bblcdn.com/4731f4c55a/4c37780258624baea30dc314921b4c1c/Product-AMS-2-Pro--Picture-4.jpg\",\"alt\":\"Bambu Bus Cable-6Pin\"}],[\"$\",\"h3\",null,{\"children\":\"Bambu Bus Cable-6Pin\"}]]}]]}]}]]}],[\"$\",\"div\",null,{\"id\":\"faq\",\"children\":[[\"$\",\"$L6ed\",null,{\"title\":\"Explore more about AMS 2 Pro\"}],[\"$\",\"$L6ef\",null,{\"faqItems\":[{\"question\":\"1.There is an independent power port on the AMS 2 Pro in addition to the 6-pin port. Is this necessary?\",\"answer\":\"<span>When the H2D is used with a single AMS 2 Pro, all functions, including automatic feeding and drying, can be utilized without an external <a style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'>power adapter</a>.<br/>When the H2D is used with more than one AMS 2 Pro, if some AMS 2 Pro units are used for multi-color printing while others are used for filament drying, then the AMS 2 Pro units used for drying require an external <a style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'>power adapter</a>. The external power adapter can be purchased from the Bambu Lab official store.</span>\"},{\"question\":\"2.Can the AMS 2 Pro be used with all series printers?\",\"answer\":\"Yes, AMS 2 Pro is compatible with all printers. <br /> The AMS 2 Pro requires specific accessory configurations for various Bambu Lab 3D printers.<br /><br/>See the  <a style='color: #00CD0A' href='https://wiki.bambulab.com/ams/manual/multi-model-AMS-compatibility-guide' target='_blank'>Multiple AMS Units Connection Guide</a> for detailed setup instructions.\"},{\"question\":\"3.Can AMS and AMS 2 Pro be used at the same time for printing?\",\"answer\":\"Yes, you can use both AMS and AMS 2 Pro on one H2D.\"},{\"question\":\"4.Can I dry filament while printing?\",\"answer\":\"Certain models currently support the Simultaneous Drying and Printing Function.Please refer to the <a style='color: #00CD0A' href='https://wiki.bambulab.com/en/ams-2-pro/manual/drying-function' target='_blank'> Wiki </a> for the minimum supported firmware version and operation guidelines.\"},{\"question\":\"5.Can I get power from the printer for drying?\",\"answer\":\"When using <b>A1/P1/X1 series </b>, One Switching Adapter is required for each AMS 2 Pro unit. <b>H2/P2/X2D printers</b> can power one AMS 2 Pro unit for drying without the switching adapter. To dry filaments in multiple units simultaneously, each additional AMS 2 Pro unit requires its own Switching Adapter.\"},{\"question\":\"6.Does it support standalone drying without connecting to the printer?\",\"answer\":\"When using the AMS 2 Pro drying function, the AMS 2 Pro must be connected to the printer via a 6-pin bus cable to ensure that the printer is powered on and set to filament drying mode.<br/>The AMS 2 Pro cannot perform standalone drying without a connection to the printer.\"}]}]]}]]}]\n"])</script>
