<!doctype html>
<!--
  THE SHELL IS THE FIRST FRAME THE CUSTOMER SEES.

  Everything here runs before a single byte of React. Four of the five lines
  below exist because, without them, the first thing a visitor on an Iraqi
  mobile connection saw was a WHITE PAGE — on a store whose every screen is
  black — for as long as the entry bundle took to parse.

  lang="ar" dir="rtl"  The store is Arabic-first. `LanguageContext` rewrites
                       both at runtime for a visitor who has chosen English or
                       Kurdish, but the DEFAULT has to be right, because the
                       first paint happens before that effect runs: with
                       lang="en" the browser picked Latin line-breaking and
                       Latin font fallbacks for Arabic text, and a screen
                       reader announced the page in the wrong language.

  the theme script     The app has two themes, light (the default) and dark,
                       chosen in Settings → «المظهر». The one inline script
                       below reads that choice and writes `data-theme`,
                       `color-scheme` and the two browser-chrome metas BEFORE
                       anything paints, so a light page never flashes black
                       and a dark one never flashes ivory. The CSP allows it
                       by hash and nothing else inline (THEME_BOOT_SCRIPT in
                       worker/lib/securityPolicy.ts — edit both or neither;
                       tests/themeSystem.test.ts holds them together).

  theme-color          Paints the mobile browser's own chrome — the address
                       bar and the status area — in the page's own ground, so
                       the app does not sit in a frame of the other colour.

  the inline background  The one style rule that must not wait for a
                       stylesheet. `index.css` is a separate request; until it
                       arrives the page is whatever the browser decided — so
                       the ground is painted here, per theme.

  THE FONT IS FETCHED FROM HERE, NOT FROM `@import` INSIDE index.css.
  A CSS `@import` of a remote stylesheet is discovered only AFTER index.css has
  been downloaded and parsed, and it blocks rendering while it resolves. That
  made three serialised round trips before any text could paint: index.css →
  the Google stylesheet → the font file. As a <link> in the head, the request
  starts in the same instant as the stylesheet's, and `preconnect` warms the
  TLS handshake to the font host while that is still in flight.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ece6da" />
    <title>LEVONIS — متجر الطباعة ثلاثية الأبعاد في العراق</title>

    <!--
      THE SNIPPET GOOGLE PRINTS UNDER THE LINK.

      This document carried `og:description` and `twitter:description` — which
      are what a CHAT CARD unfurls from — and no `name="description"` at all.
      Those are different tags read by different things: PageSpeed's SEO
      section reports «Document does not have a meta description», and a search
      engine with nothing to read writes the snippet from whatever scrap of the
      page it can find. On a SPA whose `#root` is empty, that scrap is nothing.

      A PRODUCT PAGE OVERWRITES THIS before the HTML ever reaches a crawler —
      `worker/lib/socialPreview.ts` rewrites `description` alongside the two
      Open Graph tags, for the four `/product/*`-shaped paths that
      `run_worker_first` sends through the Worker. What stays here is what a
      search for the SHOP ITSELF should show.

      NO `<link rel="canonical">`, AND THAT IS DELIBERATE. One document is
      served on the apex AND on every merchant subdomain AND on every SPA
      route, so a static canonical would tell Google that every page of every
      shop is this one page — which is worse than having none. A canonical has
      to be written per request, from the Host and the path, and that belongs
      with the per-product injection rather than in a file that cannot see
      either.
    -->
    <meta
      name="description"
      content="متجر Levonis للطباعة ثلاثية الأبعاد في العراق: طابعات FDM وراتنج، خيوط فلامنت، قطع غيار وملحقات، وخدمة طباعة حسب الطلب مع توصيل داخل العراق."
    />

    <!--
      THE SHOP'S OWN FACE, IN THE SHARE CARD.

      Until now this document declared NO icon and NO Open Graph tags at all.
      The consequences were both things the owner reported: the browser tab
      showed a generic globe, and a link pasted into Instagram, Telegram,
      WhatsApp or Messenger unfurled with no picture and no description —
      because there was nothing for a crawler to read.

      The card image is the logo that already lives in R2 at a PUBLIC key,
      served through the Worker's own /files route. It is verified anonymously
      fetchable (200, 107,218 bytes), which is the only property that matters
      here: a social crawler arrives with no cookie and no session, and an
      image it cannot fetch is an image it will not show.

      A relative URL is correct for the icons — the browser resolves it against
      the page. og:image is NOT: every crawler requires an ABSOLUTE url, and
      several silently drop a relative one. `og:url` and `og:image` are
      therefore written against the canonical origin.

      THESE ARE THE DEFAULTS, AND ONLY THE DEFAULTS. A product link, and a
      store's own home on its own host, overwrite og:title, og:description and
      og:image in the Worker before the HTML ever reaches the crawler — see
      worker/lib/socialPreview.ts. What stays here is what a share of the
      platform ITSELF should say.

      THE KEY IS MIRRORED HERE, NOT DECIDED HERE. `src/lib/siteLogo.ts` is the
      single place the shop's mark is named; this document cannot import it,
      because the shell is parsed before any module runs and nothing templates
      it on the way out. So `tests/siteMedia.test.ts` holds the two absolute
      image tags further down to that module's constants and fails when either
      drifts — a check at test time standing in for an import at run time.
      The owner swaps the bytes under that fixed name in the bucket; `/files/*`
      answers the brand folder with a short revalidating Cache-Control rather
      than a year of `immutable` for exactly that reason
      (worker/routes/uploads.ts, `isRewritableMediaKey`).
    -->

    <!--
      THE HOME-SCREEN AND TAB ICONS ARE PER HOST.

      THIS DOCUMENT IS SHARED. The asset layer serves these same bytes on
      levonis-iq.com and on every store's subdomain, so a link here that names
      a file names the SAME file on every shop — and these links are exactly
      what iOS reads at «إضافة إلى الشاشة الرئيسية» (it prefers
      `apple-touch-icon` to anything in the manifest) and what every browser
      paints in the tab. Pointed at the platform's PNGs, they put the LEVONIS
      mark on the home screen of every customer who installed a merchant's
      shop, under the shop's own name.

      So they point at `/store-icon/*`, three STABLE paths the Worker answers
      per Host (worker/routes/manifest.ts `storeIconRoute`, in
      `run_worker_first` in all three environments of wrangler.jsonc): on a
      store's host, the store's own PNG rendition of its logo
      (worker/lib/storeIcons.ts); on the apex — and on a store with no
      renditions yet, or a suspended one — the platform's committed PNG for the
      same role, `/icons/*.<rev>.png`, read through the asset binding. Answered
      with a revalidating Cache-Control and an ETag, so a merchant's new logo
      reaches a tab within minutes and a revalidation costs a 304.

      EVERY ONE IS A PNG. iOS does not accept WebP for `apple-touch-icon`: it
      does not fall back to another link and it reports nothing — it uses A
      SCREENSHOT OF THE PAGE as the home-screen icon. 180x180 is the size iOS
      asks for, and `sizes` is declared because iOS chooses between several
      `apple-touch-icon` links by comparing exactly that attribute.

      NO WEBP `rel="icon"` ANY MORE, and that is the decision. It pointed at
      the platform logo in R2, and a browser picks among several `rel="icon"`
      links by its own rules (by `sizes` in Chromium, by document order in
      others) — a platform link beside the per-host ones would put the LEVONIS
      mark in some browsers' tab on a merchant's shop. Every tab icon here is
      per host; 32 px for the tab, 192 px for the bookmark and tab-switcher
      tiles that ask for a larger one.

      THE PLATFORM'S PNGs ARE A FORK OF THE LOGO, NOT A COPY THAT REFRESHES
      ITSELF. They are binaries committed to the repository, produced from
      `/files/UiUx/Logo/Logo.webp` by `scripts/build-pwa-icons.mjs` (not part
      of `npm run build`), and their names carry the logo's revision
      (`.bc80fc2b.`): replacing the object in R2 changes the share card above
      and NOTHING an icon shows until someone runs the generator, commits the
      files and bumps `VERSION` in public/sw.js. `src/lib/siteLogo.ts` names
      those paths once; tests/storeIcons.test.ts holds the Worker's fallback
      table to it.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/store-icon/apple-touch.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/store-icon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/store-icon/192.png" />

    <meta property="og:site_name" content="LEVONIS" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_IQ" />
    <meta property="og:title" content="LEVONIS — متجر الطباعة ثلاثية الأبعاد" />
    <meta
      property="og:description"
      content="طابعات وخيوط وقطع الطباعة ثلاثية الأبعاد في العراق، مع خدمة طباعة حسب الطلب."
    />
    <meta property="og:url" content="https://levonis-iq.com/" />
    <meta property="og:image" content="https://levonis-iq.com/files/UiUx/Logo/Logo.webp?v=bc80fc2b" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LEVONIS — متجر الطباعة ثلاثية الأبعاد" />
    <meta
      name="twitter:description"
      content="طابعات وخيوط وقطع الطباعة ثلاثية الأبعاد في العراق، مع خدمة طباعة حسب الطلب."
    />
    <meta name="twitter:image" content="https://levonis-iq.com/files/UiUx/Logo/Logo.webp?v=bc80fc2b" />

    <!--
      INSTALLING THE SHOP AS AN APP.

      «أريد إضافة ميزة تحميل التطبيق للموقع» — the owner asked for the site to
      be installable on iPhone, Android and Huawei, in every browser. Five
      lines here are what make the browser offer it; the rest of the work is
      the service worker and the manifest route.

      THE MANIFEST IS A WORKER ROUTE, NOT A FILE. `/manifest.webmanifest` is
      answered by the Worker (see worker/routes/manifest.ts) because ONE
      DEPLOYMENT SERVES EVERY STORE: ali3d.levonis-iq.com runs this same
      document. A static manifest would make every merchant's shop install
      itself onto the customer's home screen as "LEVONIS", with LEVONIS's
      icon, on a subdomain that presents itself as that merchant. The Worker
      classifies the Host and answers with that host's own name and mark. The
      href stays RELATIVE for exactly the same reason — the browser resolves
      it against the page, so each host asks its own origin.

      `mobile-web-app-capable` is the standard name; `apple-mobile-web-app-*`
      are the legacy WebKit ones, and they are not optional: Safari on iOS
      fires no `beforeinstallprompt` and reads no `display` field from the
      manifest. Share -> «إضافة إلى الشاشة الرئيسية» is the ONLY install path
      on an iPhone, and these three tags are the only thing that decides what
      the result looks like — without them iOS opens the home-screen entry in
      a browser tab with a visible address bar, which is not an app.

      THE STATUS BAR IS `black`, NOT `black-translucent`, AND THAT IS A
      DECISION. `black-translucent` extends the web view UNDER the clock and
      the battery, and leaves it to the page to pad itself with
      `env(safe-area-inset-top)`. The main header does that
      (`.lv-character-header`, `.lv-character-fallback-header` in index.css)
      but the full-screen shells do not — Settings, the two checkouts and the
      admin console draw their own sticky top bar with no top inset, so
      translucency would slide the shop's name and its back arrow underneath
      the status bar on every notched iPhone. `black` gives an opaque status
      bar in the page's own ground (`black` in the dark theme, `default` — ivory
      with dark glyphs — in the light one; the theme script below rewrites the
      content before iOS reads it), and the web view starts below it. `viewport-fit=cover` above is still
      right and still needed: it is the BOTTOM inset (the home indicator) that
      every sheet in the app already pads for.

      NO `apple-touch-startup-image`. It is the obvious next tag and it is a
      trap: iOS matches a splash image by exact device resolution and
      orientation, so covering the phones people actually own means roughly
      thirty <link> tags and thirty generated PNGs that go stale with every
      new iPhone. Without them iOS paints the manifest's `background_color`,
      which is the ground this page paints first (ivory on the platform, black
      on a merchant's dark store). The correct splash screen is therefore the
      one we get for free. Do not add them.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      NO `apple-mobile-web-app-title`, AND IT MUST NOT COME BACK.

      It was here, set to "LEVONIS", and it was the one tag that defeated the
      whole per-host manifest. iOS prefers this tag over the manifest's
      `short_name` for the home-screen label, and THIS DOCUMENT IS SHARED: the
      asset layer serves the same bytes on levonis-iq.com and on every
      merchant subdomain (only `/product/*` is rewritten, by assetWithPreview).
      So a customer on ali3d.levonis-iq.com read «ثبّت متجر علي على جهازك» in
      the install sheet, followed the steps, and got an icon labelled LEVONIS —
      exactly the deception worker/routes/manifest.ts was built to prevent,
      reintroduced here on the one platform with no one-tap install.

      Without the tag, modern iOS falls back to the manifest's `short_name`,
      which IS per host. Older iOS falls back to <title>, and
      src/components/pwa/HostAppleIdentity.tsx owns that on a merchant host for
      the same reason. Both fallbacks therefore name the shop.

      The platform's own name is not lost: on the apex the manifest's
      `short_name` is LEVONIS and <title> is LEVONIS, which is what this tag
      was saying in the first place.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>(function(){var p,d,t,r=document.documentElement,m,b;try{p=localStorage.getItem('levonis.theme.v1')}catch(e){}d=p==='dark'||(p==='system'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);t=d?'dark':'light';r.setAttribute('data-theme',t);r.style.colorScheme=t;m=document.querySelector('meta[name="theme-color"]');b=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(m)m.setAttribute('content',d?'#0b0c0f':'#ece6da');if(b)b.setAttribute('content',d?'black':'default')})()</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      300..900 is the range the store actually uses — light through black, and
      nothing outside it (grep: font-light … font-black).

      IT SAVES NOTHING, AND THAT IS WORTH WRITING DOWN. An earlier version of
      this comment claimed a narrower axis means a smaller download. Measured
      against Google Fonts, it does not: `wght@200..1000` and `wght@300..900`
      resolve to byte-identical woff2 files (30,896 / 16,648 / 33,820 B for the
      three subsets), because the service serves one variable font per family
      and the axis in the query only bounds what CSS may ask for. The narrower
      range is kept because it states the truth about this design, not because
      it is faster.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap"
    />

    <style>
      /* Before the stylesheet, before React: the ground of the theme the
         script above chose, so the first frame is already the right colour. */
      html, body { background-color: #ece6da; margin: 0; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0b0c0f; }
      #root { min-height: 100dvh; background-color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
