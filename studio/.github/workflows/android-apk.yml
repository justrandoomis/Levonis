name: Verify and release LEVO Studio Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"
      - "mobile/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: levo-studio-android-${{ github.ref }}
  cancel-in-progress: true

env:
  LEVO_EXPECTED_CERT_SHA256: 7a1e2f090ca588687070bf90334812e38c7431ba9f6118473f2b1925e81321e1

jobs:
  validate:
    name: Validate Android source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies and test
        run: |
          npm ci
          npm ci --prefix mobile
          npm test

      - name: Build bundled mobile application
        run: npm run build --prefix mobile

      - name: Synchronize Android project
        run: cd mobile && npx cap sync android

      - name: Test bridge and compile non-distributable debug build
        run: |
          chmod +x mobile/android/gradlew
          cd mobile/android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

  release:
    name: Sign and publish production APK
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LEVO_KEYSTORE_BASE64: ${{ secrets.LEVO_KEYSTORE_BASE64 }}
      LEVO_KEYSTORE_PASSWORD: ${{ secrets.LEVO_KEYSTORE_PASSWORD }}
      LEVO_KEY_ALIAS: ${{ secrets.LEVO_KEY_ALIAS }}
      LEVO_KEY_PASSWORD: ${{ secrets.LEVO_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' mobile/android/app/build.gradle | head -n 1)"
          RELEASE_TAG="v$VERSION_NAME"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android version $RELEASE_TAG"
            exit 1
          fi
          EXISTS=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then EXISTS=true; fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "LEVO_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "LEVO_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          set -euo pipefail
          for variable in LEVO_KEYSTORE_BASE64 LEVO_KEYSTORE_PASSWORD LEVO_KEY_ALIAS LEVO_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing required Android signing secret: $variable"
              exit 1
            fi
          done

      - name: Set up Node.js
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Set up Java
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Build bundled mobile application
        if: steps.release_meta.outputs.exists != 'true'
        run: npm run build --prefix mobile

      - name: Synchronize Android project
        if: steps.release_meta.outputs.exists != 'true'
        run: cd mobile && npx cap sync android

      - name: Restore LEVONIS signing key
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          set -euo pipefail
          printf '%s' "$LEVO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/levo-studio-release.p12"
          chmod 600 "$RUNNER_TEMP/levo-studio-release.p12"
          echo "LEVO_KEYSTORE_PATH=$RUNNER_TEMP/levo-studio-release.p12" >> "$GITHUB_ENV"

      - name: Build signed production APK
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          set -euo pipefail
          chmod +x mobile/android/gradlew
          cd mobile/android
          ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare distributable files
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk"
          sha256sum "LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk" > "LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk.sha256"

      - name: Verify APK integrity and permanent signer
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APK="LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          VERIFY_OUTPUT="$($BUILD_TOOLS/apksigner verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^.*certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          test "$CERT_SHA256" = "$LEVO_EXPECTED_CERT_SHA256"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true'
          unzip -t "$APK"

      - name: Create update manifest
        if: steps.release_meta.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APK="LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk"
          SIZE_BYTES="$(stat -c %s "$APK")"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\)/\1/p' mobile/android/app/build.gradle | head -n 1)"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$LEVO_RELEASE_TAG/$APK"
          jq -n \
            --arg name "LEVO Studio" \
            --arg owner "LEVONIS" \
            --arg versionName "$LEVO_VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg file "$APK" \
            --argjson sizeBytes "$SIZE_BYTES" \
            --arg sha256 "$SHA256" \
            --arg signerCertificateSha256 "$LEVO_EXPECTED_CERT_SHA256" \
            --arg downloadUrl "$RELEASE_URL" \
            '{schemaVersion: 1, name: $name, owner: $owner, channel: "production", versionName: $versionName, versionCode: $versionCode, file: $file, sizeBytes: $sizeBytes, sha256: $sha256, signatureScheme: "APK Signature Scheme v2/v3", signerCertificateSha256: $signerCertificateSha256, downloadUrl: $downloadUrl}' \
            > levo-studio-android.json

      - name: Upload verified APK artifact
        if: steps.release_meta.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LEVO-Studio-Android-v${{ steps.release_meta.outputs.version }}
          path: |
            LEVO-Studio-Android-v${{ steps.release_meta.outputs.version }}.apk
            LEVO-Studio-Android-v${{ steps.release_meta.outputs.version }}.apk.sha256
            levo-studio-android.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: steps.release_meta.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_ARGS=(--verify-tag)
          else
            TAG_ARGS=(--target "$GITHUB_SHA")
          fi
          gh release create "$LEVO_RELEASE_TAG" \
            "LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk" \
            "LEVO-Studio-Android-v$LEVO_VERSION_NAME.apk.sha256" \
            levo-studio-android.json \
            "${TAG_ARGS[@]}" \
            --title "LEVO Studio v$LEVO_VERSION_NAME" \
            --notes "Official LEVONIS Android release. SHA-256 and permanent signer identity are verified by the release workflow."
